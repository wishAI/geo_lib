l_simp_chinese:
 ACOT_DAKKA_ARTILLERY:0 "肮脏大炮"
 ACOT_DAKKA_ARTILLERY_DESC:0 "首先！我们保留弹体部分，这是最重要的地方。啥？啊对，炮筒也要。不要炮塔，太贵了。用质量加速炮台就完事了。\n\n哦对了，把索敌计算机也扔了。没屌用，就像真正的海盗一样瞄准就得了。啥？这玩意比质量加速炮射速还慢？？？\n\n§R把炮筒涂成红的它就能三倍速发射了§!"
 ACOT_DAKKA_TITAN:0 "小行星投放服务"
 ACOT_DAKKA_TITAN_DESC:0 "这什么马德……啊咳……啊咳咯哩塔……啊咳嘶咔咪啦砣……老大！！老大！！这玩意儿咋拼？质量—加—速—器？\n\n破名字，这对我来说也忒复杂忒长了。我就叫它§Y射大石头的大管子！§!\n\n§S超级Dakka！§!\n\n§L大老爹时刻！§!\n\n§G有本事躲开这个啊炮！§!\n\n§R哦，别JB说了，就叫它ADS！不要叫我老大。叫我大可汗！§!\n\n好的老……大可汗。ADS是个嘛？自动Dakka打击？？"
 ACOT_DAKKA_LIGHTNING:0 "她的愤怒"
 ACOT_DAKKA_LIGHTNING_DESC:0 "什么叫男人？一堆小小的，凄惨的，秘密！虚空之母将把他们全部净化！"
 ACOT_DAKKA_TITAN_LIGHTNING:0 "她的敬畏"
 ACOT_DAKKA_TITAN_LIGHTNING_DESC:0 "不再有矿物了。不再有装甲了。不再有舰船了。不再有武器了！不再有恒星系了！不再！不再有帝国了……力量！无穷无尽的力量！！"
 ACOT_DAKKA_COMPUTER_PICKET:0 "醉酒船员（打脸）"
 ACOT_DAKKA_COMPUTER_PICKET_DESC:0 "§Y电老面板说按“任意”键。哪个键是他妈的“任意”键？？§!\n\n掠夺者船员普遍的要么不信任电脑，要么不具备理解使用电脑的能力。还好，他们的军事天赋本能和过量的太空朗姆酒……弥补了这些？"
 ACOT_DAKKA_COMPUTER_LINE:0 "醉酒船员（射手）"
 ACOT_DAKKA_COMPUTER_LINE_DESC:0 "§Y如果掠夺能带来收益，那你最好真的获利！§!\n\n掠夺者船员普遍的要么不信任电脑，要么不具备理解使用电脑的能力。还好，他们的军事天赋本能和过量的太空朗姆酒……弥补了这些？"
 ACOT_DAKKA_COMPUTER_ARTILLERY:0 "醉酒船员（重任）"
 ACOT_DAKKA_COMPUTER_ARTILLERY_DESC:0 "§Y如果第一发没有打中，那就调成全自动然后再来一次耶！你他妈打的是自己人，蠢货！§!\n\n掠夺者船员普遍的要么不信任电脑，要么不具备理解使用电脑的能力。还好，他们的军事天赋本能和过量的太空朗姆酒……弥补了这些？"
 ACOT_DAKKA_COMPUTER_KHAN:0 "完全清醒且训练有素的船员（可汗）"
 ACOT_DAKKA_COMPUTER_KHAN_DESC:0 "§Y大可汗是有史以来最棒的人。他是最聪明狡猾的，拥有最大的大炮和最大的“大炮”，因此，被选中在他的船上服役一定是个酒足饭……无上光荣的使命！§!\n\n大可汗不会允许他船上的船员饮酒，至少不能喝多。他亲自向每一个船员传授了像一个……呃……正常的，老实的人一样生存的知识——完全不再执着于杀戮，抢劫和掠夺。"
 ACOT_DAKKA_COMPUTER_KHAN_SHE:0 "完全清醒且训练有素的船员（可汗）"
 ACOT_DAKKA_COMPUTER_KHAN_SHE_DESC:0 "§Y大可汗是有史以来最棒的人。他是最聪明狡猾的，拥有最大的大炮和最大的“大炮”，因此，被选中在他的船上服役一定是个酒足饭……无上光荣的使命！§!\n\n大可汗现在将允许他船上的船员饮酒，或者酗酒。他亲自向每一个船员传授了像一个……呃……正常的，老实的人一样生存的知识——完全不再执着于杀戮，抢劫和掠夺。"
 DRUNK_PICKET_BEHAVIOR_DESC:0 "§H打脸专家：§!打脸者的人生使命就是去死，这样更重要的人就不会死了。为此，他们会在醉酒昏迷的情况下使用回避动作。（§Y30距离§!）"
 DRUNK_LINE_BEHAVIOR_DESC:0 "§H射击专家：§!射手被要求对一切没有掠夺标记的东西开火，如果他们确实被告知什么东西有还是没有标记的话。他们仍然使用回避运动，但是成功率更低。（§Y50距离§!）"
 DRUNK_ARTILLERY_BEHAVIOR_DESC:0 "§H重任：§!给真正的人的真正岗位。被委以重任的人将在战线后方操作发射重武器，如果他们确实知道哪些东西被归类为重武器的话。他们仍被要求死在大可汗之前，所以他们也不能太靠后。他们采取回避行动的尝试要么令人敬佩，要么蠢得可怜。（§Y80距离§!）"
 DRUNK_KHAN_BEHAVIOR_DESC:0 "§H大可汗战术：§!大可汗是唯一一个完全意识到，在醉酒的情况下尝试实施回避动作只会导致他们被击中的人。他不能阻止别人，但是至少他自己船上的船员足够清醒和聪明，能意识到自我保护的重要性。（§Y150距离§!）"
 marauder_galleon_khan:0 "超级加列战船"
 marauder_galleon_khan_plural:0 "超级加列战船欧~耶耶耶耶耶~~~~"
 tech_dakka_artillery:0 "肮脏大炮"
 tech_dakka_artillery_desc:0 "这个肮脏大炮的确又丑又令人反感，它是海盗和暴徒的通行证，只有没资源制造军用级别武器的人才会用这种东西。然而，一些科学家证实了这些大炮拥有出人意料的高射速，重创了我们一些舰队司令的自信心。如果我们能说服自己，或许这武器真的能用。"
 tech_dakka_titan:0 "海盗的技术奇迹"
 tech_dakka_titan_desc:0 "这个泰坦级轴基舰体简直就是个奇迹，支撑其结构的粗糙装置完全没有损坏的迹象。光从外表看，掠夺者的这些舰船就确确实实是用小行星制造的，仿佛他们有取之不尽的小行星一般。尽管这些战舰粗糙、丑陋，还咋看咋不靠谱，我们的舰队司令偶尔还是会承认，用它们发射些喷气式小行星还是蛮有意思的，至少这些玩意在对付敌方的点防御系统时是很棒的肉盾。但我们的科学家却极力反对，声称决不能让这些玩意儿玷污我们科学的伟大形象！嗯……"
