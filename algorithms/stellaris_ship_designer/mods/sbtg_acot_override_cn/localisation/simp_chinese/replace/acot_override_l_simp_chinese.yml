 tech_energy_torpedo_enig:0 "中子能量鱼雷"
 tech_energy_torpedo_enig_desc:0 "随着新修订的协议要求配备专用的能量火炮，能量鱼雷不再需要同时承担两个角色。因此，我们可以升级现有的中子发射器，让它发射速度更慢但是杀伤力更强的中子弹头。虽然这会让它们面临来自点防御系统的全新威胁，但能部分穿透护盾的能力和大幅提升的火力应该能弥补这些缺陷。"
