 ACOT_ENERGY_TORPEDO_ENIG_DESC:0 "这种鱼雷具有极强的侵蚀性，能迅速摧毁敌方护甲和船体。得益于其作为导弹的特性，它能穿透护盾，但是弹头所含的能量可能会损耗。"
