 ACOT_SCOURGE_MISSILE_1:0 "天灾导弹"
 ACOT_SCOURGE_MISSILE_1_DESC:0 "天灾导弹的战斗部由虫群在星际作战中使用的许多生化化合物组成，其杀伤力已经被证实对最坚固的军舰也具有出人意料的效果。"
 tech_acot_scourge_missile:0 "天灾导弹"
 tech_acot_scourge_missile_desc:0 "天灾导弹的战斗部由虫群在星际作战中使用的许多生化化合物组成，其杀伤力已经被证实对最坚固的军舰也具有出人意料的效果。"
 SMALL_ACOT_PLASMA_SWARM:0 "天灾酸性爆破弹"
 MEDIUM_ACOT_PLASMA_SWARM:0 "天灾酸性爆破弹"
 ACOT_PLASMA_SWARM:0 "天灾酸性爆破弹"
 ACOT_PLASMA_SWARM_DESC:0 "这一虫群在轨道轰炸中使用的高腐蚀性有机物可以封装进弹道容器中，重新作为舰对舰作战弹药使用。"
 ACOT_TITAN_PLASMA_SWARM:0 "女王之怒"
 ACOT_TITAN_PLASMA_SWARM_DESC:0 "天灾虫群女王那规模空前的酸性爆破弹是一种非常致命的泰坦级生物武器，其威力甚至能瞬间粉碎我们最坚固的战列舰。"
 acot_titan_plasma_swarm_tt:0 "对目标 §E20§! 范围内（不包括目标）的所有敌方舰船造成 §Y8,000 - 16,000§! 点伤害。"
 ACOT_SWARM_STRIKE_CRAFT:0 "虫群战斗机"
 ACOT_SWARM_STRIKE_CRAFT_DESC:0 "克隆出来的小型化的虫群标本可以通过接近我们用于舰队内部通信的波长来控制，允许我们将其用作高效的舰载机。"
 tech_acot_swarm_strike_craft:0 "虫群战斗机"
 tech_acot_swarm_strike_craft_desc:0 "克隆出来的小型化的虫群标本可以通过接近我们用于舰队内部通信的波长来控制，允许我们将它们用作高效的舰载机。"
 SWARM_FTL_DRIVE:0 "虫群生物引擎"
 SWARM_FTL_DRIVE_DESC:0 "每个天灾军团的“舰船”中的这个特殊器官似乎能产生曲率能量，使得虫群能够轻松地穿越超空间航道。"
 SHIP_THRUSTER_SWARM:0 "虫群生物推进器"
 SHIP_THRUSTER_SWARM_DESC:0 "天灾飞船中的这种有机成分似乎通过无法解释的方法推动了巨大的船体前进。"
 SWARM_SENSOR_SHIP:0 "虫群生物传感器"
 SWARM_SENSOR_SHIP_DESC:0 "天灾虫群拥有极其强大的感应能力，可以让它们跟踪并感知远在数个恒星系距离之外的猎物，它们很可能是使用这种方法来定位要吞食的新星系。"
 SMALL_DARK_MATTER_REACTOR_SWARM:0 "虫群小型生物精华反应器"
 SMALL_DARK_MATTER_REACTOR_SWARM_DESC:0 "每艘天灾战舰的心脏就像一个反应堆，它可以让有机飞船像发电机一样为其武器供能。"
 LARGE_DARK_MATTER_REACTOR_SWARM:0 "虫群大型生物精华反应器"
 LARGE_DARK_MATTER_REACTOR_SWARM_DESC:0 "每艘天灾战舰的心脏就像一个反应堆，它可以让有机飞船像发电机一样为其武器供能。"
 SMALL_ACOT_ARMOR_SWARM:0 "小型虫群装甲"
 MEDIUM_ACOT_ARMOR_SWARM:0 "中型虫群装甲"
 LARGE_ACOT_ARMOR_SWARM:0 "大型虫群装甲"
 ACOT_ARMOR_SWARM:0 "虫群装甲"
 ACOT_ARMOR_SWARM_DESC:0 "虽然天灾虫群已经拥有坚韧的天然皮肤，但它们似乎还已经发展出一种极其厚实和坚固的甲壳，以进一步提高它们的生存能力，是什么原因驱使它们能够成长到这样的程度？"
 SMALL_ACOT_BIO_SHIELD_SWARM:0 "虫群生物浆质护盾"
 SMALL_ACOT_BIO_SHIELD_SWARM_DESC:0 "尽管虫群是完全有机且不拥有任何能量护盾的，它们的这一器官依旧可以制造一层较薄的生化浆质物，可以作为应付能量武器的临时弱效防护。然而，这一防护似乎无法再生。"
 ACOT_SWARM_COMPUTER_PICKET:0 "虫群蜂巢链接 (哨戒)"
 ACOT_SWARM_COMPUTER_PICKET_DESC:0 "天灾虫群的飞船完美同步。因为它们必然符合虫群的一个绝对和永恒的意志。而且它们被塑造成了这样来服务于这一意志。"
