 ACOT_SWARM_COMPUTER_QUEEN_DESC:0 "天灾虫群的飞船完美同步。因为它们必然符合虫群的一个绝对和永恒的意志。而且它们被塑造成了这样来服务于这一意志。"
 ACOT_SWARM_COMPUTER_STATION:0 "虫群蜂巢链接（离线）"
 ACOT_SWARM_COMPUTER_STATION_DESC:0 "一个有机空间站的工作就是什么都不干，坐等坏事发生然后去世。所以生为一个有机空间站真是最可怕的事情了，不是吗？哦对，我还感觉饿了，得去点个披萨。"
 ACOT_SMALL_ED_WEAPON:0 "小型物质分解器"
