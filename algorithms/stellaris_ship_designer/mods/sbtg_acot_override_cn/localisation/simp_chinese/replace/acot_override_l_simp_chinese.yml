 ACOT_EDI_COMPUTER_SNIPER_DESC:0 "我们人多势众，而你孑然一身。我们会摧毁你。"
 ACOT_EDI_COMPUTER_TITAN:0 "超维度灵能矩阵作战电脑 (泰坦)"
 ACOT_EDI_COMPUTER_TITAN_DESC:0 "我们人多势众，而你孑然一身。我们会摧毁你。"
 ACOT_EDI_COMPUTER_STATION:0 "超维度灵能矩阵作战电脑（离线）"
 ACOT_EDI_COMPUTER_STATION_DESC:0 "听着，伙计，我是台作战电脑。这意味着我要解决问题。不是像“什么是护卫舰海？”这种问题，因为这属于你那些群星超游戏难题的范畴。/n/n而我解决实质性问题。我怎样才能阻止一支安装着超模部件的群星玩家的无敌舰队把我打成一个结构性疏松多孔的新事物？就像这个高维灵能空间站，拥有全面的护盾防护，由我设计，由我制造，你最好希望……不是针对你。<正在播放群星《Fortrss 2》主题曲>"
 titan_ship_ed:0 "超维泰坦"
 tech_point_defense_edi:0 "灵能风暴"
 tech_point_defense_edi_desc:0 "入侵者本身没有物理点防御。但它们的飞船通过每艘飞船内部的特殊装置发射强大的灵能风暴。似乎这些装置可以被任何人改装并适配使用，甚至那些可能没有灵能的人也能操作它。也许入侵者最初并不具有灵能能力？"
 tech_titan_edi:0 "裂谷发生器"
 tech_titan_edi_desc:0 "裂谷发生器，也被称为恐怖之眼——它撕裂空间结构，创造一个可怕眩目的裂谷空间，试图吞噬一切。虽然大多数护盾都能承受巨大的撕裂力，但是没有护盾保护的飞船很可能再也看不到这个星系了。"
 tech_bio_plasma:0 "天灾女王的毒液"
 tech_bio_plasma_desc:0 "天灾女王那巨大的酸液爆破弹是一种极其致命的泰坦级生物武器，即使是最坚固的战舰也不能轻易抵挡。女王用于驱动这一强力武器的器官也是如此巨大，使得我们可以提取并改造它来为我们所用。"
 tech_energy_lance_contingency:0 "肃正光矛设计"
 tech_energy_lance_contingency_desc:0 "奇怪的是，与通常的能量光矛技术相比，肃正光矛对更加类似于小型化的炼狱射线。然而，其能量和伤害输出是相当可观的。而且它们的外观和声音都让人感觉非常危险。"
 tech_perdition_beam_contingency:0 "肃正泰坦光束"
 tech_perdition_beam_contingency_desc:0 "很明显，无论肃正协议的创造者是谁，他们至少也已经足够先进到拥有$sr_dark_matter$知识。然而，这些技术的设计对附近的有机物非常致命。难道它们的创造者也不完全是有机的吗？"
 tech_energy_lance_edi:0 "粉碎光矛"
 tech_energy_lance_edi_desc:0 "这个维度能量武器扭曲了物理定律，用来摧毁所有否认入侵者饥饿的人。"
 acot_modifier_being_purged:0 "预支了时间"
 acot_modifier_being_purged_desc:0 "这个星球被标记上了终结，其上的人口生活在被预支的时间内。除非星球被迅速收复，否则人口将全部化为混沌。"
 tech_nanite_flak_batteries:0 "纳米高射加农炮"
 tech_nanite_flak_batteries_desc:0 "玩弄奇怪的东西往往会在战斗中产生……意外的灵感。"
 ACOT_FLAK_CANNON_NANITES:0 "§v纳米高射加农炮§!"
 ACOT_FLAK_CANNON_NANITES_DESC:0 "射出纳米筒的纳米高射加农炮能迅速地摧毁舰载机和导弹。虽然有着较高的精度和威力，但它们的射速明显抵御传统的动能点防御武器。"
 tech_nanite_autocannon:0 "纳米机关炮"
 tech_nanite_autocannon_desc:0 "如果我们能控制纳米机器人的攻击方向，它们就能成为致命的动能武器。"
 SMALL_ACOT_AUTOCANNON_NANITES:0 "§v小型纳米机关炮§!"
 MEDIUM_ACOT_AUTOCANNON_NANITES:0 "§v中型纳米机关炮§!"
 LARGE_ACOT_AUTOCANNON_NANITES:0 "§v大型纳米机关炮§!"
 ACOT_AUTOCANNON_NANITES:0 "§v纳米机关炮§!"
 ACOT_AUTOCANNON_NANITES_DESC:0 "高度先进的机关炮，能够射出爆裂弹壳，在目标附近形成纳米机器人云。它对护盾效果不佳，但几乎不可能被装甲阻挡。"
