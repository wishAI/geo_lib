 ACOT_ENIGMATIC_SHIELD_EDI:0 "超维度护盾"
 ACOT_ENIGMATIC_SHIELD_EDI_DESC:0 "这些护盾的作用方式与灵能护盾相似，它们构成了入侵者的主要防御工具。"
 ACOT_EDI_COMPUTER_PICKET:0 "超维度灵能矩阵作战电脑 (哨戒)"
 ACOT_EDI_COMPUTER_PICKET_DESC:0 "我们人多势众，而你孑然一身。我们会摧毁你。"
