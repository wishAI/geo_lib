 ACOT_LARGE_ED_WEAPON:0 "大型物质分解器"
 ACOT_EXTRADIMENSIONAL_1:0 "物质分解器"
 ACOT_EXTRADIMENSIONAL_1_DESC:0 "物质分解器是从另一个维度泊来的武器，其核心技术为达到毁灭性的效果歪曲了数个物理定律。"
 tech_acot_matter_disintegrator:0 "物质分解器"
 tech_acot_matter_disintegrator_desc:0 "物质分解器是从另一个维度泊来的武器，其核心技术为达到毁灭性的效果歪曲了数个物理定律。"
 ACOT_POINT_DEFENSE_EDI:0 "高维风暴"
 ACOT_POINT_DEFENSE_EDI_DESC:0 "这些神秘的能量信号似乎起着一种超维度点防御的作用，可以击毁舰载机和导弹。"
 ACOT_PARTICLE_LANCE_EDI:0 "分解光矛"
 ACOT_PARTICLE_LANCE_EDI_DESC:0 "这个维度能量武器扭曲了物理定律，用来摧毁所有否认入侵者饥饿的人。"
 ACOT_PERDITION_BEAM_EDI:0 "恐惧之眼"
 ACOT_PERDITION_BEAM_EDI_DESC:0 "神秘而具有破坏性的巨大灵能水晶撕裂了空间和现实的结构，制造了一个裂缝，摧毁了所有的现实。"
 acot_perdition_beam_edi_tt:0 "对目标 §E80§! 范围内的所有敌方舰艇造成 §Y4,250 - 9,000§! 点伤害。"
 DESTROYER_SHIP_THRUSTER_EDI:0 "超维度推进器"
 DESTROYER_SHIP_THRUSTER_EDI_DESC:0 "令人好奇的是，这些入侵者的飞船能够通过全体船员纯粹的灵能力量移动。"
 BATTLESHIP_SHIP_THRUSTER_EDI:0 "超维度推进器"
 BATTLESHIP_SHIP_THRUSTER_EDI_DESC:0 "令人好奇的是，这些入侵者的飞船能够通过全体船员纯粹的灵能力量移动。"
 TITAN_SHIP_THRUSTER_EDI:0 "超维度灵能推进器"
 TITAN_SHIP_THRUSTER_EDI_DESC:0 "令人好奇的是，这些入侵者的飞船能够通过全体船员纯粹的灵能力量移动。"
 EDI_SENSOR_SHIP:0 "超维度灵能传感器"
 EDI_SENSOR_SHIP_DESC:0 "这些入侵者不使用传统的传感器，他们完全依靠自己的灵能力量来探测威胁。"
 SMALL_DARK_MATTER_REACTOR_EDI:0 "超维度灵桥塔"
 SMALL_DARK_MATTER_REACTOR_EDI_DESC:0 "每一艘入侵者飞船似乎都有这个灵能塔，它充当着一个焦点，可怕的船员们与之连接来为舰船提供动力。"
