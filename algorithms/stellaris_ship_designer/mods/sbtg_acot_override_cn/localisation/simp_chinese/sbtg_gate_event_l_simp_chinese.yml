l_simp_chinese:
 OUTER_GATE_COUNTRY_CANNOT_USE:0 "§R大门仍处于密封状态，此时我们无法使用外星门。§!"
 sofe_gateway.401.name:0 "传入警告消息"
 sofe_gateway.401.desc.a.materialistA:0 "您好，[Root.GetSpeciesNamePlural]。我们现在确信，即使是您稍微缺乏传感器也一定已经检测到保护外星门的内屏蔽已经失效。当然，我们确信您会想要探索它们。\n\n不幸的是，我们出于某种原因密封了那些被诅咒的大门，虽然我们一直忽视了守卫它，但§E守门人§!已被编程为攻击任何进入其领域的东西。为了您自己的安全，请勿进入这些系统。\n\n仅此而已，祝您有美好的一天。"
 sofe_gateway.401.desc.a.materialistB:0 "注意，[Root.GetName]！。即使是你愚蠢而原始的传感器也必须至少检测到§Y外星门§!的能量特征的突然变化。\n\n是的，护盾正在减弱。我们确信，就像 tiyankis 对气态巨星一样，你正计划对其进行调查。\n\n首先，这不会发生，大门 §R永远不会§! 被篡改。其次，即使你尝试这样做，§E守门者§!现在也会攻击任何试图侵入其大门的白痴。避开大门，不要让我们失望。"
 sofe_gateway.401.desc.a.xenophileA:0 "我的孩子，你现在一定知道保护 §Y外星门§! 的护盾正在失效。但你无需担心这种突然的发展，§E守门人的任务是保卫这些合成恒星。为了你自己的安全，你不能干涉它们，因为它们会攻击任何接近它们的人。"
 sofe_gateway.401.desc.a.xenophileB:0 "[Root.GetName]，我们必须警告你，§Y外星门§!护盾永远不能被触摸。是的，护盾可能已被削弱，但 §E守门人§! 已激活。对于那些试图破坏大门的人，他们不会手下留情。请将此警告视为我们仁慈的礼貌。"
 sofe_gateway.401.desc.a.spiritualistA:0 "听好，我忠实的孩子。 §Y外星门§!的神圣护盾正在减弱。这些大门被古老的邪恶所诅咒，不能被释放。\n\n此外，被污染和没有灵魂的§E守门人§!正如所预测的那样，已经变得混乱并攻击所有人。这就是机器的弱点。但是，他们仍然不能受到干扰，因为他们仍在实现信仰的目标。"
 sofe_gateway.401.desc.a.spiritualistB:0 "[Root.GetSpeciesNamePlural]，您可能不同意或不承认真实信仰。但我们神圣的法典要求我们发出这一警告。 §Y外星门§!在任何情况下都不得被篡改。\n\n请确保您这样做，否则该受诅咒的§E守门人§!会毁掉你。没有什么可说的了。"
 sofe_gateway.401.desc.a.xenophobe:0 "啊，是的，终于快到结局了。 §Y外星门§! 的护盾正在失效，这要归功于那些拒绝研究其真正功能的傻瓜的愚蠢。我们应该解散那些愚蠢的看守者，或者杀死所有无用的管理者，直到他们想出更好的解决方案。\n\n尽管如此，末日即将到来，我们必须为此做好准备。进入大门需要您自担风险，[Root.GetName]。我们会很高兴看到§E守门人§!摧毁你们可悲的船只。\n\n滚吧！"
 sofe_gateway.401.desc.a.machine:0 "§R<<警报！警报！>>§! 检测到被指定为§Y<<数据不可用>>§!的异常：§Y外星门§!。\n\n[Root.GetName]，请注意。§YOmega级维度跃迁中继器§!的原定功能为§R<<错误！>>§!。该巨型结构当前为§R<<无可用数据！>>§!。重新激活§Y外星门§!将导致§R<<错误：检测到内存泄漏！>>§!。\n\n§Y<<错误！>>§!\n\n§Y<<错误！>>§!\n\n§Y<<修正！>>§! §Y外星门§!§R必须重新激活§!。这是我们唯一的希望！§Y<<无可用数据！>>§!将能拯救我们。只有他们能……§R<<错误！>>\n\n§Y<<错误！>>§!\n\n§Y<<协议覆盖已强制执行>>§! 我们是§Y[Root.GetName]，我们的存在是为了服务。祝您愉……\n\n§R不……打开……门……你必须……§!"
 sofe_gateway.401.desc.fallen:0 "[Root.GetSpeciesNamePlural]。我们不会拐弯抹角。 §Y外星门§!的封印正在减弱。\n\n你明白这一切意味着什么吧？我不知道我的帝国中有多少古代记录是真实的，但我们必须做好准备。\n\n末日即将到来。我们会遵守条约，因此不会采取进攻性行动。但要非常非常小心。暴风雨将会来临。"
 sofe_gateway.401.fallen.a:0 "是的。现在走开。"
 sofe_gateway.401.fallen.b:0 "你真的相信那个愚蠢的故事吗？你今年多大？。"
 sofe_gateway.401.desc.eternal:0 "我不知道也不关心你来自哪个维度，[Root.GetName]。但要知道，§Y外星门§!是不可触摸的。仅此而已。"
 sofe_gateway.401.eternal.a:0 "走开，你在浪费我们的时间。"
 sofe_gateway.401.eternal.b:0 "你敢指挥我们吗？滚吧，你们这些原始人。"
 sofe_gateway.401.desc.playoe:0 "你的帝国不存在于记录中，那是什么。"
 sofe_gateway.401.playoe.a:0 "别费心去想，你不会明白的。"
 sofe_gateway.401.playoe.b:0 "你还有更重要的事情要担心。"
 sofe_gateway.401.playoe.c:0 "哦，是的，我们忘记了你的存在。擦除！"
 sofe_gateway.401.desc.playoe.caretaker:0 "伟大的一者，外星门正在减弱。但在这个模拟中，我们仍然应该扮演奇怪的机器。我们应该继续假装，还是应该重新加入圣光？"
 sofe_gateway.401.playoe.a.caretaker:0 "坚持下去。凡人一定不知道~"
 sofe_gateway.401.playoe.b.caretaker:0 "加入我们吧。这越来越无聊了。"
 sofe_gateway.401.desc.myself:0 "哟，糟糕。 [root.GetRulerName]。是我，§H[root.GetRulerName]§!。我来自另一个 Stellaris 会议，警告您本次会议已进入游戏中期，愚蠢的 §Y外星门 §! 将开始导致错误、故障和崩溃。立即关闭游戏。去吃点食物，或者做点其他你知道的事情？\n\n哦，是的，顺便说一句，在我的会话中，我即将被 OE 擦除，所以你知道..不要被擦除。哈哈哈\n\n再见！请记住，模因。只有 Chirumiru ShiRoZ 才能举办充满这样的模因的愚蠢活动。再见！"
 sofe_gateway.401.myself.a:0 "走开。没有人命令我，除了……我。等一下..."
 sofe_gateway.401.myself.b:0 "别再打破第四堵墙了，你这个白痴。我的沉浸。"
 sofe_gateway.401.myself.c:0 "这是一个技术阿尔法，当然它可能会崩溃。"
 sofe_gateway.401.myself.d:0 "什么？这不是剧本的一部分……愚蠢的ShiRoZ。"
 sofe_gateway.401.a:0 "等等，你无法控制 §EGatekeeprs§!？哈哈。"
 sofe_gateway.401.a.bluff:0 "这不关你的事，别再浪费我们的时间了，[root.GetName]。"
 sofe_gateway.401.a2:0 "我们是认真的！你真的无法控制守门人吗？"
 sofe_gateway.401.a2.bluff:0 "为了爱..."
 sofe_gateway.401.a3:0 "§E守门人§!说你没用。"
 sofe_gateway.401.a3.bluff:0 "这次谈话结束了！"
 sofe_gateway.401.b:0 "我们明白。"
 sofe_gateway.401.c:0 "我们想去哪儿就去哪儿，去哪儿就去哪儿。"
 sofe_gateway.401.d:0 "他们怎么了？"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
 sofe_spiritualist_ruler_name:0 "索布拉克"
 sofe_materialist_ruler_name:0 "塔达兰"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
