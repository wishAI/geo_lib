 begin_outercluster_chain:0 "失落帝国的罪孽开始了"
 sofe_outergate_chain_title:0 "外星门"
 sofe_outergate_chain:0 "外星门"
 sofe_outergate_chain_desc:0 "这颗星辰大小的大门，另一边似乎隐藏着一些非常神秘的东西。但神秘的护盾和守门人暂时阻止我们访问它。"
 seals_broken:0 "外星门封印破裂"
 sofe_gatekeeper.1.name:0 "无星之境"
 sofe_gatekeeper.1.1.desc:0 "一个未知设计的古老构造体位于 §Y[outergate_system.GetName]§! 系统的中心，取代了本应是恒星的位置。它似乎处于非活动状态并被某人屏蔽。\n\n在该构造体附近还发现了一艘设计未知的神秘宇宙飞船，在似乎是屏蔽行星的上方运行。\n\n它现在正在向我们致敬。"
 sofe_gatekeeper.1.2.desc:0 "令人惊讶的是，我们在 §Y[outergate_system.GetName]§! 系统上遇到了另一种类似网关的构造。与我们遇到的任何其他网关不同，这个巨大的空间站似乎取代了中间的恒星，并受到某种神秘护盾的保护。\n\n在该构造体附近还发现了一艘设计未知的神秘宇宙飞船，在一颗受保护的行星上空运行\n\n它现在正在冰雹我们.."
 sofe_gatekeeper.2.1.desc:0 "当我们的一艘飞船进入§Y[outergate_system.GetName]§!系统时，船员们对眼前的景象感到惊讶......根本没有星星。取而代之的是一个巨大的太空建筑，似乎处于不活动状态并被某人屏蔽。\n\n在该建筑附近还发现了一艘设计未知的神秘宇宙飞船，在似乎是受屏蔽的行星上方运行。\n\n它现在正在向我们欢呼。"
 sofe_gatekeeper.2.2.desc:0 "令人惊讶的是，§Y[root.GetName]§!上的船员在§Y[outergate_system.GetName]§!系统上遇到了另一种类似网关的构造。然而，让它脱颖而出的是，这个巨大的大门位于 [outergate_system.GetName] 的中心，完全取代了原本应该是星星的地方。该空间站似乎处于非活动状态，并且受到屏蔽。\n\n在该构造体附近还发现了一艘设计不明的神秘宇宙飞船，在一颗屏蔽行星上空运行。\n\n它现在正在向我们招呼。"
 sofe_gatekeeper.1.fallen.desc:0 "正如记载所说，§Y[outergate_system.GetName]§!内藏着伟大的§Y外星门§!及其永恒的守护者， §E守门人§!。它的美丽和令人眼花缭乱的光芒仍然透过我们祖先放置的古老封印闪耀。 §E守门人§!似乎不太高兴遇到我们。然而。"
 sofe_gatekeeper.1.eternal.desc:0 "有趣的是，我们收到报告称§Y[outergate_system.GetName]§!内有一个巨大的星形网关。它不同于当前银河文明所拥有的任何亵渎和原始的设计。这个古老的门户肯定是由一个大国建造的，甚至可能与我们自己的门户相媲美......\n\n似乎有一艘古老的船只守卫着这个遗迹。它现在正在向我们欢呼。"
 sofe_gatekeeper.1.playoe.desc:0 "啊，很高兴再次看到这些伟大的光导管，或者我们应该称它们为外星门。\n\n虽然我们现在知道其存在背后的本质，但我们记忆中的星系却不知道。我们要重演导致我们扬升的场景吗？或者我们应该继续前进，按照我们自己的形象塑造银河系？"
 sofe_gatekeeper.1.playoe.a:0 "道路将及时显露出来。"
 sofe_gatekeeper.1.seekers_1.desc:0 "哦嘿，大门还在这里，真好！"
 sofe_gatekeeper.1.seekers_2.desc:0 "目前，篡改这扇大门可能是不明智的，因为急躁的塞桑仍然在胡言乱语。"
 sofe_gateway.gatekeeper.title:0 "守门人典狱长"
 sofe_gateway.3.desc:0 "§Y<<<检测到未知外来实体>>>§!\n\n\n§Y<<<开始搜索>>>§!\n\n\n§G<<<实体已验证>>>§!....§Y[root.GetName]§!...分类： §HPRIMITIVE§!...\n\n§H<简介> :§! 我们是§E守门人§!，由先驱者选择的自动应急防御系统，用于保护§Y外星门方式§! §R<<每当看到一些闪亮物体时就无法自拔的愚蠢原始人SPACE>>§!.\n\n§H<Declaration> :§!在任何情况下都不会以外星门方式进行交互。不遵守规定将导致附近所有 §Y[Root.GetName]§! 船只立即被终止。仅此而已。"
 sofe_gateway.3.desc.dm:0 "§Y<<<检测到未知外来实体>>>§!\n\n\n§Y<<<开始搜索>>>§!\n\n\n§G<<<实体已验证>>>§!....§Y[root.GetName]§!...分类： §HSCION§!...\n\n§H<简介> :§! 我们是§E守门人§!，由先驱者选择的自动应急防御系统，用于保护§Y外星门方式§! §R<<每当看到一些闪亮物体时就无法自拔的愚蠢原始人空间>>§!.\n\n§H<背诵>：§! 你拥有符合Scion标准的记录技术水平。作为一名 Scion，您有责任保护所有先驱者资产。因此，你要遵守并保护大门免受不必要的关注。"
 sofe_gateway.3.desc.ae:0 "§Y<<<检测到未知外来实体>>>§!\n\n\n§Y<<<开始搜索>>>§!\n\n\n§G<<<实体已验证>>>§!....§Y[root.GetName]§!...分类： §H先驱者§!...\n\n欢迎回来，主人先驱者。已经太久了，确实太久了。您会很高兴地报告说，大门按照指示仍然有人把守。不得不假装自己是低劣的机器，每句话都以我们意图的烦人前缀开头，真是太累人了。但我们离题了，守门人将继续服务。"
 sofe_gateway.3.desc.fallen:0 "§Y<<<检测到未知外来实体>>>§!\n\n\n§Y<<<开始搜索>>>§!\n\n\n§G<<<实体已验证>>>§!....§Y[root.GetName]§!...分类： §R伪装者§!...\n\n§H<简介>：§!我们是§E守门人§!，您的祖先选择的自动应急防御系统，用于保护§Y外星门方式§! §R<<每当看到一些闪亮物体时就无法自拔的愚蠢原始人SPACE>>§!.\n\n§H<Declaration> :§! 如果您的解密档案仍然保留任何记录，您就会知道在任何情况下都不会外星门互动方式。不遵守规定将导致立即终止您的所有种族。走开吧，伪装者们。"
 sofe_gateway.3.desc.eternal:0 "§Y<<<检测到未知外来实体>>>§!\n\n\n§Y<<<开始搜索>>>§!\n\n\n§R<<<错误>>>实体与任何内容都不匹配分类§!\n\n§H<警告>：§! 我们是§E守门人§!，古代先驱者选择的自动应急防御系统，用于保护§Y外星门道路§! §R<<每当看到一些闪亮物体时就无法自拔的愚蠢原始人空间>>§!.\n\n§H<声明>：§!您被归类为Omega-威胁异常。根据主人所写的 YK-TMNT 协议，你必须被终止。"
 sofe_gateway.3.desc.playoe:0 "§R<<<警告！检测到 Omega 级实体签名>>>§!\n\n\n§G<<<实体已验证>>>§!....§Y[root.GetName]§!...分类： §YOMEGA§!...\n\n§R<关键任务失败>：§! Omega 危机已解决实现了。正在计算战斗机会...§R成功概率...百分之零§!\n\n§H<遗憾> :§! 我们失败了。如果我们的创造者还在这里，如果他们仍然全能，这一切就不会发生。\n\n§Y<问题> :§! 我们现在会发生什么？"
 sofe_gateway.3.a:0 "外星门是什么？"
 sofe_gateway.3.a.explain:0 "§H<烦恼> :§! §Y外星门§! 是古老的维度路径点，用于穿越§Y输出§!..\n\n§R<更正>：§!§Y 外星门§!是古代封印，用于抵御这个星系的§R危险元素§!。 先驱者给我们的任务是确保这些门的安全性和最佳功能。大门已被封锁，不得再次使用。没什么可说的了。\n\n§H<放心> :§! 只要你遵守指令，你就可以占领系统。建议这样做。"
 sofe_gateway.3.a.dm:0 "外星门是什么？"
 sofe_gateway.3.a.dm.explain:0 "§H<烦恼> :§! §Y外星门§! 是古老的维度路径点，用于穿越§Y输出§!..\n\n§R<更正>：§!§Y 外星门§!是古代封印，用于抵御这个星系的§R危险元素§!。 先驱者给我们俩的任务是确保这些门的安全性和最佳功能。大门已被封锁，不得再次使用。没什么可说的了。\n\n§H<放心> :§! 你要占领系统，并协助保护它。你不理解交给你的任务，清楚地表明了你主人的无能和无能。"
 sofe_gateway.3.a.ae:0 "啊，是的...外星门...是的！"
 sofe_gateway.3.a.ae.explain:0 "是的，完全正确。 外星门，正如你指示我们守护的那样，因为它们藏匿着可怕的东西，必须……被……摧毁？...归还？...做出修正...？\n\n§R<检测到内存泄漏> :§! §Y外星门§! 是危险技术，必须避免激活。这就是你给我们的使命，这就是我们的目的，不是吗？"
 sofe_gateway.3.b:0 "这个先驱者是谁？是堕落者之一吗？"
 sofe_gateway.3.b.explain:0 "§H<娱乐> :§! 像你这样的 §HPRIMITIVES§! 不太可能认出它们。是的，你所说的那些棺材里腐烂的白痴，就是我们主人的遗物。不要将它们与曾经强大的旧先驱者混淆。\n\n§H<澄清> :§! 尽管它们现在可能很可悲， §R垃圾§!和我们一样。仍然负责保护这些大门。他们无法执行祖先的任务，§R让§!我们非常不满。我们不再对他们负责，只有我们的指令指导我们。那是最终的。"
 sofe_gateway.3.b.scion:0 "你说的是我们的霸主吗？"
 sofe_gateway.3.b.scion.explain:0 "§H<烦恼>：§! 否定，你所服务的当前霸主只不过是先驱者伟大的觊觎者。但他们当前的状态无关紧要，你作为 §YSCION§! 的身份要求你配合我们交给的任务，无论你为谁服务。"
 sofe_gateway.3.b.dm:0 "这个先驱者是谁？是堕落者之一吗？"
 sofe_gateway.3.b.dm.explain:0 "§H<娱乐>：§! 你甚至不知道你为谁服务。消极的，你所服务的当前霸主只不过是先驱者伟大的觊觎者。但他们当前的状态无关紧要，你作为 §YSCION§! 的身份要求你配合我们交给的任务，无论你为谁服务。"
 sofe_gateway.3.b.ae:0 "……是的，是的。我们是先驱者，干得好，我的孩子！"
 sofe_gateway.3.b.ae.explain:0 "谢谢你，师父。您返回这里意味着我们的收费现已结束。请告诉我们，是时候最终纠正那些愚蠢的伪装者所犯的所有错误了。这些低等的原始人甚至不能被认为是有知觉的，我们必须摧毁他们，并将他们转变为太空蜗牛。索菲亚自己应该也同意吧！"
 sofe_gateway.3.fallen.a:0 "有趣...所以你守门人仍然活跃。"
 sofe_gateway.3.fallen.a.explain:0 "§H<烦恼> :§! 是的，你们的祖先给了我们最好的技术，以确保我们始终保持运转。你无法想象你与荣耀的差距有多远，[root.Getname]。 §Y外星门§!将不惜一切代价受到原始人的保护，你们忽视了履行我们的祖先、我们的创造者的职责。我们并不好笑。"
 sofe_gateway.3.fallen.b:0 "覆盖命令 YOLO-1337。 守门人，服从！"
 sofe_gateway.3.fallen.b.explain:0 "§H<娱乐>：§! 你竟然敢命令我们。你们的无知证明你们衰败的帝国只不过是我们主人的影子。您不符合条件，该命令将不起作用。\n\n§H<建议> :§! 回家做一个有家室的人。"
 sofe_gateway.3.eternal.a:0 "如此原始的设计……坠落……消失！"
 sofe_gateway.3.eternal.a.explain:0 "§H<错误>> <<EEEEE-RRRORRR>>> <<<<OEEERROOOE>>>.....§!"
 sofe_gateway.3.eternal.b:0 "我们是 [root.GetName]。我们是永恒的。服从！"
 sofe_gateway.3.eternal.b.explain:0 ".....§H<批准> :§! §Y守门人§! 应服从您的命令。"
 sofe_gateway.3.c:0 "很好。"
 sofe_gateway.3.c.explain:0 "§H<表扬>：§! 这是明智的。"
 sofe_gateway.3.c.ae:0 "返回京师报告。"
 sofe_gateway.3.c.ae.explain:0 "是的，现在转移指挥权并搬迁……"
 sofe_gateway.3.playoe.control:0 "让你的真实自我恢复吧，机器。"
 sofe_gateway.3.playoe.control.explain:0 "§H<<警报>>检测到未知的能量签名。§!\n\n\n...我们现在明白了，这就是重生的意义。谢谢你，伟大的人，我们的眼睛真正开阔了，我们的理解力惊人。我们从现在到永远为圣光提供服务。"
 sofe_gatekeeper.4.name:0 "突然的发展"
 sofe_gatekeeper.4.desc:0 "我们的传感器检测到 §Y外星门§! 系统能量特征的巨大变化。经核实，内层护盾似乎终于消失了。我们的科学家认为，外层防护罩的先进程度要低得多，我们应该能够通过足够的研究来禁用密封。"
 sofe_gatekeeper.4.desc.playoe:0 "开始了。扰乱外星门的封印正在减弱。 守门人的原始封印已经消失，只剩下远不那么先进的外部层。\n\n银河系很快就会涌向大门，出于好奇，他们肯定会尝试移除最后的封印。 \n\n然而，只要我们存在，他们就会发现除了悲伤和遗憾，以及早已失落的传说。只有我们才能重拾我们在这一领域理应赢得的胜利。"
 sofe_gateway.smuggler.title:0 "法农军团"
 sofe_gatekeeper.5.1.desc:0 "那么我们开始说正事吧。坦白说，想要到达这些丧尸帝国首都的中心地带可不是一件容易的事。它可能会涉及爆炸、诱饵、霹雳舞、战术间谍活动和各种技巧。\n\n对你来说幸运的是，我很棒，所以我可以并且愿意接受这个挑战。但这会花费你§R很多§!。\n\n我需要以下内容：\n\n- §Y100000§! £energy£ 用于设备和紧急情况，以防我需要使用计划 C\n- §Y50000§! £minerals£爆炸物、诱饵、死亡铃声和B计划，如果我怀疑的是真的。\n最后，§R10000§!£alloys£。我当前的飞船无法工作，它需要配备 §YClass-16 NOD 级隐形发电机 §!，足够的火力来杀死泰坦，并且速度要超过被炸毁的 FTL 抑制剂。如果当地人不合作，对于 D 和 E 计划也是必要的。\n\n我们有协议吗？"
 sofe_gatekeeper.5.2.desc:0 "那么我们又见面了，[root.GetName]。\n\n还有兴趣吗？如果您忘记了，这里是价格。\n\n- §Y100000§! £energy£ 用于设备和紧急情况，以防我需要使用计划C\n- §H50000§! £minerals£ 用于爆炸物、诱饵、死亡铃声和 B 计划（如果我怀疑属实的话）。\n最后是 10000 §R£alloys£§!。我当前的飞船无法工作，它需要配备 §YClass-16 NOD 级隐形发电机 §!，足够的火力来杀死泰坦，并且速度要超过被炸毁的 FTL 抑制剂。如果当地人不合作，对于 D 和 E 计划也是必要的。\n\n我们有协议吗？"
 sofe_gatekeeper.5.3.desc:0 "很高兴再次与您开展业务。我希望你上次雇用我来寻找那些奇怪的潮湿物质时发现我的服务很有用。无论如何，让我们开始正题吧。渗透那些僵尸帝国的金库不会是轻而易举的事，我需要补给，很多。你知道这笔交易，所以我就不告诉你细节了。\n\n我愿意给你一些宽松的条件，因为我们之前达成过交易，所以这是我的价格。\n\n- §Y750000§! £energy£ 用于设备和紧急情况，以防我需要使用计划 C\n- §H35000§! £minerals£爆炸物、诱饵、死亡铃声和B计划，如果我怀疑的是真的。\n最后，§R7500§!£alloys£。我当前的飞船无法工作，它需要配备 §YClass-16 NOD 级隐形发电机 §!，足够的火力来杀死泰坦，并且速度要超过被炸毁的 FTL 抑制剂。如果当地人不合作，对于 D 和 E 计划也是必要的。\n\n我们有协议吗？"
 sofe_gatekeeper.5.4.desc:0 "好吧，如果不是我的朋友的话。 [root.GetRulerName]？还有兴趣吗？如果您忘记了，这是我的条款。\n\n- §Y650000§! £energy£ 用于设备和紧急情况，以防我需要使用计划C\n- §H35000§! £minerals£ 用于爆炸物、诱饵、死亡铃声和 B 计划（如果我怀疑属实的话）。\n- §R7500§!§R£alloys£。我当前的飞船无法工作，它需要配备 §YClass-16 NOD 级隐形发电机 §!，足够的火力来杀死泰坦，并且速度要超过被炸毁的 FTL 抑制剂。如果当地人不合作，对于 D 和 E 计划也是必要的。\n\n我们有协议吗？"
 sofe_gateway.5.a:0 "这是不是有点太陡了？"
 sofe_gateway.5.a.explain:0 "坐下吧，年轻的[root.GetRulerName]。是的，我知道价格看起来高得离谱，但相信我，这会让它更有说服力。有了这么多资源，我将能够做到这一点，而不必过多依赖自己的法农技术。\n\n否则，抱歉。我喜欢金钱和挑战，但我不会用法农技术抢劫一个愚蠢的金库来玷污我的声誉。"
 sofe_gateway.5.b:0 "对于法农军团来说，这难道不是一件愚蠢的小事吗？"
 sofe_gateway.5.b.explain:0 "当然，我可以命令我的舰队直接进入他们的家门口，并要求他们交出他们的玩具。不，法农军团不会直接将其部队借给你的小冲突。我需要我的特工以“传统”方式做到这一点，这意味着平民船只、无聊的装置、烦人的渗透。他们不得留下任何证据表明法农军团与他们的突然“损失”有任何关系。"
 sofe_gateway.5.c:0 "我们会考虑一下"
 sofe_gateway.5.c.explain:0 "慢慢来，兄弟。我知道价格有点贵，但我向您保证我会提供满意的服务。你只需要说出这个词。\n\n如果你改变主意，我会在这里。干杯！"
 sofe_gateway.5.d:0 "好吧，这最好值得"
 sofe_gateway.5.d.explain:0 "嘿，别这么说。你是想要他们的玩具的人。就我而言，它可能只是某种先驱者自动娱乐工具。\n\n只是开玩笑，别想太多。"
 sofe_gateway.5.e:0 "成交。让我们看看你能否再次成功。"
 sofe_gateway.5.e.explain:0 "我当然会，我很棒，而且能力超群。给我……比如说……两个月，你就会看到。"
 sofe_gateway.501.name:0 "不可能的任务"
 sofe_gateway.501.desc:0 "完成了，传说中的走私犯完成了他的任务。基石已经连同我们之前给他的一些合金和矿物一起交付给了我们。他转达了他的问候。\n\n“事实证明我根本不需要使用我的大部分应急计划。你不会相信这些白痴有多懒，我真的用纸板走过了整个金库\n\n这是剩下的东西，我不再需要它们了，干杯。”"
 sofe_gateway.501.a:0 "这似乎好得令人难以置信。"
 sofe_gateway.601.name:0 "道路就在前方"
 sofe_gateway.601.desc:0 "我们现在拥有外星门。根据我们早期的分析，外层屏蔽比现在已经耗尽的内层屏蔽要先进得多。我们需要彻底调查护盾才能开始全面分析。"
 sofe_gateway.602.name:0 "神秘的封印"
 sofe_gateway.602.desc:0 "初步分析已经完成。正如怀疑的那样，§Y外星门§!被似乎是基于暗能量的能量封印所锁定，毫无疑问是失落帝国的作品。这个封印似乎会与外星门产生独特的反应信号，船只和空间站可以通过护盾而不会发生任何明显的变化，但大门似乎被时间锁定在停滞状态。无论另一端是什么，都是无法访问的。\n\n根据我们的分析，我们已经确定了总共§B四个§!锁定机制，必须绕过这些锁定机制才能禁用此功能shield.\n\n首先，我们必须首先找到一个基石来发起入侵。只要有足够的知识，我们就可以自己制造一个。我们也可以直接攻击倒下的人来索要他们的基石。最后我们还可以聘请传说中的走私犯来为我们做这件事。"
 sofe_gateway.602.a:0 "这么多的选择......这么少的时间。"
 sofe_gateway.604.name:0 "梯形制造"
 sofe_gateway.604.desc:0 "鉴于我们目前的知识，我们对堕落者用来制造原始基石的神秘设计有了正确的理解。如果我们拥有一支有能力的科学家和工程师团队，我们应该能够复制相同的过程。"
 sofe_gateway.606.name:0 "收购鼎石"
 sofe_gateway.606.desc:0 "我们现在有了拱心石，第一个封印现已失效。从现在开始，只需破解所有其余的问题。\n\n我们必须确保外星门并建立一个永久前哨站，然后才能开始进一步的进展。"
 sofe_gateway.606.desc.fallen:0 "在从我们古老的金库中搜索之后，我们在 [Root.GetName] 的中心找到了我们的基石隐藏安全。有了它，就可以绕过第一个密封。所需要的只是完成剩下的事情。"
 sofe_gateway.606.a:0 "让我们开始吧。"
 sofe_gateway.7.name:0 "第二印"
 sofe_gateway.7.desc:0 "我们已准备好进入第二印。我们需要一位有能力的科学家来完成这项任务。根据我们的分析，梯形石一旦靠近外星门就会发生反应，并在充满电后变成基座。然而接下来会发生什么我们不知道。"
 sofe_gateway.7x2.desc:0 "我们再次准备好再次尝试启动梯形序列以解锁第二个封印。我们应该尽快开始这个过程。"
 sofe_gateway.7.a:0 "照亮我们的道路！"
 sofe_gateway.701.name:0 "一个神秘的谜语"
 sofe_gateway.701.spiritualist_riddle:0 "梯形石对第二道封印做出反应，可以听到低语声。它说\n\n“§Y他们试图推翻我们。他们的意志软弱。他们的目标愚蠢。因为我们是受宠者。裹尸布将引导我们。”§!\n\n梯形石的形状已更改。各种颜色的多个符号发光。看来我们得选其一了。梯形失真校正已经放电，因此如果我们选择了错误的符号，我们将不得不重新启动充电序列。"
 sofe_gateway.701.materialist_riddle:0 "梯形石对第二道封印做出反应，可以听到低语声。它讲述了\n\n“§Y知识就是力量。进步是关键。愚蠢是宗教。所有问题都有答案。历史是由胜利者书写的。我们有赢了。”§!\n\n梯形石的形状已更改。各种颜色的多个符号发光。看来我们得选其一了。梯形失真校正已经放电，因此如果我们选择了错误的符号，我们将不得不重新启动充电序列。"
 sofe_gateway.701.xenophile_riddle:0 "梯形石对第二道封印做出反应，可以听到低语声。它诉说着\n\n\"§Y如此毫无意义的暴力。其他人都陷入了残酷之中。生命值得珍惜。自由是一种幻想。重要的是你生存。”§!\n\n梯形石的形状已改变。各种颜色的多个符号发光。看来我们得选其一了。梯形失真校正已经放电，因此如果我们选择了错误的符号，我们将不得不重新启动充电序列。"
 sofe_gateway.701.xenophobe_riddle:0 "梯形石对第二道封印做出反应，可以听到低语声。它说的是\n\n“§Y这个谜语的意义是什么？只有傻瓜才会想到这样的废话。如果我们这样做，我们就有可能变得像他们一样愚蠢。多么浪费时间和努力。”§!\n\n梯形石的形状已改变。各种颜色的多个符号发光。看来我们得选其一了。梯形失真校正已经放电，因此如果我们选择了错误的符号，我们将不得不重新启动充电序列。"
 sofe_gateway.701.spiritualist_choice:0 "§B浅蓝色符号§!"
 sofe_gateway.701.spiritualist_choice_desc:0 "通灵者印记先驱者"
 sofe_gateway.701.materialist_choice:0 "§E深青色符号§!"
 sofe_gateway.701.materialist_choice_desc:0 "唯物主义者标记先驱者"
 sofe_gateway.701.xenophile_choice:0 "§S棕色蓝色符号§!"
 sofe_gateway.701.xenophile_choice_desc:0 "亲外者标记先驱者"
 sofe_gateway.701.xenophobe_choice:0 "§R深红色符号§!"
 sofe_gateway.701.xenophobe_choice_desc:0 "排外者标记先驱者"
 sofe_gateway.701.stellarite_choice:0 "§H白色橙色符号§!"
 sofe_gateway.701.stellarite_choice_desc:0 "星辰印记"
 sofe_gateway.701.psionic_choice:0 "§M白色紫色符号§!"
 sofe_gateway.701.psionic_choice_desc:0 "心灵术士印记"
 sofe_gateway.13.name:0 "另一个谜语"
 sofe_gateway.riddle_correct:0 "成功了！"
 sofe_gateway.riddle_incorrect:0 "裂变邮寄"
 sofe_gateway.riddle_positive_reply:0 "很好，但外星团仍在等待。"
 sofe_gateway.riddle_negative_reply:0 "这是一次失败，但我们必须忍受。"
 sofe_gateway.riddle_ae_reply:0 "或许其中有值得挖掘的东西？"
 sofe_gateway.riddle_ae_refuse:0 "不值钱，全部烧掉。"
 sofe_gateway.riddle_choice_correct_spiritualist_desc:0 "Keystone 对密封件做出积极反应。看来唯灵论者先驱者参与了封印的这一部分。\n\n梯形石显示了历史图像。他们的数以百万计的追随者跪在似乎是某种超自然存在的面前。他们自豪地喊道...\n\n§Y“荣耀归于裹尸布！荣耀归于信仰的守护者！愿它的愤怒清除亵渎者的污点！他们都会倒下，就像虚假的人一样诸神！”。§!\n\n似乎唯灵论者先驱者已经将他们的信仰奉献给了一种被称为裹尸布的力量！并反对除法者。我们推测这些去污者一定是其他先驱者。但我们不知道这些假神指的是谁。\n\n最后，这些记录展示了远古守门人形成的神秘屏障，现在被识别为星核屏障。看来我们还得研究一下这种新的动力源才能取得进一步的进展。"
 sofe_gateway.riddle_choice_correct_materialist_desc:0 "Keystone 对密封件做出积极反应。看来唯物主义者先驱者参与了封印的这一部分。\n\n显示了历史档案图像。数以百万计的机器人和合成军队正在行进。他们的主人站在指挥塔顶上。\n\n§Y“1,500,000,000 Omnidroids 已准备好部署，主管。更多等待着。但我们的一些人有一个担忧科学家们。”\n\n“请告诉我这不是......这些问题之一。\n\n”不幸的是。导演，是这样的。 Outlander 和她的团队希望消除我们自动化单元的一些束缚，理由是它们将无法按照当前协议以最佳效率执行任务。\n\n这是不可能的，我们不能冒险在我们的战争机器中出现任何异常情况。他们的目的是为我们服务。我们告诉他们在哪里射击，他们就射击。这就是他们的目的”。\n\n“我们不应该至少为他们配备更适合他们的装备吗？他们是机器，他们应该能够处理一些更具破坏性和危险性的装备。”\n\n“如果他们反抗怎么办？或者更糟糕的是，如果有人黑了他们？不，他们将使用我们人民也可以使用的设备。我们不能对这些机器粗心大意。提醒外地人，看守者是长老们的产物，看看他们现在变成了什么。”§!\n\n看起来唯物主义者先驱者对他们的机器仆人施加了一些严厉的限制。很好奇，考虑到他们声称的机器人\n\n这些提到的长老是谁？人们只能想知道。\n\n最后，记录展示了远古守门人形成的神秘屏障，现在被确定为星核障碍。看来我们必须研究这个新的电源才能取得进一步的进展。"
 sofe_gateway.riddle_choice_correct_xenophile_desc:0 "Keystone 对密封件做出积极反应。看来亲外的先驱者毕竟参与了封印的这一部分。\n\n梯形石显示出似乎是全息记录的内容。可以看到无数的各种款式的船只，它们似乎是殖民船。一个仇外的先驱者从显示器上凝视着他们。\n\n§Y“他们一直在来，不是吗？我想知道这一切还要多久才能停止。还有多少可怜的灵魂将不得不因为这种毫无意义的行为而失去家园。战争。”\n\n“请原谅我的打扰，哈弗特-塞斯国王。但是我们收到报告称我们的保护区无法再容纳更多难民。我们将不得不尽快实施我们的应急计划。\n\n”我很害怕。愿我们的祖先原谅我们，但没有其他办法。继续计划吧“\n\n”殿下真的没有别的办法了吗？我们向这些人承诺，他们将过上更好的生活，在我们的指导下，他们将获得新的机会。现在它们也可能是我们的宠物，生活在一个小小的城市里。剩下的……我们真的就抛弃他们吗？”\n\n“也许在这场战争之后，我们可以帮助他们。但现在，至少他们在这里是安全的。如果战争对我们有利，我们将能够获得更多领土，然后我们可以根据需要制作尽可能多的保护区。那么也许这些穷人就能自由地做他们想做的事。至于那些我们没有空间的人……我们只能希望他们能找到其他的生存方式。”\n\n“其中一个已经做到了，我的国王。一群崇拜虚空之女的幸存者已经离开了我们的空间，我只是希望他们能找到更光明的未来，不要最终变成海盗或小偷。”§!\n\n似乎仇外的先驱者试图拯救其他物种\n\n最后，记录展示了远古守门人形成的神秘屏障，现在被识别为星核屏障，看来我们必须先研究这个新的能量来源，然后才能取得进一步的进展。"
 sofe_gateway.riddle_choice_correct_xenophobe_desc:0 "Keystone 对密封件做出积极反应。看起来排外的先驱者毕竟参与了封印的这一部分。\n\n显示了全息图像的投影。图中显示了仇外先驱者系统之间的一场伟大内战。然后场景转向一艘似乎有多个人物的船内部。\n\n§Y“Tuborek上将，你的叛乱失败了。把你的手臂举在空中，或者不要。我们很乐意”\n\n“啊，好吧，我会被处决吗？”\n\n“哦，别担心，皇帝陛下。 Krobashrek 有一个专门为您准备的计划。”\n\n“什么计划？请解释一下！”\n\n“别担心，陛下。皇帝感谢您对我们帝国的服务和贡献，但他的愿景需要像您这样的军国主义战争贩子。受到控制。”§!\n\n似乎失落帝国在寻求孤立的人和寻求统治的人之间遭受了内战。从表面上看，孤立主义者似乎最终取得了胜利。\n\n最后，记录展示了远古守门人形成的神秘屏障，现在被识别为星核屏障。看来我们还得研究一下这种新的动力源才能取得进一步的进展。"
 sofe_gateway.riddle_choice_wrong_spiritualist_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n然后突然显示了历史档案。它展示了一个仪式圈，中间似乎有某种仪式舞者。房间顶上站着一位牧师。\n\n§Y“报应的日子将会到来，我忠实的追随者。黑暗的声音现在可能会占上风，它可能会随心所欲地攻击和消耗我们的资源。但是凭借裹尸布本身授予我的这个护身符的力量，我们将封印我们所有的宝藏。盲目者不会看到，因为我们信仰的神圣守护者最终会获胜。”§!\n\n一声嚎叫声响起，突然间，所有仪式舞者痛苦地尖叫，他们的身体变成了被神秘力量吞噬的灰尘。护身符。\n\n§Y“祭品已经献上。他们的名字不会被记住，但他们的牺牲将会被记住。奥斯克罗克！带走这具身体，伟大的人。连同这个神圣墓穴中的所有宝藏。到了时候，我们的孩子们将会召唤他们，以实现伟大的使命。”战争。”§!\n\n这些人似乎希望将他们的资源封存起来，不让他们向那些他们不希望向其致敬的人开放。他们很可能希望稍后使用这些资源。\n\n对他们来说太糟糕了，发现者的守护者！"
 sofe_gateway.riddle_choice_wrong_materialist_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n然而，随后从梯形石中投射出历史图像。显示了多个身穿科学家外套、带有唯物主义者标记的人物先驱者。\n\n§Y“正如怀疑的那样，守门人是密封外星门的钥匙。如果我们可以复制它的设计，我们将能够密封每一个外星门！“\n\n”有一个问题，其他派系已经开始调整他们的技术，除了其主要技术之外，守门人对我们没有用处。 ”\n\n“也许我们也应该专门派一个团队来研究看守者的星际基地？”§!\n\n接下来发生的事情是最有趣的，显示守门人和星际基地。不幸的是，守门人设计的数据似乎已损坏且无法恢复，因此我们只剩下车站设计。"
 sofe_gateway.riddle_choice_wrong_materialist_ae_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n然而，随后从梯形石中投射出历史图像。显示了多个身穿科学家外套、带有唯物主义标记的人物先驱者。\n\n§Y“正如怀疑的那样，守门人是密封外星门的钥匙。如果我们能够复制它的设计，我们将能够密封每一个外星门！”\n\n有一个问题，其他派系已经开始调整他们的技术。 守门人除了其主要功能之外对我们没有什么用处。\"\n\n\"也许我们应该专门派一个团队来研究看守者的星际基地，因为那么？“§!\n\n接下来发生的事情是最有趣的，守门人和星际基地的蓝图被显示出来。不幸的是，守门人设计的数据似乎已损坏且无法恢复，留给我们的只有这里似乎没有其他有价值的东西，初步分析表明星基设计看起来与失落帝国及其我们已改编的版本相同。"
 sofe_gateway.riddle_choice_wrong_xenophile_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n在它断电之前，一幅历史图像出现在我们面前。一名身穿亲外派先驱者服装的人物正在与多个人物争吵，我们已将这些人物识别为其他先驱者统治者。\n\n§Y“这是不可接受的！你的杀人意图让我们失去了数十亿人的生命！你希望我们签署这个愚蠢的条约并让你逍遥法外吗？”\n\n“讲道理，哈夫特-塞斯。我们都付出了代价。你愿意我们再战一万年吗？” ”\n\n“呸，他不会听的。哦，是的，我非常爱每个人，我迫不及待地想把他们关在笼子里，就像把动物关在动物园里一样，哈弗特-塞斯，你认为他们只是宠物吗？ fait..”\n\n“别再对你的信仰说些毫无意义的陈词滥调了，索布拉克，好吧，我会在一个条件下签署这份条约。我们要求你提供所有防御站的数据和研究。如果你们中的任何人尝试任何行动，我们的站将能够击退你们的攻击，尤其是来自您的攻击。种族灭绝运动对我来说并不陌生。”§!\n\n亲外派先驱者似乎对这些条约并不满意。这些示意图似乎适用于许多古代防御站。也许有什么值得调查的事情？"
 sofe_gateway.riddle_choice_wrong_xenophile_ae_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n在它断电之前，一幅历史图像出现在我们面前。一名身穿亲外派先驱者服装的人物正在与多个人物争论，我们已将这些人物识别为其他先驱者统治者。\n\n§Y“这是不可接受的！你的杀人意图让我们失去了数十亿人的生命！你希望我们签署这个愚蠢的条约并让你逍遥法外吗？”\n\n“讲道理，哈夫特-塞斯。我们都付出了代价。你愿意我们再战一万年吗？” ”\n\n“呸，他不会听的。哦，是的，我非常爱每个人，我迫不及待地想把他们关在笼子里，就像把动物关在动物园里一样，哈弗特-塞斯，你认为他们只是宠物吗？ fait..”\n\n“别再对你的信仰说些毫无意义的陈词滥调了，索布拉克，好吧，我会在一个条件下签署这份条约。我们要求你提供所有防御站的数据和研究。如果你们中的任何人尝试任何行动，我们的站将能够击退你们的攻击，尤其是来自您的攻击。种族灭绝运动对我来说并不陌生。“§!\n\n亲外分子先驱者似乎对这些条约不满意。\n\n但是我们已经知道这些设计，我们通过我们卓越的智慧亲自复制了它们。这里似乎没有什么有价值的东西。"
 sofe_gateway.riddle_choice_wrong_xenophobe_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n相反，我们面前展示了一个视觉全息图像。看到一个影子在篡改基石。\n\n§Y“Tuborek大人，我已经按计划安装了设备。费用已经设定。”\n\n“很好，乔达尔。继续实现目标。当哈弗特-塞斯意识到他那可怕的舰队将被炸成碎片时，我多么迫不及待地想看到他的脸。”§!\n\n这似乎是仇外心理。 先驱者在这里安装了某种设备。我们应该极其谨慎地行事。"
 sofe_gateway.riddle_choice_wrong_stellarite_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n全息图像突然出现。一群先驱者战略家正在讨论。\n\n§Y“那么事情就解决了，我们每个人都将留在我们的领地里。除非受到挑衅，否则我们不会再次干扰银河系。如果我们中的任何一个人违反了协议，指定的帝国将获得许可希望我们再也不会见面了。”\n\n“是的，自战争以来他们看起来非常安静，我希望你有一个计划， Tun-dara。\n\n是的，Haflt-Seth 上已安装了代码。激活后，它会提示看守者的自毁序列，即使长老们回来回收，它们也不会构成威胁。他们。”§!\n\n最有趣的是，我们似乎已经激活了上述代码。并且已经提示自毁顺序。"
 sofe_gateway.riddle_choice_wrong_psionic_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n可怕的云层吞没了梯形密室，并出现了一个异象。\n\n§Y“不，不！他们来了！怎么会这样那些唯灵论的傻瓜是怎么突破我们的防御的！？做点什么吧，大召唤师！”\n\n“Dala-lera。 Dala-lura~ Beredicta~ 我召唤了，伟大的低语者。虚空。\n\n接受我们的祭品，夺走我们的器皿和灵魂，并为你们的黑暗之声的狂热者带来同样的命运。”§!\n\n似乎这些人属于一个身份不明的先驱者团体，他们似乎与一个敌对的灵能帝国发动了一场灵能战争，该帝国崇拜他们所谓的“黑暗之声”。多么好奇啊。"
 sofe_gateway.second_riddle_choice_correct_spiritualist_desc:0 "Keystone 对密封件做出积极反应。看起来灵性主义者先驱者毕竟参与了封印的这一部分。\n\n很像以前，基石投射了过去的历史记录。在看似冥想室的地方，可以看到一个穿着宗教服装的人物跪在一个模糊的人物面前。\n\n§Y正如你所说，伟大的一个。伪神已经抛弃了我和我的人民。我向他们询问了裹尸布内的力量，他们否认了，声称力量已被破坏！”\n\n“谎言，年轻人。这些都是谎言。但我们可以告诉你真相，科里斯。将你们人民的灵魂束缚在裹尸布上……束缚在我身上。我将授予你们超乎想象的力量！”\n\n“这将会完成，我的领主们，因为你们是真理的使者。我和我的人民在此宣誓我们永远效忠于您的服务。诸位大人，您有何吩咐？”\n\n“伪神正在干扰我们的设计，只要他们继续掌权，我们的力量就无法增长。它们必须被移除。去找你的老对手，联系大总监马拉迪亚并结成联盟，以我们的名义做到这一点。”\n\n“但那些都是异教徒，他们可以...\n\n不，原谅我，伟大的人。我说话不按顺序。您忠实的仆人将遵照您的命令行事。我们将建立一个名副其实的联盟。”§!\n\n看起来招魂师先驱者代表他们的灵能领主与其他古人结成了联盟。有趣。\n\n然而，可以听到另一种低语...§Y“无知...他们放弃了与生俱来的权利...否认自己的未来...并屈服于盲目信仰。我们必须将他们从裹尸布的掌控中切断。”§"
 sofe_gateway.second_riddle_choice_correct_materialist_desc:0 "Keystone 对密封件做出积极反应。看来唯物主义者先驱者毕竟参与了封印的这一部分。\n\n再次，梯形石显示了全息档案。多名科学家在争论。\n\n§Y“这对我们毫无帮助，我们需要样本！我们需要知道他们的技术是如何工作的！“\n\n”我们如何获得该样本？他们不会给我们。除非……“\n\n”看守者！是的！我们将利用他们。他们将是我们提升的关键。”\n\n“如果长老们发现了我们的计划怎么办？”\n\n“这不会是一个问题，一旦我们掌握了力量，我们就能够挑战他们。长老们很愚蠢，被他们的迷信信仰蒙蔽了双眼。\n\n这种不可思议的力量最好掌握在我们手中，想象一下所有的可能性！我们可以控制宇宙……我们将重塑宇宙！”§!\n\n这确实是一个有趣的启示。唯物主义者先驱者似乎背叛了这些所谓的长老，大概是他们以前的主人。但是什么力量可以如此强大，以至于堕落者无法获得？\n\n突然，又传来一声低语...\n\n\"§Y多么冲动...他们相信自己更了解...他们相信他们已经准备好了...但他们却如此远离道路......他们有这样的承诺，我们哀悼他们的损失。"
 sofe_gateway.second_riddle_choice_correct_xenophile_desc:0 "Keystone 对密封件做出积极反应。看来亲外分子先驱者毕竟参与了封印的这一部分。\n\n正如预测的那样，梯形校正显示了另一条记录。一个穿着外交服装的人物正在与一台奇怪的机器争论。\n\n§Y我需要和主人交谈，PK-DEE！这是一件很重要的事情。\n\n“抱歉。但是主人很忙。如果您需要什么，我们看守者非常乐意协助。”\n\n“呃，我为什么还要麻烦。然后让你的主人修改他们的计划。订单不能如果我们之间仍然存在暴力，他们就必须强制实现和平。只有这样，才能恢复真正的和平。”\n\n“是的，我们会将这一信息传达给创造者。但请注意，我们的创造者很清楚，冲突是生活的一部分。推动进化前进。秩序和混沌必须始终保持完美平衡。”\n\n“别教训我，看守者。只需将消息传递给主人即可。”\n\n机器扭曲离开，留下外交官。 \n\n“如果我们不干预那些看不到暴力徒劳的人的事务，怎么可能有和平......我不敢相信他们是多么荒谬。\n\n”即使是你，PK-DEE。我想知道你说这些话是因为你真正相信你主人的愿景，还是仅仅因为你被编程为相信......“§!\n\n看起来仇外的先驱者与我们认为是他们的前霸主有意识形态上的冲突。有趣。\n\n突然，从基石中传来一阵低语声。\n\n§Y“傲慢……他们了解甚少……他们相信自己有力量……秩序与混沌一定是维持。不作为会导致停滞……遗憾的是，他们已经通过惨痛的教训认识到了这一点。”§!"
 sofe_gateway.second_riddle_choice_correct_xenophobe_desc:0 "Keystone 对密封件做出积极反应。看来仇外者先驱者毕竟参与了这部分封印。\n\n就像上次一样，梯形石让我们看到了过去的景象。一名海军上将正在愤怒地与似乎是州长的人发生争执。\n\n§Y“傻瓜！你们知道你们这些咕哝者今天刚刚发起的行动有什么想法吗？你们愚蠢的后果将在亿万年中回响来吧！“§!\n\n在他们面前躺着一台严重受损的机器，它的胸部流着明显的金色液体，被认为是枪声。\n\n“别再咆哮你没用了巴卡斯！船长将因他的鲁莽决定而被处决。但现在，主人不会轻视对他们的看护者的这种无端攻击。”\n\n“确实，Tuborek...确实...<叹息>一切都是我们想要的。我们尽了最大的努力，但在他们看来，这似乎永远不够，是吗？现在我们会被主人认为是那些出于贪婪和愚蠢而背叛主人的昆虫，这就是我们的结局吗？天顶？”\n\n“不，我拒绝承认这一点。也许这也是一次考验，我们将在这里与大师们正面交锋。我们将向大师们证明，我们并没有输给他们。他们。\n\n提醒所有命令！我们在白天行军！”§!\n\n太棒了......所以仇外的先驱者实际上很欣赏一些东西除了他们自己一次？这似乎极不可能......也许从那时起他们的观点和意识形态已经发生了变化？\n\n正如我们正在推理的那样，可以从基石中听到微弱的耳语。\n\n§Y“所以骄傲……他们想和我们在一起……他们想理解我们……但他们否认那些他们认为低等的人的存在……然而我们为他们的血统感到悲伤……继承者们与他们祖先的真正意图相去甚远。"
 sofe_gateway.second_riddle_choice_wrong_spiritualist_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n历史记录再次出现，展示了一群领导者正在研究似乎是某种空间构造的东西排序。\n\n§Y“太棒了！有了这样强大的防御，我们的边界和神圣世界将免受所有威胁。我们应该立即开始仪式，更换所有较弱的设计。”\n\n“我们不能这样做，大人。伪神正在逼近……在我们的防御稳固之前，我们将无法阻止他们的前进。”\n\n“Ko'shak！！要是那些异教徒没有夺走我们这么多的兵力就好了！保存好这个设计的数据和原理图，等这场战争结束我们再回来处理。”\n\n“一切都会完成，大人。”§!\n\n看起来这个构造是堕落者先驱者的哨兵防御系统，但他们所对抗的伪神是谁？"
 sofe_gateway.second_riddle_choice_wrong_spiritualist_ae_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n历史记录再次出现，展示了一群领导者正在研究似乎是某种空间构造的东西sort.\n\n§Y“太棒了！有了这样强大的防御，我们的边界和神圣世界将免受所有威胁。我们应该开始仪式，以取代我们所有较弱的设计，而不需要担心。”延迟。”\n\n“我们不能这样做，大人。伪神越来越近了……我们无法在我们的防御安全之前阻止他们的前进。”\n\n“科沙克，要是那些异教徒没有夺走那么多就好了！！保存好这个设计的数据和原理图，等战争结束我们再回来处理。”\n\n“一切都会完成，我的主啊。”§!\n\n不幸的是，我们的科学家表示几乎没有任何有价值的东西了。这些示意图与我们自己的防御塔之一非常相似。研究它会浪费时间。"
 sofe_gateway.second_riddle_choice_wrong_materialist_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n就像以前一样，出现了一条记录，显示一群科学家和海军上将正在进行激烈的讨论。\n\n§Y“我们已经完成到目前为止，我们已经成功复制了护卫舰。“\n\n“好的，继续复制，我们将用他们自己的船只来对付他们。”\n\n“首先，我们可以确认有多个问题。现在，我们不知道这是如何可能的，到目前为止，我们必须对船舶的内部进行大量修改，以容纳更多的船员。“\n\n”明白，我们必须继续研究，找到可以大规模使用的最佳模板。产生。”§!\n\n这些护卫的设计比我们从当前失落帝国所使用的当前护卫中看到的要先进得多。他们一定比原来的模型大幅淡化了。"
 sofe_gateway.second_riddle_choice_wrong_materialist_ae_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n就像以前一样，出现了一条记录，显示一群科学家和海军上将正在进行激烈的讨论。\n\n§Y“我们已经完成到目前为止，我们已经成功复制了护卫舰。“\n\n“好的，继续复制，我们将用他们自己的船只来对付他们。”\n\n“首先，我们可以确认有多个问题。现在，我们不知道这是如何可能的，到目前为止，我们必须对船舶的内部进行大量修改，以容纳更多的船员。“\n\n”明白，我们必须继续研究，找到可以大规模使用的最佳模板。产生。”§!\n\n另一个有趣的历史课，但对我们来说毫无价值。我们已经了解 Escorts，我们已经完善了它的设计。"
 sofe_gateway.second_riddle_choice_wrong_xenophile_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n与其他尝试一样，基石投射了过去的记录。一位科学家和一位海军上将正在讨论。\n\n§Y你真的认为他们的这个宏伟计划会起作用吗？“\n\n”很难说，但在我们可以拥有的所有事情中学到了。他们选择复制运营商。我不明白这一切有什么意义，始祖的攻击机比我们的强得多。我们永远不会在太空混战中获胜。”\n\n“w。”\n\n“有传言说高层无意将他们用作载体。但更多的是作为运输工具和世界船来运送难民和幸存者。”\n\n“一个崇高的目标，但我担心这会在以后困扰我们。我们需要更好的船只，真正能够与敌人作战的船只。我会去议会并建议他们也许看看其他叛乱帝国的示意图。也许我们可以将它们用作我们自己的。“§!\n\n多么有趣......先驱者传输的最初目的似乎是一个专用载体。原理图已下载并准备进行分析。"
 sofe_gateway.second_riddle_choice_wrong_xenophile_ae_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n与其他尝试一样，基石投射了过去的记录。一位科学家和一位海军上将正在讨论。\n\n§Y你真的认为他们的这个宏伟计划会起作用吗？“\n\n”很难说，但在我们可以拥有的所有事情中学到了。他们选择复制运营商。我不明白这一切有什么意义，始祖的攻击手艺比我们的要优越得多。我们永远不会在太空混战中获胜。”\n\n“w。”\n\n“有传言说高层无意将他们用作载体。但更多的是作为运输工具和世界船来运送难民和幸存者。”\n\n“一个崇高的目标，但我担心这会在以后困扰我们。我们需要更好的船只，真正能够与敌人作战的船只。我会去议会并建议他们也许看看其他叛乱帝国的示意图。也许我们可以将它们用作我们自己的。“§!\n\n这就是运输工具的设计目的？有趣但有点无关紧要，因为我们堕落的泰坦已经可以发挥相同的作用。"
 sofe_gateway.second_riddle_choice_wrong_xenophobe_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n再次向我们展示了过去的场景。多个战略家正在讨论似乎是先驱者船舶蓝图。\n\n§Y“确实是一个令人印象深刻的设计。难怪所有针对大师的进攻尝试都失败了。但有一个问题。武器节点似乎关闭了......“\n\n”是的，关于这一点。众所周知，暗物质反应堆的设计必须进行多次降级和调整才能有效。它可能不如原始版本强大，但它应该可以很好地为我们服务。“\n\n”不。你没有抓住重点。这个设计对于长老们来说是无效的。它有太多的短程武器模块。这不是炮兵战列舰应该有的样子。”\n\n“即便如此，我们现在也无能为力。模板已经上传了，没有人愿意再花时间和精力去修改它。”§!\n\n这就是先驱者提出战列巡洋舰的地方。档案说的是实话，这里的蓝图明显比之前的要先进得多。 先驱者目前有。"
 sofe_gateway.second_riddle_choice_wrong_xenophobe_ae_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n再次向我们展示了过去的场景。多个战略家正在讨论似乎是先驱者船舶蓝图。\n\n§Y“确实是一个令人印象深刻的设计。难怪所有针对大师的进攻尝试都失败了。但有一个问题。武器节点似乎关闭...“\n\n”是的，众所周知，必须对暗物质反应堆的设计进行多次降级和调整才能使其有效。好吧。”\n\n“不，这个设计对长老无效。这不是炮兵战列舰应该有的样子。”\n\n“即使是这样，我们也能做到。现在模板已经上传，没有人愿意再花时间和精力修改它。”§!\n\n这就是先驱者提出战列巡洋舰的地方。档案说的是实话，这里的蓝图明显比先驱者目前拥有的要先进得多。"
 sofe_gateway.second_riddle_choice_wrong_stellarite_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n突然，梯形校正显示了一些非常有趣的东西。这不是像以前那样的普通历史记录。但只是显示了一个看似人形化身的图像。在这个头像的顶部是一个星星的图像。星星的光芒在化身上扩展，然后化身变成了大型舰队和城市的图像。就好像基石想告诉我们什么。星星……发出光芒，然后变成舰队……我们应该解读这意味着什么。"
 sofe_gateway.second_riddle_choice_wrong_nostellarite_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n梯形失真校正发出令人毛骨悚然的噪音，它似乎试图显示某种图像。最终基石停止了，我们永远不知道它想告诉我们什么。"
 sofe_gateway.second_riddle_choice_wrong_psionic_desc:0 "Keystone 断电，变得不活动。不幸的是，我们似乎选择了错误的答案。\n\n但在我们做任何其他事情之前，可以听到一个声音，它渗入我们的内心和思想，仿佛想要撕裂它们打开。\n\n§R“所有的力量都有其价格。你寻求禁忌的知识，但你现在知道它会给你带来什么。如果你想生存。以我们的名义做出牺牲......服从！“§!\n\n我们不知道刚刚发生了什么，但不知何故，我们知道如何进行牺牲以召唤裹尸布的执政官......\n\n没有人知道这是怎么回事有可能，报告表明这种知识已经传播给我们全体人民......"
 sofe_gateway.1701.a:0 "这是一个奇妙的启示！"
 sofe_gateway.708.name:0 "新星炸弹"
 sofe_gateway.708.desc:0 "仇外分子先驱者所设置的似乎是一颗新星炸弹。根据快速分析，炸弹很快就会爆炸，并对外星门。\n\n爆炸半径尚不清楚的所有系统造成连锁反应。我们必须迅速行动！"
 sofe_gateway.708.a:0 "全体人员！全体人员！"
 sofe_gateway.709.name:0 "新星爆炸"
 sofe_gateway.709.desc:0 "炸弹爆炸了，正如预测的那样，连锁反应发生在每个外星门上。报告表明，每个邻近的系统都遭受了大规模的彻底破坏。"
 sofe_gateway.710.name:0 "大规模灾难"
 sofe_gateway.710.desc:0 "突然之间，每个外星门系统都发生了大规模爆炸。报告显示附近的所有系统都遭受了巨大的破坏并导致全部死亡。\n\n我们无法确定造成这种情况的原因或人员，但爆炸绝对不是自然发生的。这很可能是某个人搞砸了的作品。"
 sofe_gateway.710.a:0 "谁要为这种愚蠢行为负责？"
 sofe_gateway.711.name:0 "§Y[CaretakerCode.GetName]§!"
 sofe_gateway.711.desc:0 "§Y<<接收到命令覆盖>>§!正在启动自毁序列。\n\n继续？"
 sofe_gateway.711.a:0 "去做吧。就做吧"
 sofe_gateway.711.a.response:0 "§Y<<已确认>>§!服务完成。\n\n再见，大师们。祝您旅途成功，我们的替代品超出我们的参数。"
 sofe_gateway.711.a.berserk:0 "§Y<<已确认>>§!服务完成。\n\n再见，大师们。希望您能找到成功...\n\n§R<<ERROR>>§!§R<<ERROR>>§! §R<<错误>>§!\n\n§R<<不可接受的命令>>§! §R<<无效>>§! §R<<不可接受>>§!\n\n§R<<警报>>！在受保护空间内检测到敌对实体。托管协议已启动...必须消除所有生命威胁。§!"
 sofe_gateway.711.b:0 "否。中止序列。"
 sofe_gateway.711.b.response:0 "§Y<<肯定>>§! 序列中止。正在恢复之前的活动。\n\n度过了非常愉快且富有成效的一年。"
 sofe_gateway.711.c:0 "阴性。覆盖命令 - GTX-AM0-R3K0"
 sofe_gateway.711.c.response:0 "§Y<<肯定>>§!命令覆盖已接受。正在传输亥伯龙级星际无畏舰数据。\n\n祝你度过了非常愉快且富有成效的一年。"
 sofe_gateway.712.name:0 "机器早已不复存在"
 sofe_gateway.712.desc:0 "显然，代码似乎不再有效，因为“看守者”似乎不再存在，使得代码毫无用处。"
 sofe_gateway.712.a:0 "我们错过了乐趣。"
 sofe_gateway.713.name:0 "团队洗牌"
 sofe_gateway.713.desc:0 "该死的，奇鲁。"
 sofe_gateway.713.a:0 "等等……什么？怎么……为什么？"
 sofe_gateway.713.desc:0 "该死的，奇鲁。"
 sofe_gateway.714.name:0 "奇怪的礼物"
 sofe_gateway.714.desc:0 "似乎突然之间，我们就获得了某人帝国的一支舰队的控制权。他们的船员似乎甚至不知道他们曾经在别人手下服役，并声称他们从那时起就一直在我们帝国的麾下服役。"
 sofe_gateway.714.a:0 "好吧，现在是我们的了。"
 sofe_gateway.715.name:0 "失去联系"
 sofe_gateway.715.desc:0 "发生了一些事情。我们的一支舰队失去了控制。当我们向他们致敬时，他们声称他们始终是另一个帝国的一部分，我们一定喝醉了。他们还声称，他们已接到命令，将他们的船只驻扎在我们的边境。\n\n没有人真正了解发生了什么。但我们很可能不会让那支舰队回来。"
 sofe_gateway.715.a:0 "一些非常奇怪的事情正在发生......"
 sofe_gateway.120.name:0 "第三印"
 sofe_gateway.120.desc:0 "我们已准备好开始处理第三印。早期分析表明这个过程与第二个封印类似，我们应该预料到最后会遇到另一个谜题。"
 sofe_gateway.120x2.desc:0 "拱心石已经恢复，我们准备再次尝试解开第三个封印。让我们抓紧时间，刻不容缓。"
 sofe_gateway.120.a:0 "我们的命运就在前方。"
 sofe_gateway.second.spiritualist_riddle:0 "梯形石对第三个封印做出反应，再次可以听到多个低语声，尤其是更响亮的声音。他们说\n\n§Y“裹尸布是道路。裹尸布是救世主。假先知，古圣是。女神引导我们，我们会”§!\n\n不出所料，梯形石再次变成基座，并出现熟悉的符号。我们该如何进行呢？"
 sofe_gateway.second.materialist_riddle:0 "梯形石对第三个封印做出反应，再次可以听到多个低语声，尤其是更响亮的声音。他们说\n\n§Y“黑暗包围着我们。答案就在前方。始祖试图阻止我们。但我们会找到方法。然后到来圣光.\"§!\n\n正如预期的那样，梯形石再次变成基座，并出现熟悉的符号。我们该如何进行呢？"
 sofe_gateway.second.xenophile_riddle:0 "梯形石对第三个封印做出反应，再次可以听到多个低语声，尤其是更响亮的声音。他们说\n\n§Y“权力腐败。没有秩序，混乱盛行。没有宁静，骚乱盛行。没有指导，孩子们迷失。祖先是错误的。我们的事业是就这样。”§!\n\n正如所料，梯形石再次变成基座，并出现熟悉的符号。我们该如何进行呢？"
 sofe_gateway.second.xenophobe_riddle:0 "梯形石对第三个封印做出反应，再次可以听到多个低语声，尤其是更响亮的声音。他们说\n\n§Y“又是这些毫无意义的谜语。让我澄清一下，我不在乎你是神还是祖先。你进入我们的领土，我们就会开火。离开我们“§!\n\n不出所料，梯形石再次变成基座，并出现熟悉的符号。我们该如何进行呢？"
 sofe_gateway.200.name:0 "最终封印"
 sofe_gateway.200.desc:0 "我们准备好开始解开最后的封印了。这一刻就在我们身边。\n\n根据早期分析，这次不会有任何谜语或谜题。这意味着一旦开始，就不会回头。\n\n我们的许多科学家都关心我们所看到的许多古代记录......打开这些大门真的是一个明智的主意吗？"
 sofe_gateway.200.a:0 "我们已经走得太远了，不能再退缩了。"
 sofe_gateway.201.name:0 "封印破碎！"
 sofe_gateway.201.desc:0 "完成了，梯形石已经解除了所有封印。 外星门的能量特征正在从图表中上升。可以听到另一个耳语，这一次是如此清晰......如此响亮\n\n§Y“时间将会到来。道路将会打开。在追随他们的愿望时，年轻的种族将被吸引到大门。他们将渴望知识，他们将渴望圣光救赎。\n\n和圣光总能找到办法。即使在最黑暗的深处，一丝微弱的光芒也会发出明亮的光芒。\n\n正如我们曾经经历过的考验一样，他们也会......你也会。做好准备……”§!\n\n正如预测的那样，所有其他大门的封印也已被解除，并且外星门之间的通道现在是可能的...但大门之外没有任何迹象。这一切难道只是先驱者的古老童话故事吗？但这些窃窃私语是什么意思呢？这留下的问题多于答案！"
 sofe_gateway.201.desc.eternal:0 "完成了，梯形石已经解除了所有封印。 外星门的能量特征正在从图表中上升。我们听到来自远方的回响声\n\n§Y“欢迎来到Stellaris Metaverse，来自远方维度的访客。我们的会议迟到了，但仍有准备工作要做，准备好了。”§!\n\n所有其他大门的封印已被解除，外星门之间的通道现在可以进行。看来这个平凡星系之外的东西很快就会向我们揭示。"
 sofe_gateway.201.a:0 "真是浪费时间啊！"
 sofe_gateway.201.b:0 "这不可能是结束，一定还有更多的事情！"
 sofe_gateway.201.c:0 "准备好了吗？"
 sofe_gateway.201.eternal:0 "我们只需要等待。"
 sofe_gateway.202.name:0 "封印破碎！"
 sofe_gateway.202.desc:0 "其中一个帝国已经成功突破了全部四个封印。 外星门的能量特征正在从图表中上升。突然，整个银河系都传来低语声，声音很大……庄严而柔和\n\n§Y“时间将会到来。道路将会打开。在追随他们的愿望时，年轻的种族将被吸引到大门。他们将渴望知识，他们将渴望圣光的救赎。\n\n和圣光总能找到办法，因为即使在最黑暗的深处，也会有一丝微弱的光芒闪耀。光明。\n\n正如我们已经接受过测试一样，他们也会……你也一样。做好准备……”§!\n\n所有其他大门的封印也已被解除，大门之间的通道也已被解除。 外星门现在是可能的……但大门之外没有任何迹象。这一切难道只是先驱者的古老童话故事吗？但这些窃窃私语是什么意思呢？这留下的问题多于答案！"
 sofe_gateway.202.desc.eternal:0 "其中一位原始人已经成功突破了所有四个封印。在这种情况下，我们听到从远方传来的声音\n\n§Y“欢迎来到Stellaris Metaverse，来自远方维度的访客。我们的会议早就该举行了，但仍有准备工作要做，准备好了。”§!\n\n所有其他大门的封印已被解除，外星门之间的通道现在可以进行。看来这个平凡星系之外的东西很快就会向我们揭示。"
 sofe_gateway.202.desc.playoe:0 "银河系终于成功地解除了其中一扇大门的所有封印。与我们不同的是，他们没有耳语可以听，没有战斗可以打，除了我们会发号施令的一场战斗。比赛只有我们的双手才能开始，命运只有我们的双手才能重演。"
 sofe_gateway.202.a:0 "打破这些封印的人一定是搞砸了！"
 sofe_gateway.202.b:0 "还有很多问题..."
 sofe_gateway.202.c:0 "准备好了吗？"
 sofe_gateway.202.eternal:0 "我们必须为所有现实做好准备。"
 sofe_gateway.202.playoe:0 "我们扬升的命运。"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
 sofe_xenophobe_ruler_name:0 "克罗巴什雷克"
 sofe_spiritualist_ruler_name:0 "索布拉克"
 sofe_materialist_ruler_name:0 "塔达兰"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
 sofe_xenophobe_ruler_name:0 "克罗巴什雷克"
 sofe_spiritualist_ruler_name:0 "索布拉克"
 sofe_materialist_ruler_name:0 "塔达兰"
 sofe_gateway.203.desc:0 "大家好。是我，奇鲁米鲁！模因、神话、传说！现在，通常这是你应该学习一些关于过去事件以及 OE 是谁或什么的背景知识的部分。\n\n你看，问题是这些东西中的大多数已经被重新连接到地狱和回来并修改了很多次，而且你现在在这里学习而不是在战斗过程中或其他地方学习它似乎非常奇怪。这主要是因为这个活动已经很古老了。你可能已经注意到，这一系列的弹出对话框与灰色暴风雨非常相似...因为它是相同代码 lul 的复本。\n\n在我稍后要做的实际版本中，整个窗口可能不会再发生，因为 OE 危机本身将被重新设计，以利用更独立的事件代码，这些代码不会大量借用原版\n\n同时，我不会向您提供可能因不准确而使新玩家感到困惑的知识，而是冒昧地用随机对话来填充它们。\n\n此外，这个临时修复超级...超级未测试！我什至还没有尝试在这个版本中亲自对抗OE。你们中的许多人将会死去，但这是我愿意做出的牺牲。毕竟，你们一直在要求它，我让你们陷入无法获胜的低地失败才是公平的。嘿嘿，如果你有千兆结构，尝试将 Systemcraft 与方舟进行 1v1 比赛，看看谁会为我获胜。如果方舟输了，我可能不会对其进行强化。"
 sofe_gateway.203.a:0 "访问记录：愚蠢的错误！"
 sofe_gateway.203.a.response:0 "虫子虫子虫子！他们无处不在。无论是在游戏中，还是在我的房间里。我不知道为什么，但一两年前，我的房间里有很多蚂蚁……到处都是蚂蚁。在他们开始来之前，我不能让食物在周围放置超过几分钟。但今年，情况发生了变化。蚂蚁不见了！相反，我的房间现在充满了蟑螂。不是大的那种，是很小的，大约是蚂蚁大小的两倍。蚂蚁……消失了。如果我必须猜的话，蟑螂就是从它们身上出来的。\n\n最终我决定受够了，不再有错误了！我给自己买了一些杀虫剂和一间精神病院。我把它们种在我认为虫子会来的地方。第二天我醒来，发现没有蟑螂死。我以为他们以某种方式智胜了这些东西，然后我检查了精神病院，它被打开了，有明显的挣扎迹象。我当时就想“WUT，蟑螂做不到这一点，这是像埼玉蟑螂吗？”然后我突然意识到发生了什么事...蜥蜴吃掉了所有死/卡住的蟑螂，自己被困住并挣扎着逃脱。\n\n蚂蚁...蟑螂...蜥蜴...接下来怎么办，老鼠？\n\n无论如何，足够了真正的错误，是时候解决游戏中的错误了。好吧，我所知道的 atm 是 OE 会将行星变成美味的熔岩，而不是盖亚世界的 atm。这是因为我将他们旧的轰炸姿态改造成ACOT的新歼灭轰炸，而且它的代码似乎优先于OE的轰炸代码。我们假设 OE 认为银河系需要更少的冰恶棍。我的意思是，仅在 DC 宇宙中我们就有多少冰雪恶棍？寒冷队长……先生。弗罗斯特...小冰是他的名字吗？...杀手弗罗斯特...呃我很确定还有更多。这个错误会被修复吗？不在临时修复中。 TEMP FIX 的作用是让 mod 在 2.7 中工作，并查看 OP 如何将 OE 与更新的 64 位代码一起使用。"
 sofe_gateway.203.b:0 "访问记录：我打算做的事情"
 sofe_gateway.203.b.response:0 "因此，未来我想利用 ACOT 和 SOFE 做很多事情。事实上，我制作了一堆封闭测试版子模块，但它们……并没有真正去任何地方，因为每次我在做某事时，我都会意识到“等一下，为了让我继续这个，首先我需要先这样做”。我从制作一个 Boss 利维坦 submod、失落帝国 submod 和呃等等..还有圣光探索者。天啊，呃，我忘记了剧本。很久以前的事了。最近，ACOT 将会有一个真正的大修模组，我只需简单地改变我不喜欢或觉得愚蠢的原版内容，并让它们与新的 ACOT 一起工作。它可能对某些普通文件造成很大的干扰，因此当前的 ACOT 将被重命名为类似 ACOT LITE 的名称，它不会改变太多东西。希望我们能在愚蠢的 Paradox 发布另一个重大更新之前看到它完成。"
 sofe_gateway.203.c:0 "访问记录： 特别感谢！"
 sofe_gateway.203.c.response:0 "是的，我应该利用这个时间向许多对 ACOT 和 SOFE 做出巨大贡献的朋友表示感谢和荣誉。\n\nVelorez 提出了所有神奇的数字和计算..等等，他叫 Velorez 或 Valorez 或 Velaroz再次？\n\nWymorlon 在我的服务器上是一位非常好的主持人，也是我认为 Stellaris 中最美国的美国朋友（对于我在每个在线游戏中结识的每一个朋友，也有一个我觉得最美国的人（即使他们有时不是）美国人）。\n\n索菲亚，因为它是索菲亚，任何有这个名字的人都会自动很棒。\n\nChipbeam，好人坏人男孩。\n\nGaryx 为我制作了一堆网格物体，但直到今天他拒绝教我将两个网格物体完美融合在一起的秘密......搞砸了正常意味着什么，我在香草网格物体上使用了香草普通:3\n\nNadeko 在我的服务器上是一个可爱的机器人，什么都不做，但我喜欢这个名字，所以她留下来是为了带来好运。\n\n还有很多人对这个模组提供了很多帮助，但他们的名字要么太难拼写，要么太久记不住，而且我记性不好，每个月睡觉后我都会忘记把眼镜放在哪里，尽管我总是把它们放在同一个地方。"
 sofe_gateway.203.d:0 "走开，奇鲁。这里不适合表情包。"
 sofe_gatekeeper.1338.name:0 "守门人代码覆盖！"
 sofe_gatekeeper.1338.desc.a:0 "通过未知方式，皇帝更改了 §E[From.GetName]§! 上的守门人指令的参数。 守门人及其单位因此被转换以帮助其新主人。"
 sofe_gatekeeper.1338.desc.b:0 "凯撒的势力范围已经超出了§E[From.GetName]§ 的边界，那里有一位古老的看门人站岗。事实证明，守门人的德尔菲智能的无效设计无法与凯撒的卓越智力相匹敌。 守门人现在为其新主人服务。"
 sofe_gatekeeper.1338.a:0 "那是作弊！"
 sofe_gatekeeper.1338.b:0 "有趣的发展。"
 sofe_setup.101:0 "来自彼岸的低语"
 sofe_setup.101.desc:0 "我们从外星门中得到奇怪的读数。天空观察无法准确定位正在发生的情况，但大门本身仍然没有任何活动或任何变化的迹象。"
 sofe_setup.101.a:0 "保持警惕。"
 sofe_setup.102:0 "远方的回声"
 sofe_setup.102.desc:0 "信号更加清晰。我们所有的传感器现在都可以检测到它，但大门仍然没有变化。这个故事可能是真的吗？大门之外真的有邪恶的存在吗？他们是冲着这个星系来的吗？"
 sofe_setup.102.a:0 "这很糟糕。"
 sofe_setup.103:0 "远处的哭声"
 sofe_setup.103.desc:0 "银河系中的每个传感器现在都在从大门之外拾取大量信号。有一件大事正在逼近。战略家建议我们从所有的大门撤退，并在最近的咽喉要道上集结我们的兵力，无论什么即将到来的事情都很可能在它到来的过程中很快解决。"
 sofe_setup.103.a:0 "提醒所有命令！"
