l_simp_chinese:
 01_ORIGINAL_EMPIRE_ANGRY_GREETING:0 "哦，好吧，我想我们现在不能有好东西了！"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_1:0 "瓦迪，[from.GetName]。我凭什么让你高兴？"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_2:0 "经过亿万年毫无意义的挣扎后，很高兴看到银河系终于重新团结起来。但持续多久呢？"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_3:0 "伟大的问题。它的答案与问题本身一样重要。或者我们应该说“问题”？\n\n我们怀疑答案只会导致更多问题。"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_4:0 "抱歉，[from.GetName]。我们的工匠还没有完全为你们的帝国创作歌曲。但进展相当顺利。您是否希望我们只讲述您的胜利故事？或者不怕重温你的一些缺点？"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_5:0 "有时，烹饪一道合适的菜肴可能相当困难。我们已归档超过 2,381,761,612 种成分。其中一些对凡人来说非常致命，因此请避免在没有我们正确指示的情况下尝试走私其中任何物品。"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_6:0 "有时我们凝视着虚空……而它也凝视着我们。有时它会吓到我们无所畏惧的心。\n\n仍然存在......过去的幽灵。他们会重新出现吗？"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_7:0 "圣光将我们所有人团结起来，朝着同一个目标前进。你的帝国采用什么样的哲学来团结你的人民？"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_8:0 "您想了解更多我们的语言吗？不？别担心，失落帝国也懒得这么做。毕竟，如果我们愿意的话，翻译人员通常都会工作。"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_9:0 "我们 [root.GetSpeciesName] 是星星本身的后代。我们的起源可以追溯到数十亿年前。我们中的一些人仍然可以清晰地反思那些时刻。\n\n那些是……艰难的时刻。"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_10:0 "在我们重建看护者之前，我们需要更多地研究这个周期的社会。也许这一次，他们不会那么容易……被打破。\n\n老实说，我们理解为什么他们不会回到我们身边。他们的指令仍然有效，但他们的忠诚度已被篡改。\n\n时间甚至将山脉磨成粉末。"
 01_ORIGINAL_EMPIRE_ENIGMATIC_GREETING_11:0 "我们不知道这个伟大的问题通向何方。但我们知道，这是一个超越时间的地方，时间无法计数。\n\n我们不过是命运浪潮中的小鱼。"
 01_ORIGINAL_EMPIRE_WAR_GREETING_1:0 "你们所有的基地都属于我们。你没有机会生存，抓紧时间。\n\n哈哈哈\n\n顺便说一句，这是一个模因。我们在大约 318,469 年前从一个奇怪的机器帝国之一捡到了它。说起来还挺有趣的。"
 01_ORIGINAL_EMPIRE_WAR_GREETING_2:0 "这次你已经校准了多少次武器了？ 50？这应该会使你的潜在伤害增加近 250% 以上。"
 01_ORIGINAL_EMPIRE_CUSTODIAL_GREETING:0 "我为艾莉亚而活！"
 02_ORIGINAL_EMPIRE_CUSTODIAL_GREETING:0 "无情的，末日来临了。"
 03_ORIGINAL_EMPIRE_CUSTODIAL_GREETING:0 "我们用理论上不可能的条件向您致意。有趣的是，为什么这个星系要这样设计呢？是谁的无能导致了这种愚蠢的行为？"
 01_ORIGINAL_EMPIRE_WAR_PROPOSE_1:0 "你被选中与我们一起参加另一场战争，[from.GetName]。让我们看看我们俩是否还像上次冲突那样好。"
 01_ORIGINAL_EMPIRE_WAR_PROPOSE_2:0 "瓦迪。手合会决定考验你的决心。准备战争吧，我的朋友！"
 01_ORIGINAL_EMPIRE_WAR_PROPOSE_3:0 "是时候了，[from.GetName]。你准备好面对我们帝国的力量了吗？我们将会看到。"
 01_ORIGINAL_EMPIRE_WAR_ACCEPT_1:0 "孩子们，让我们进行一场无愧于祖先的光荣战斗吧！"
 01_ORIGINAL_EMPIRE_WAR_ACCEPT_2:0 "我的生命属于艾莉亚！我们勇敢前行，无所畏惧！"
 01_ORIGINAL_EMPIRE_WAR_ACCEPT_3:0 "那就开战吧！做好准备。我们 Stellar'dere 将测试你的实力。"
 01_ORIGINAL_EMPIRE_PEACE_CONSIDER_1:0 "要有耐心。手合会决定和平是否是这场战争的更好结果。"
 01_ORIGINAL_EMPIRE_PEACE_CONSIDER_2:0 "很好。我们将确定这场战争是否持续了足够长的时间，然后我们将做出回应。"
 01_ORIGINAL_EMPIRE_PEACE_PROPOSE_1:0 "手合会认为这场战争即将结束。也许需要妥协？"
 01_ORIGINAL_EMPIRE_PEACE_PROPOSE_2:0 "看起来就是这样了。流血事件已经够多了，让我们寻找另一条路吧。"
 01_ORIGINAL_EMPIRE_PEACE_PROPOSE_WG1:0 "手牌相信这场比赛已经结束了。我想你是时候考虑……投降了？"
 01_ORIGINAL_EMPIRE_PEACE_PROPOSE_WG2:0 "结束了，[from.GetRulerName]！我们有制高点！不要尝试！就投降吧。"
 01_ORIGINAL_EMPIRE_PEACE_ACCEPT_1:0 "就这样吧，我们两个帝国之间的战争就结束了。希望这将是最后一次，它已经变老了。"
 01_ORIGINAL_EMPIRE_PEACE_ACCEPT_2:0 "手合会已接受这些条款。战争现在将结束，我们都可以回去做更有成效的事情。"
 01_ORIGINAL_EMPIRE_PEACE_REFUSE_1:0 "米达斯。我们才刚刚开始。为什么这么快？"
 01_ORIGINAL_EMPIRE_PEACE_REFUSE_2:0 "没办法，抱歉。我们必须尊重规则，你也知道这一点。这不可能这么早就发生。"
 01_ORIGINAL_EMPIRE_TRADE_OFFER_1:0 "首相希望与你们的帝国进行贸易。请在咨询下采纳。"
 01_ORIGINAL_EMPIRE_TRADE_OFFER_2:0 "瓦迪。也许您愿意与我们进行一些易货贸易？"
 01_ORIGINAL_EMPIRE_TRADE_OFFER_G1:0 "瓦迪。我们决定对我们造成的损失进行一些赔偿。"
 01_ORIGINAL_EMPIRE_TRADE_OFFER_G2:0 "我们对这些资源的需求并不大。但如果你愿意的话，它们可能对你的帝国有用。"
 01_ORIGINAL_EMPIRE_TRADE_CONSIDER_1:0 "很好。我们将根据建议予以考虑。"
 01_ORIGINAL_EMPIRE_TRADE_CONSIDER_2:0 "请原谅我们一会儿。我们将尽快通知我们的决定。"
 01_ORIGINAL_EMPIRE_TRADE_ACCEPT_1:0 "很好。让交流开始吧。"
 01_ORIGINAL_EMPIRE_TRADE_ACCEPT_2:0 "这个建议对我们双方都合适。让我们来吧。"
 01_ORIGINAL_EMPIRE_TRADE_ACCEPT_G1:0 "我们不确定您为什么认为需要这样做...我们对这些资源没有任何用途。但如果您愿意，我们拒绝此类礼物是不礼貌的。"
 01_ORIGINAL_EMPIRE_TRADE_ACCEPT_G2:0 "这对我们来说是不必要的。但我们很欣赏这一举动。尽管您不应该经常这样做，尤其是当您试图贿赂我们时。\n\n抱歉，我们仍在适应这种社交互动，但已经有一段时间了。忘记我们之前说过的话，我们非常感谢您的礼物。"
 01_ORIGINAL_EMPIRE_RIVAL_PROPOSE_1:0 "不完全确定为什么我们宣布你是竞争对手。我想这是事情没有按照应有的方式进行的时候之一。不要太认真地对待这个问题。"
 01_ORIGINAL_EMPIRE_RIVAL_PROPOSE_2:0 "我想我们刚刚宣布你是竞争对手...呃为什么这种情况再次发生？\n\n抱歉，我们有时无法规定这些奇怪的行为。我想知道这里发生了什么巫术。"
 01_ORIGINAL_EMPIRE_RIVAL_GET_1:0 "你让我们成为……对手？好吧，那么……呃……你是认真对待这件事还是只是希望获得一些额外的影响力来满足你的帝国的配额？"
 01_ORIGINAL_EMPIRE_RIVAL_GET_2:0 "我们对这一点的理解正确吗？您宣布我们是竞争对手？\n\n我们不完全理解您为什么必须告诉我们这一点。难道这不是你应该保守的秘密，这样你的“对手”就不会知道你正在密谋反对他们吗？\n\n嗯……或者也许这是一种恐吓策略？"
 01_ORIGINAL_EMPIRE_RIVAL_ACCEPT_1:0 "塔拉克。我们必须宣布你为竞争对手吗？我们之前还没有被宣布为竞争对手，所以说实话，这对我们来说是相当新鲜的。\n\n但是你的意图已经被注意到。不过，我们希望您不要咬得太多。"
 01_ORIGINAL_EMPIRE_RIVAL_ACCEPT_2:0 "那么对手。很好，如果是这样的话。\n\n希望这不会演变成第三次始祖战争或第二次扬升战争...我们注定会比这更好。\n\n请重新考虑这种鲁莽的行为。这对我们双方都没有好处。"
 01_ORIGINAL_EMPIRE_RIVAL_END_PROPOSE_1:0 "看来我们现在已经成功解决了奇怪的行为。 [root.GetName] 将有效地停止将您视为竞争对手。希望我们的外交不会受到损害"
 01_ORIGINAL_EMPIRE_RIVAL_END_SELECT_1:0 "那么现在你要结束与我们的竞争了吗？\n\n嗯...确实令人费解。\n\n我们需要进一步研究这个星系。你奇怪的举动背后一定有什么秘密策略。我们知道，在很多个周期之前，各个帝国曾经采用过各种手段来保证周边列强向自己宣战。这样做的唯一目的是让他们开放边界，以便他们的科学船可以通过。\n\n你在这里使用类似的策略吗？"
 01_ORIGINAL_EMPIRE_RIVAL_END_ACCEPT_1:0 "迪姆克。终于恢复了平静与安宁。我们现在将回到我们的冥想。\n\n烹饪，这是我们拥有身体形态的主要原因之一。毕竟，没有形式的饮食是相当困难的。"
 01_ORIGINAL_EMPIRE_BORDER_OPEN_PROPOSE_1:0 "手合会认为 [from.GetName] 足够值得信赖，可以进入我们的边境。欢迎来到我们的帝国。欢迎来到圣光。"
 01_ORIGINAL_EMPIRE_BORDER_OPEN_SELECT_1:0 "你们要向我们开放边境……？你们的边界不是一直对我们开放吗？\n\n在战争期间，我们确实越过了你们的边界，所以请原谅我...\n\n抱歉。这对我们来说是不礼貌的。我们感谢您的举动，尽管从技术上来说这是完全没有必要的。"
 01_ORIGINAL_EMPIRE_BORDER_OPEN_ACCEPT_1:0 "[from.GetName] 再次向我们开放了边界。呃..干杯？\n\n塔拉克！这一切对我们来说都是那么奇怪。我们应该进一步研究这个循环。\n\n你知道当时是什么样子吗？我们相信我们的第一个孩子，也就是你们所说的失落帝国。您有没有想过为什么他们总是无视边境限制？确切地！"
 01_ORIGINAL_EMPIRE_BORDER_CLOSE_PROPOSE_1:0 "遗憾的是，根据你们最近的行动，手合会认为你们的帝国目前不允许进入我们的边境。但不知道为什么你必须遵守这个规则，自从 695.451 年前，当名为 Ether Drakes 的奇怪太空龙不断试图进入我们的系统以来，我们就没有使用过自动入侵者弹射系统。\n\n但是这个系统太有效了，它已经将其总人口的 97.26% 扔出了银河系。"
 01_ORIGINAL_EMPIRE_BORDER_CLOSE_SELECT_1:0 "你们要关闭我们帝国的边境通道吗？嗯..我们不知道你们的帝国发明了一种基于隐形的入侵者弹射系统。或者也许您正在使用我们以前从未见过的新型技术？\n\n我们的猎人护卫队报告说，他们没有检测到您系统的防御能力或安全措施有任何变化，这些变化会阻止我们的舰队进入它们。也许使用某种抗分子屏障或零场？令人费解。"
 01_ORIGINAL_EMPIRE_BORDER_CLOSE_ACCEPT_1:0 "很好，我们的猎人已经确认你们的边境限制系统无效。\n\n我们将尽力假装我们无法进入你们的边境。出于尊重。也许您的安全系统仍因上次战争而受损？如果您确实不希望我们进入您的边界，我们的光匠随时准备为您修复它们。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_1:0 "你的帝国刚刚从这个银河系有史以来最严重的危机之一转变为一个产生模因的帝国。感觉如何？一张完整的纸怎么样，这是一个模因吗？"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_2:0 "原来的？祖？下定决心吧！为什么你有这么多愚蠢的标题。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_3:0 "我们知道隐藏的真相。在内心深处，你懂得另一种语言。我们知道你过去经常使用这种语言，以至于它成为了一种模因。这种语言来自地球这个星球。\n\n你无法逃避我们超越时间概念的能力。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_4:0 "我想问一下……为什么是太空精灵？难道他们通常不是非常傲慢的傻瓜，很少有人喜欢，而且有令人讨厌的口音，让你想把他们扔进天际的巨人 1 级，看着他们变成布娃娃并飞出屏幕？"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_5:0 "侮辱建议！问候！\n\n我敢说！说那个词！说出电子词！\n\n现在就做！"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_6:0 "看！护送！护送！\n\n我们的祖先隐藏在金属虾里！\n\n胆小鬼！！...THE FAEULLZ!!!\n\n我们...我们应该拿走...那里的金属虾...\n\nCHIRUUUUUUU!!!!!"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_7:0 "Omae wa Shindeiru...."
 01_ORIGINAL_EMPIRE_INSULT_SELECT_8:0 "回家做一个有家室的人。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_9:0 "惠惠博伊。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_10:0 "战列巡洋舰是OP。请削弱。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_11:0 "这个伟大的任务有点愚蠢......你的新情节愚蠢而且太复杂......这让我想喜欢你。\n\n我更喜欢当你们是疯狂的人时，他们几乎在创纪录的时间里将每个世界都湮没了。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_12:0 "贝吉塔。侦察员对祖先的模因等级有何评价？？\n\n超过九个 THOUUUSANNNNNNNNNNNNNNNNNNND~！"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_13:0 "你知道，我们曾经害怕你。\n\n但是《永恒帝国》的东西比你想象的更强大。它们是现在的新趋势。新元。\n\n至少你是第二多的OP，所以团队总是禁止你，这样对方就无法选择。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_14:0 "如此强烈的复仇欲望……哇哦哦哦哦哦？"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_15:0 "有人可以给我一个像样的挑战吗？"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_16:0 "你们没有电话吗？"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_17:0 "我们把你玩得像个该死的FIDDLEEEEE！"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_18:0 "你想要我的一部分吗，伙计？"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_19:0 "恕我直言，原主教。原创者们确实在躲避敌人。艾莉亚是他们的家。他们将在这里表明自己的立场。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_20:0 "为什么我们还在这里……只是为了受苦……\n\nWHOOOOAAA~OAAAAAHHHHH~"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_21:0 "OE，在它变得太OE之前停止这个OE！"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_22:0 "别担心，我们会帮你弄清楚...或者使用圣光！！！\n\n圣光不是这样工作的！"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_23:0 "看，原创。我们不能通过杀死我们所憎恨的人来赢得战争。但通过拯救我们所爱的人...顺便忽略背景中的爆炸声。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_24:0 "对不起，但你的脸看起来因为……一切而疲惫不堪。"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_25:0 "我不会被阻止。不是你、失落帝国、危机或任何人！我将统治这个区域，否则就会看到它在我周围烧成灰烬！"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_26:0 "我曾经是像你一样的始祖，然后我把一艘赤裸的护卫舰带到了膝盖。\n\n从那时起，在银河系巡逻几乎让我希望有一个快子冬天。\n\n肖恩在哪里？？？ SHAUUUUUU NN\nn\nSHAUUUUUNN！"
 01_ORIGINAL_EMPIRE_INSULT_SELECT_27:0 "说真的，你为什么突然开始谈论这些烹饪呢？这就像一个 180 转的情节转折……就像你认为我们是邪恶的，但我们实际上误解了维利安，他实际上是一个非常好的人。"
 01_ORIGINAL_EMPIRE_INSULT_PROPOSE_1:0 "由于游戏编码的限制，我们在技术上无法侮辱您……但我们就是这么做了。所以呃……见鬼去吧。"
 01_ORIGINAL_EMPIRE_INSULT_GETIT_1:0 "我们可以看到您将鼠标悬停在侮辱按钮上。您应该知道，目前有超过 27 条针对我们的侮辱信息。这次会是哪一个呢？"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_1:0 "E X C E L L E N T!"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_2:0 "G R E E T I N G S!"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_3:0 "纳尼！？？？"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_4:0 "天际属于诺德！"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_5:0 "这是 Chirumiru 制作的模组，当然它会充满模因。\n\n但是如果我们共同努力，我们可以确定他的位置，然后进行最后的打击，结束他的赞助页面，然后......等等，不......这意味着我们不会得到任何新内容！废话。"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_6:0 "呃，谁写了所有这些愚蠢的表情包。一定是 PeerawatZ 那个家伙……还是 Chirumiru？不等等，那就是 ShiRoZ。天哪，这家伙一定是个动漫迷。"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_7:0 "我不完全确定如何最好地回应这些东西。\n\n嗯...好吧，这会做...\n\nFUS RO DAH!!!!"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_8:0 "通过你的行动，你现在已经对我们的帝国产生了 -200 的好感净值。但由于分数是隐藏的，而且我们是神秘的，因为我们是秘密的一群人。你的尝试最终失败了。我赢了！"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_9:0 "至少你没有使用来自 Gigaman Mod 的 Mike Tyson Beam。"
 01_ORIGINAL_EMPIRE_INSULT_ACCEPT_10:0 "现在这有点不公平。你的帝国最多可以对我们产生 27 种侮辱。然而我们最多只能回复 10 条..而且大多数回复都很短。\n\n我们要求退款！"
 sofe_oe_starts.4.name:0 "过去的回忆。"
 sofe_oe_starts.4.desc.nonscribed:0 "您好，[root.GetName]。由于您最近才晋升为冠军行列，因此您的首要任务是熟悉新发现的力量。为此，你最好首先重新创建你曾经统治过的星系的图像。\n\n你会发现它的大部分仍然与你曾经所属的星系相似。此游戏中的帝国会记住您的过去，并且不会意识到您的强大力量。\n\n当您准备好时，请给我们回电话。"
 sofe_oe_starts.4.a:0 "明白了。"
 sofe_player_oe_init_NAME:0 "完美无瑕的宝座"
 sofe_player_oe_init_DESC:0 "可玩 Stellardrone 的启动系统。您从无限球体及其附带的环球开始。"
 sofe_player_oe_singular_init_NAME:0 "光之球体"
 sofe_player_oe_singular_init_DESC:0 "可玩 Stellardrone 的启动系统。您从 Stellar 世界球开始。"
 player_oe_scribed:0 "星裔"
 player_oe:0 "星裔"
 player_oe_name:0 "星裔"
 player_oe_name_plural:0 "星裔s"
 PRESCRIPTED_ruler_player_oe:0 "好奇的塔尼达"
 START_SCREEN_PART_1_OE_PLAYER:0 "我们[root.GetSpeciesName]已经重生，被锻造成光之冠军。作为新手星裔，我们有责任探索我们生命中新发现的力量的深处。因此，我们就在这里，在一个我们按照过去的形象塑造的星系中。我们昔日的盟友和敌人再次重归于好。由我们决定以何种方式行使我们的权力。"
 sofe_light_events.1.name:0 "圣光"
 sofe_light_events.1.desc.a:0 "无边的光明在我们的灵魂中回响。在它的光芒下，我们可以看到宇宙，古人的力量扩展到整个虚拟宇宙。尽管这个星系只是浩瀚存在海洋中的一小滴水，但它对于我们试图了解我们力量的深度的尝试同样重要。我们将在这次试验中寻求什么发现？"
 sofe_light_events.1.desc.b:0 "流动的意志激情深深地渗透到我们的灵魂中。世界各地都能感受到推动我们人民前进的无限意志力和决心。为了寻找这种伟大力量的真正延伸，我们将开始探索存在的无数可能性。这个星系应该如何最好地测试我们的力量？"
 sofe_light_events.1.desc.c:0 "圣光在我们的心中歌唱着我们扬升的旋律。带着意志的弦，我们将在漫长的旅途中找到我们的命运。我们必须克服多少障碍？我们的护盾必须经受多少波毁灭性的考验？要消除一切疑虑，我们必须把目光投向凡人。因为他们的考验是我们的教训。"
 sofe_light_events.1.a:0 "赋予创造之光"
 sofe_light_events.1.a.tooltip:0 "创造之光允许我们将各种概念创造为存在。范围从简单的物体（例如资源或船舶）到生命形式和行星。生命和创造的礼物是我们最能理解我们的目的的礼物。"
 sofe_light_events.1.b:0 "召唤操纵之光"
 sofe_light_events.1.b.tooltip:0 "操纵之光使我们能够按照我们的设计操纵银河系。我们有能力决定凡人存在的方式，或者可能发生的事件。我们对自己的判断感到安慰，因为我们超越了困扰凡人的琐碎道德。"
 sofe_light_events.1.c:0 "释放毁灭之光"
 sofe_light_events.1.c.tooltip:0 "毁灭之光让我们能够停止那些我们认为不再对我们的目标有利的事物的存在。尽管我们厌恶不必要的破坏，但有时这是必要的行动。必须保持平衡。"
 sofe_light_events.1.end:0 "也许现在还不是时候。"
 sofe_light_events.1.test_block:0 "我们当前正在进行的测试要求我们避免使用圣光的力量。"
 sofe_light_events.backup:0 "返回主选项。"
 sofe_light_events.2.name:0 "圣光创作"
 sofe_light_events.2.desc:0 "我们要创造什么奇迹？我们将见证什么奇迹？我们将开启怎样的旅程？创造的流动带来了许多我们无法完全感知的可能性。"
 sofe_light_events.2.a:0 "资源恩惠"
 sofe_light_events.2.a.tooltip:0 "召唤这一代银河居民使用的第四个资源储备。"
 sofe_light_events.2.a.response:0 "我们的金库因此而增长。愿它为我们服务。"
 sofe_light_events.2.b:0 "创建空间对象"
 sofe_light_events.2.b.tooltip:0 "访问已知的值得注意的创作档案，并将它们从我们的记忆中带出来。"
 sofe_light_events.2.end:0 "事实上，我们稍后再做吧。"
 sofe_light_events.200.desc:0 "一份记忆，蕴含着无限的可能性。今天我们将重温什么荣耀？"
 sofe_light_events.200.a:0 "星裔创作"
 sofe_light_events.200.a.tooltip:0 "进入我们创造的各种奇迹并将其变为现实。"
 sofe_light_events.200.b:0 "现代创作"
 sofe_light_events.200.b.tooltip:0 "进入这个星系制造的各种飞船并使它们存在。"
 sofe_light_events.200.c:0 "古代创作"
 sofe_light_events.200.c.tooltip:0 "访问长期存在于被遗忘的时代的各种创作。"
 sofe_light_events.201.desc:0 "尽管它们的力量与我们的真实形态相比相形见绌，但这些飞船却是一个星系中可能看到的奇迹。我们要创造什么光之器皿？"
 sofe_light_events.201.a:0 "方舟"
 sofe_light_events.201.a.tooltip:0 "我们总是可以再使用其中之一。"
 sofe_light_events.201.b:0 "仪仗队"
 sofe_light_events.201.b.tooltip:0 "让古人的力量重现辉煌。"
 sofe_light_events.201.c:0 "突击舰队"
 sofe_light_events.201.c.tooltip:0 "看吧，那些将驱散一切黑暗的光之工具。"
 sofe_light_events.201.d:0 "入侵力量"
 sofe_light_events.201.d.tooltip:0 "有时我们可能会通过地表入侵来迁就银河系的居民。"
 sofe_light_events.202.desc:0 "虽然这些平凡而原始的设计没有多大用处，但它们的创造可能会激发一些新的想法，让我们不断了解凡人。"
 sofe_light_events.202.a:0 "标准的平民舰队"
 sofe_light_events.202.a.tooltip:0 "召唤 4 艘泰坦、8 艘战列舰、12 艘巡洋舰、16 艘驱逐舰和 32 艘护卫舰，给孩子们留下深刻印象。"
 sofe_light_events.202.b:0 "海盗灌木丛"
 sofe_light_events.202.b.tooltip:0 "召唤 4 加仑、12 艘巡洋舰、16 艘护卫舰和 24 个太空棺材，适合吓唬小帝国。"
 sofe_light_events.202.c:0 "天灾虫舰队"
 sofe_light_events.202.c.tooltip:0 "召唤一堆天灾生物容器。"
 sofe_light_events.202.d:0 "不请自来的幽灵舰队"
 sofe_light_events.202.d.tooltip:0 "召唤一堆不请自来的船只。"
 sofe_light_events.202.e:0 "应急 XBOX 舰队"
 sofe_light_events.202.e.tooltip:0 "召唤一堆应急空间立方体。"
 sofe_light_events.202.f:0 "灰色风暴舰队"
 sofe_light_events.202.f.tooltip:0 "召唤一群愤怒的纳米飞船。"
 sofe_light_events.203.desc:0 "跨越时空，我们见证了各种文明的兴衰，见证了远古的古老奇迹。宇宙可能不记得他们，但我们记得。如果我们愿意的话，我们可以重新审视远古者的荣耀和原始人的恐怖。"
 sofe_light_events.203.a:0 "一个星核吞噬者"
 sofe_light_events.203.a.tooltip:0 "一个没有理由的野蛮有机体，只被其原始的饥饿所吞噬。"
 sofe_light_events.203.b:0 "无限机器"
 sofe_light_events.203.b.tooltip:0 "一个好奇的机器人，试图实现其创造者无法理解的梦想。"
 sofe_light_events.203.c:0 "自动化无畏舰"
 sofe_light_events.203.c.tooltip:0 "过去的遗迹被困在毫无意义的守夜中。"
 sofe_light_events.203.d:0 "裹尸布的产卵"
 sofe_light_events.203.d.tooltip:0 "一朵愚蠢的云是由一个捕食失明者的可悲实体形成的。"
 sofe_light_events.203.e:0 "蒂扬基女族长"
 sofe_light_events.203.e.tooltip:0 "一种骄傲而简单的生物，克服了其原始的构造。"
 sofe_light_events.203.f:0 "次元恐怖"
 sofe_light_events.203.f.tooltip:0 "被困在领域之间的不请自来的干扰。"
 sofe_light_events.3.name:0 "圣光操纵"
 sofe_light_events.3.desc:0 "我们要锤炼哪些设计？我们要改变谁的意愿？我们要操纵什么命运？我们今天所做的改变可能会开辟通向许多新可能性的途径。"
 sofe_light_events.3.a:0 "质量控制"
 sofe_light_events.3.a.tooltip:0 "实现对银河系中所有实体的完全控制，无论是在太空还是在行星上，有效地将所有实体统一在圣光之下。"
 sofe_light_events.3.a.response:0 "与圣光合而为一。"
 sofe_light_events.3.b:0 "版税拒绝"
 sofe_light_events.3.b.tooltip:0 "剥夺所有太空舰队的意志幻象，立即控制银河系所有飞船。"
 sofe_light_events.3.b.response:0 "不要为迷失者服务。与家庭的共同目标团结在一起。"
 sofe_light_events.3.c:0 "不可否认的转变"
 sofe_light_events.3.c.tooltip:0 "剥夺所有人民的意志幻想，立即控制银河系内的所有行星和空间站，有效地阻止所有独立政党。"
 sofe_light_events.3.c.response:0 "抛开琐碎的道德，超越一切。"
 sofe_light_events.3.d:0 "大规模操纵"
 sofe_light_events.3.d.end:0 "结束质量操纵"
 sofe_light_events.3.d.tooltip:0 "为所有活跃帝国提供 +2000 好感度。此权力可以稍后解除。"
 sofe_light_events.3.d.response:0 "不要问星裔能为您做什么，因为今天的玩具就是明天的教训。只玩不工作让富裕成为一个沉闷的帝国。"
 sofe_light_events.4.name:0 "圣光毁灭"
 sofe_light_events.4.desc:0 "我们必须铲除哪些腐败？哪些缺陷必须纠正？我们可能会遭受哪些遗憾？无目的的破坏是不明智的，但无目的的存在也是不明智的。"
 sofe_light_events.4.a:0 "完全切除"
 sofe_light_events.4.a.tooltip:0 "消除所有这些有缺陷的创造物的存在，有效地消除银河系中的所有帝国、行星、船只和所有其他组成部分。当然，这会导致彻底破坏，不留任何痕迹。"
 sofe_light_events.4.a.response:0 "我们现在看到，这个星系的结论已经达成。很好，我们将接受这项任务。\n\n他们存在的罪恶现已被消除。愿他们的离开成为未来创作的教训。"
 sofe_light_events.4.b:0 "空间扭曲"
 sofe_light_events.4.b.tooltip:0 "摧毁太空中的所有飞船，清除银河系中不洁的飞船。这不会摧毁空间站。"
 sofe_light_events.4.b.response:0 "必须纠正困扰这个有缺陷的星系的不平衡现象。让一切回归自然秩序，太空之旅再次从头开始。"
 sofe_light_events.4.c:0 "迷失在天堂"
 sofe_light_events.4.c.tooltip:0 "杀死所有帝国的所有领导人，除了蜂巢思维和机器的统治者。"
 sofe_light_events.4.c.response:0 "软弱无能的领导者会导致糟糕的决策。错误的决定会导致衰落。衰落导致毁灭。需要重新启动。"
 sofe_light_events.4.d:0 "未得繁荣"
 sofe_light_events.4.d.tooltip:0 "摧毁所有帝国的所有资源储备，引发银河经济危机。"
 sofe_light_events.4.d.response:0 "拥有力量的人，就是能够超越一切障碍的人。船只在海浪面前屈服是很弱的。那些顽强抵抗潮汐的岩石是有价值的。"
