 sm_sbtg_module_lm_generator:0 "光球"
 sm_sbtg_module_lm_generator_desc:0 "即使我们失去我们的家园、我们的星球、我们的家人。我们总会找到办法的。 圣光照耀着我们所有人，无论我们身在何处。"
 sm_sbtg_module_defense_matrix:0 "欧米茄防御矩阵"
 sm_sbtg_module_defense_matrix_desc:0 "让黑暗成为一部分。"
 job_sofe_oceanmaster:0 "海洋大师"
 job_sofe_oceanmaster_plural:0 "海洋大师"
 job_sofe_oceanmaster_desc:0 "在海洋深处，在地球的金色王座中躺着海洋霸主。对他们来说，太空本身就是一片无尽的问题海洋，等待着好奇心的解答。"
 mod_job_sofe_oceanmaster_add:0 "$job_sofe_oceanmaster$"
 job_sofe_protector:0 "百夫长"
 job_sofe_protector_plural:0 "百夫长"
 job_sofe_protector_desc:0 "百夫长是抵御入侵者的第一道防线。每个军团有10个营，每个营有10名百夫长。不多也不少。\n\n装备着强大的光能武器和盔甲，他们翱翔天空，对所有入侵者造成毁灭性的打击。"
 mod_job_sofe_protector_add:0 "$job_sofe_protector$"
 job_sofe_celestial_force:0 "天界侍从"
 job_sofe_celestial_force_plural:0 "天界侍从"
 job_sofe_celestial_force_desc:0 "在成为一名成熟的守护者之前，尊敬的侍从必须掌握所有形式的战斗和战斗策略。扈从之间的激烈对决经常发生，双方都必须毫不留情，决斗直到完全死亡才会结束。胜者进入下一课，败者得到治愈并在新的身体中恢复活力。\n\n在战争时期，扈从将形成一道防线，冲在天界守护者的前面，以赢得荣耀和歌声。"
 mod_job_sofe_celestial_force_add:0 "$job_sofe_celestial_force$"
 job_sofe_meditator:0 "冥想者"
 job_sofe_meditator_plural:0 "冥想者"
 job_sofe_meditator_desc:0 "冥想者被召唤去实现比思想家更高的目标。这些明智的命运建筑师没有思考重大问题，而是思考当下。流光可能是他们目前拥有的最强武器，但总可以进一步改进以掌握新的力量。只有垃圾层失落帝国之类的磨砂膏才会停滞。"
 mod_job_sofe_meditator_add:0 "$job_sofe_meditator$"
 job_sofe_thinkers:0 "思想家"
 job_sofe_thinkers_plural:0 "思想家"
 job_sofe_thinkers_desc:0 "当没有被分配到任何特定目的时，这些普通人会花时间通过思考所有必需品的存在来照顾他人的需求。但他们最重要的作用却是冥想，无论是在海洋深处、山巅、星辰核心还是难以理解的地方，只有一个目标；回答这个伟大的问题。"
 mod_sofe_thinkers_add:0 "$job_sofe_thinkers$"
 job_sofe_lightsmith:0 "莱特史密斯"
 job_sofe_lightsmith_plural:0 "光匠"
 job_sofe_lightsmith_desc:0 "圣光铁匠将光能编织并锻造成战争武器或专用工具。他们能想到的、知道如何去做的任何东西，都会通过他们的意志显现出来。\n\n简单地说，他们可以通过纯粹的意志力创造任何东西，只要他们掌握这些东西的内部运作和本质是如何构成的。"
 mod_job_sofe_lightsmith_add:0 "$job_sofe_lightsmith$"
 job_sofe_dreamwalker:0 "梦行者"
 job_sofe_dreamwalker_plural:0 "梦行者"
 job_sofe_dreamwalker_desc:0 "所有星裔通过圣光统一。但为了确保团结是力量而非弱点的源泉，织梦者们在物质领域和圣光之间旅行，确保命运与希望的交响曲始终有利于他们的团结。 星裔的歌曲将在未来的万古岁月中继续流传。不管成本如何。"
 mod_job_sofe_dreamwalker_add:0 "$job_sofe_dreamwalker$"
 job_sofe_lifebinder:0 "生命缚誓者"
 job_sofe_lifebinder_plural:0 "生命缚誓者"
 job_sofe_lifebinder_desc:0 "每个星裔的本质都是由两个合成组成的；活生生的自我和全矩阵的自我。生命缚誓者拥有神秘的知识，可以将生命编织到容纳自我意识的身体中。\n\n一变成二，二变成一。自我和全矩阵角色被创建。然后知识被传递，新的生命..不...新的生命诞生了。\n\n此外，生命缚誓者负责编织他们灵魂的一部分来创造不太先进的结构，例如守卫、守门人、猎人、工匠和看护者。"
 mod_job_sofe_lifebinder_add:0 "$job_sofe_lifebinder$"
 auth_sofe_ancients:0 "§Y远古力量§!"
 auth_sofe_ancients_desc:0 "§Y这个权限在远古时代就已经存在；只有一个使命，一个目标。一位领导者领导着帝国，如果事实证明这位领导者能力不足，就会有另一位领导者，毫不犹豫。§!"
 name_list_Stellarborne:0 "星裔"
 name_list_Stellarborne_desc:0 "许多传奇人物的名字"
