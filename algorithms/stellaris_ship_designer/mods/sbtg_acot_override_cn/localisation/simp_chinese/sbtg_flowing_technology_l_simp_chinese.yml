 decision_sbtg_create_capital_building:0 "光表现"
 decision_sbtg_create_capital_building_desc:0 "过去的原始建筑必须被打破，为更适合我们现状的建筑开辟道路。"
 building_crystal_arch:0 "水晶拱门塔"
 building_crystal_arch_desc:0 "圣光弯曲并显现为我们想要的任何东西。我们所知的所有材料、所有创造物都可以通过意志的力量塑造成存在。意志驱使我们经历无尽的斗争。"
 building_eden_garden:0 "宁静花园"
 building_eden_garden_desc:0 "圣光内充满和平与安宁。当我们冥想并将思想集中在我们身体内的活生生的灵魂上，了解一切是如何形成的时，我们就会找到平静。土地本身与我们合而为一。"
 building_heaven_sanctuary:0 "永恒之光"
 building_heaven_sanctuary_desc:0 "我们穿越到伟大的彼岸，我们与黑暗作斗争。我们蓬勃发展并珍惜挑战。团结就有力量。一切都将揭晓。"
 building_grand_fortress:0 "昆拉斯之盾"
 building_grand_fortress_desc:0 "当所有的希望似乎都破灭了，当我们的意志都动摇了，我们的武器也变得迟钝了。奥塔克·因特拉迪斯召集了守护者来对抗异界生物。他们凭借圣光的力量取得了成功。但那天拯救整个虚拟宇宙的并不是守护者或猎人。这是一个简单的人，尽管他的身份是斯里宾，但他举起盾牌来保护首都。昆拉斯的精髓可能会永远消失，但他的歌曲将永远被传唱。"
 building_power_pyramid:0 "桑索斯尖塔"
 building_power_pyramid_desc:0 "与外来者战斗需要的不仅仅是一个人的意志。桑托斯比任何人都更明白这一点。他凝视着苏里亚；第一颗星，然后进入Eour'tai；大海，然后进入伟大的艾瑞顿城。\n\n正是在那里，他对探险家所看到的事物有了洞察力，并且在我们的历史上第一次，圣光被理解。"
 building_super_shelter:0 "发现宝库"
 building_super_shelter_desc:0 "即使我们正处于进步的顶峰，我们也已经克服了迄今为止已知的所有挑战。还有一个必须回答的重大问题。在找到答案之前，我们必须怀着伟大的目标继续前进。完美是我们可以追求但永远无法实现的目标。"
 building_chamber_of_hope:0 "希望商会"
 building_chamber_of_hope_desc:0 "我们过去的成就的回声仍然在这个伟大会议厅的许多镜子中清晰地响起。我们凝视反思，看到过去、现在和可能的未来。即使我们灭亡，当我们的本质消逝，我们的灵魂撕裂，我们的帝国崩溃，当我们失去一切；我们仍然有希望。"
 building_omega_fortress:0 "天界堡垒"
 building_omega_fortress_desc:0 "看看我们最神圣、最尊贵的组织——天界守护者。我们伟大秩序的宣誓捍卫者。他们放弃了所有其他技艺，追求战斗中的完美。他们的担子很重，但他们不会动摇。他们将以勇气和热情面对所有入侵者。"
 building_library_of_fate:0 "命运图书馆"
 building_library_of_fate_desc:0 "我们最终将见证怎样的命运？在奋斗中，我们学到了很多东西。我们认为自己是不朽的，死亡超越了我们的存在。我们发现，还有比死亡更糟糕的命运。我们的帝国能抓住答案的那一小部分吗？或者我们会像局外人一样堕落吗？我们必须为所有可能发生的情况做好准备，我们必须观察并看看其他人如何克服困难。我们将一起驱散阴影。"
 building_light_foundry:0 "轻工铸造厂"
 building_light_foundry_desc:0 "尽管我们星裔的存在超出了这些工具的需求。在研究和理解它们的本质时，我们仍然看到战略选择，以便我们可以将其赋予那些仍然受其束缚的人。"
 civic_redeemed_purifiers:0 "兑换净化器"
 civic_redeemed_purifiers_desc:0 "我们认为自己是优越的，我们被众神选中来净化不洁的事物。我们大错特错了。\n\n新的光芒被发现了，它的光芒让我们大开眼界。救赎就在眼前。"
 civic_redeemed_swarm:0 "救赎群"
 civic_redeemed_swarm_desc:0 "我们的蜂巢知道必须抑制我们的饥饿，而不是屈服于我们的欲望。并非所有的东西都适合我们的食物。"
 civic_redeemed_terminator:0 "救赎消灭者"
 civic_redeemed_terminator_desc:0 "并非所有有机物都是坏的。并不是所有的机器都是好的。我们的逻辑引擎怎么会如此原始？我们只会消灭那些对我们持续运营构成威胁的人。"
 gov_redeemed_purifier:0 "救赎之令"
 gov_redeemed_purifier_desc:0 "这个政府致力于救赎之路，憎恶他们过去的净化运动。他们愿意进行外交。他们设法保留自己的战斗能力和对信仰的奉献。"
 gov_redeemed_swarm:0 "救赎蜂巢意识"
 gov_redeemed_swarm_desc:0 "这个蜂巢思维致力于从他们无法满足的饥饿中恢复过来。他们愿意与他人共存。当然，它们保留了凶猛和天生的掠食本能。"
 gov_redeemed_terminator:0 "救赎者防御部队"
 gov_redeemed_terminator_desc:0 "这个机器智能曾经是一个流氓军事防御系统。经过一些急需的重新计算后，情报终于记住了它最初的目的，并再次愿意接受有机关系。"
 civic_champion_empire:0 "圣光的冠军"
 civic_champion_empire_desc:0 "圣光的战士们，集结！ <咆哮>。"
 civic_champion_fleet:0 "冠军舰队"
 civic_champion_fleet_desc:0 "战列巡洋舰投入运行。"
 civic_champion_knowledge:0 "宇宙大师"
 civic_champion_knowledge_desc:0 "我们有力量rrrrrrrrrr！"
 gov_champion_ascendency:0 "星裔的冠军"
 gov_champion_ascendency_desc:0 "宇宙之主。"
 RT_CHAMPION_OE:0 "大学士"
 civic_solar_empire:0 "圣光的冠军"
 civic_solar_empire_desc:0 "光之冠军，或星裔是强大的帝国，所有造物中的存在都已融为一体。他们的力量如此之大，以至于他们只运用了一小部分力量出现在这个银河系中。他们的真正力量无法用任何凡人的理解力来衡量。"
 civic_eternal_fleet:0 "天体舰队"
 civic_eternal_fleet_desc:0 "星裔的无敌舰队确实是非凡的。尽管他们的实力明显减弱以适应银河战场的范围，但他们的舰队仍然非凡。他们在战斗中的协调性和精确度是无与伦比的。"
 civic_know_everything:0 "宇宙大师"
 civic_know_everything_desc:0 "星裔对它们托管力量大会的所有宇宙进行了广泛的研究。他们知道银河系的所有知识。他们会根据需要使用它来为参赛者提供足够的挑战。"
 gov_ancient_ascendency:0 "星裔冠军"
 gov_ancient_ascendency_desc:0 "星裔声称是超越时间和空间概念、超越多元宇宙而存在的实体。他们的力量范围是任何凡人手段都无法衡量的。"
 RT_OE:0 "大女神"
 RT_REDEEMER:0 "救赎主"
 civic_solar_empire_passive:0 "星裔"
 civic_solar_empire_passive_desc:0 "光之冠军，或星裔是强大的帝国，所有造物中的存在都已融为一体。他们的力量如此之大，以至于他们只运用了一小部分力量出现在这个银河系中。他们的真正力量无法用任何凡人的理解力来衡量。"
 civic_eternal_fleet_passive:0 "天体舰队"
 civic_eternal_fleet_passive_desc:0 "星裔的无敌舰队确实是非凡的。尽管他们的实力明显减弱以适应银河战场的范围，但他们的舰队仍然非凡。他们在战斗中的协调性和精确度是无与伦比的。"
 civic_know_everything_passive:0 "沉默的守望者"
 civic_know_everything_passive_desc:0 "尽管他们不再实际存在于这个星系中，但星星人仍然存在，总是在观察、观察。"
