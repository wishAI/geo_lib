 origin_assault_guardian:0 "天界守护者"
 origin_assault_guardian_desc:0 "天界守护者是格斗专家，他们接受过地面战斗的专门训练。"
 origin_guardian:0 "星裔百夫长"
 origin_guardian_desc:0 "这些战士保护星裔的庇护所。由于他们在虚拟宇宙中积累了无数的战斗经验，他们已经成为无与伦比的最致命的战士。"
 origin_autarch_guardian:0 "普雷恰卡吉特·奥塔克"
 origin_autarch_guardian_desc:0 "天界至尊者是天界最优秀的守护者之一。独裁者不仅掌握各种形式的战斗，还掌握指挥和指挥战场的技能。在战斗中，这些勇敢的化身将不会对任何反对全面胜利的事物表现出任何态度。"
