 trait_pc_goodman_gaia_world_preference:0 "这个物种能够适应任何星球的恶劣环境。据说，只要它们相信自己已经准备好，它们甚至可以在恒星或黑洞中生存。"
 trait_bionic_implants:0 "全矩阵角色"
 trait_bionic_implants_desc:0 "该物种的意识与全能矩阵人格面具共享并交织在一起。两个存在，有两种思想……却合而为一。它们很多，但同时也是一个。\n\n结果是一个极其强大的实体，可以执行多任务，甚至可以从任何不同的存在中学习新的、完全不同的知识，而不会忽视一个人最终代表的东西。"
 trait_ancient_race:0 "非凡的神性"
 trait_ancient_race_desc:0 "这个物种是真正神圣的，存在于宇宙范围之外。它们是不朽的，无边无际的。为了确保他们的力量不会摧毁小星系，他们通过一个由静态光力量制成、外观类似于人形的身体进入这个物理基地。尽管他们用来下降到这个星系的身体只代表了他们真实自我的一小部分，但他们仍然很容易成为进入这个星系的最强大的实体之一。"
 trait_ancient_knowledge:0 "奥术智力"
 trait_ancient_knowledge_desc:0 "该物种的成员拥有丰富的智力和记忆力，他们能够清晰地回忆起亿万年前发生的事件。他们的思维过程几乎是瞬时的。他们的智力如此之高，以至于他们能够理解如何正确地互动和理解比他们低得多的维度的物种，并相应地调整自己以维持力量的平衡。"
 trait_master_mind:0 "不屈的意志"
 trait_master_mind_desc:0 "这个物种表现出了不可思议的团结、决心和意志力。据说，在他们的整个记录​​中，这个种族从未遭受过任何内讧，也从未发生过任何种族内战或自相残杀的记录。"
 leader_trait_admiral_ancient_knowledge:0 "大主教"
 leader_trait_admiral_ancient_knowledge_desc:0 "高阶主教致力于星际战争的艺术。他们不仅拥有与其他神灵战斗所必需的知识，而且还拥有与低维生命体战斗的细节，并且不会让对手太过霸道。"
 leader_trait_admiral_bionic_implant:0 "全矩阵角色"
 leader_trait_admiral_bionic_implant_desc:0 "这位大元帅的意识与全矩阵人格面具融合并交织在一起。"
 leader_trait_admiral_master_mind:0 "非凡的意志力"
 leader_trait_admiral_master_mind_desc:0 "这位大主教拥有惊人的意志力，能够引导结界来保护指挥舰队。"
 leader_trait_general_ancient_knowledge:0 "高级无政府主义者"
 leader_trait_general_ancient_knowledge_desc:0 "高阶无政府者致力于天界艺术家，即与其他神明进行直接战斗的艺术。他们还负责管理低维空间中行星战斗的破坏性水平。"
 leader_trait_general_bionic_implant:0 "全矩阵角色"
 leader_trait_general_bionic_implant_desc:0 "这个无政府主义者的意识与全矩阵人格面具融合并交织在一起。"
 leader_trait_general_master_mind:0 "非凡的意志力"
 leader_trait_general_master_mind_desc:0 "这位无政府者拥有惊人的意志力，能够引导强大的护卫来保护指挥军队。"
 leader_trait_governor_ancient_knowledge:0 "高级督军"
 leader_trait_governor_ancient_knowledge_desc:0 "高级督军充当星裔领域内任何领域内各个利益地点之间的协调员。他们的作用是收集所有类型的在场居民的思想，并引导它们达到完美的和谐和同步。"
 leader_trait_governor_bionic_implant:0 "全矩阵角色"
 leader_trait_governor_bionic_implant_desc:0 "这位监督总督的意识与全矩阵人格面具融合并交织在一起。"
 leader_trait_governor_master_mind:0 "非凡的意志力"
 leader_trait_governor_master_mind_desc:0 "这位督军拥有非凡的意志力，能够形成精神联系并将所有人民团结在一起，走向团结和力量。"
 leader_trait_scientist_ancient_knowledge:0 "高级冥想者"
 leader_trait_scientist_ancient_knowledge_desc:0 "高级冥想者肩负着极其痛苦的任务，即理解技术进步和低维度物种科学的本质。他们的责任是始终理解各种机制，虽然这些机制显然很原始，但对于维持锦标赛中的力量平衡很重要。"
 leader_trait_scientist_bionic_implant:0 "全矩阵角色"
 leader_trait_scientist_bionic_implant_desc:0 "该冥想者的意识与全矩阵人格面具融合并交织在一起。"
 leader_trait_scientist_master_mind:0 "非凡的意志力"
 leader_trait_scientist_master_mind_desc:0 "这位调解者拥有惊人的意志力，能够疏通强大的屏障，保护脆弱的科学船，并大幅提升航速。"
 leader_trait_ruler_ancient_knowledge:0 "迪瓦·哈泰"
 leader_trait_ruler_ancient_knowledge_desc:0 "Di'va Ha'tae 是一个非常重要的职位。哈泰负责指挥和指导整个宇宙采取的所有行动方针。哈塔伊人承载着首相之手的意志和星裔的野心。"
 leader_trait_ruler_bionic_implant:0 "全矩阵AI助手"
 leader_trait_ruler_bionic_implant_desc:0 "哈泰人的意识与全矩阵人格面具融合并交织在一起。"
 leader_trait_ruler_master_mind:0 "非凡的意志力"
 leader_trait_ruler_master_mind_desc:0 "哈泰人拥有非凡的意志力，能够利用这种力量团结一致、目标明确地指挥和征服帝国。"
 personality_original_empire_personality:0 "势不可挡的潮流"
 personality_original_empire_personality_desc:0 "一个拥有无限力量的神秘实体，出于我们无法完全理解的目的而托管着力量大会，因此我们都必须参加他们安排的游戏。"
 personality_original_empire_passive_personality:0 "流动的波浪"
 personality_original_empire_passive_personality_desc:0 "对本次比赛的结果感到满意。 星裔渴望看到新冠军在他们的观察下蓬勃发展。"
 personality_original_empire_passive_nochamp_personality:0 "沉默的石头"
 personality_original_empire_passive_nochamp_personality_desc:0 "尽管对锦标赛相当虎头蛇尾的结果感到不满，星裔仍然尊重潜在冠军的愿望，并在宇宙之外的领域静静地守护着银河系。"
 personality_original_empire_passive_mourn_personality:0 "悲风"
 personality_original_empire_passive_mourn_personality_desc:0 "星裔对银河系最有前途的帝国缺乏远见和远见感到悲伤，并花时间反思他们的错误。他们的方法对于银河系来说是否太残酷了？他们对这个星系的理解有缺陷吗？是什么导致了这样一个充满希望的星系的衰落。他们必须追溯到哪个时间线来纠正这个错误？"
 personality_original_empire_ascended_personality:0 "神秘先驱者"
 personality_original_empire_ascended_personality_desc:0 "神秘的先驱者仍然是银河系中强大的活跃力量，他们不可掉以轻心。"
 shipsize_colossus_hull_add:0 "巨像船体增加"
 not_in_crisis:0 "§R只有在银河规模的威胁下才能利用银河防御协议。§!"
 edict_origin_final_armada:0 "§M银河防御协议：§!最终舰队"
 edict_origin_final_armada_desc:0 "由于敌人威胁着整个银河系，而我们的命运也不确定，如果我们想生存下去，就必须准备尽可能多的舰队。"
 edict_origin_mass_production:0 "§M银河防御协议：§!批量生产"
 edict_origin_mass_production_desc:0 "当银河系的命运悬而未决时，我们不惜一切代价。所有产量必须提高到最大。我们面临着前所未有的对手。"
 edict_origin_persuit_of_knowledge:0 "§M银河防御协议：§!知识就是力量"
 edict_origin_persuit_of_knowledge_desc:0 "我们必须找到应对当前危机的任何优势。如果我们想打败我们的敌人，我们就必须尽可能多地了解他们。"
 edict_origin_mod_menu_edict:0 "§E失落帝国菜单的开放罪孽§!"
 edict_origin_mod_menu_edict_desc:0 "此菜单将允许您调整或修复 SOFE 的各个方面。"
 challenger_original:0 "星裔洞察力"
 challenger_original_desc:0 "我们对本次锦标赛中星裔使用的静态光的基本了解使我们能够将各种有用的方面应用到我们自己的技术中。这应该会显著改善竞争环境。"
 pleb_original:0 "平民的诅咒"
 pleb_original_desc:0 "有些东西用可怕的减益诅咒了你，让你成为一个垃圾级的平民。"
 easy_original:0 "使命召唤的模因"
 easy_original_desc:0 "按F表示尊重并赢得战斗。 F F F F F F F F F F F/n/n任务失败。下次我们会得到它们。"
 hard_original:0 "大胆者的恩惠"
 hard_original_desc:0 "群星的黑暗之魂？甚至还没有最终的形式。"
 terrible_original:0 "奇鲁批准"
 terrible_original_desc:0 "巴特曼恩…巴特曼恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩恩"
 tech_psionic_archon:0 "灵能执政官"
 tech_psionic_archon_desc:0 "梯形石似乎有隐藏的功能。基于与古代使用的相同方法，可以通过将基石的力量引导到自愿的容器（无论是有机的还是机械的）来创造灵能神使。结果是一个极其强大的灵能神使，可以主宰地面战场。"
