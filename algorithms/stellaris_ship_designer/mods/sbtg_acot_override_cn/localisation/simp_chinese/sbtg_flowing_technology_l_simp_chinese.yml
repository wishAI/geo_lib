 district_sbtg_omega_progression:0 "倒影之塔"
 district_sbtg_omega_progression_plural:0 "倒影之塔"
 district_sbtg_omega_progression_desc:0 "在无情的浩瀚海洋中，生命繁衍生息，进化也顺其自然。观察过程，了解自然规律。然后想想未来，以及未来的许多潜力。"
 tech_planet_killer_naniter:0 "整体梁"
 tech_planet_killer_naniter_desc:0 "在远古时代，欧米茄创造了各种生命和行星，但总有一天，进化走向了错误的方向，或者出现了不该发生的事情。 Monolith Beam 就是此类问题的解决方案。这种巨大的武器将整个世界转移到一个记忆球中，有效地将行星从银河系中移除。居民将继续在他们的星球上生活，不会构成任何威胁。\n\n从某种角度来看，如果使用不当，这确实是一种可怕的武器。"
