 sofe_ca_damagenerf_lite_desc:0 "呐呐呐？？？"
 ACOT_MASS_DRIVER_SUPER:0 "§Y光之力穿刺器§!"
 ACOT_MASS_DRIVER_SUPER_DESC:0 "§Y集中你的愤怒和热情，将它们化为勇气的碎片，刺穿任何反对圣光内和平与安宁的人。§!"
 ACOT_MASS_DRIVER_SUPER_SMALL:0 "§Y光之力穿刺器§!"
 ACOT_MASS_DRIVER_SUPER_MEDIUM:0 "§Y光之力穿透器§!"
 ACOT_MASS_DRIVER_SUPER_LARGE:0 "§Y光之力粉碎机§!"
 ACOT_ARTILLERY_SUPER:0 "§Y利维坦猎人§!"
 ACOT_ARTILLERY_SUPER_DESC:0 "§Y旧星系面临着许多威胁，为了让它变得更好，守护者们必须保持警惕。为了银河系的进步，抛开仁慈的幻想，结束这些生物的痛苦。§!"
 ACOT_ARTILLERY_SUPER_LARGE:0 "§Y利维坦猎人§!"
 ACOT_ARTILLERY_SUPER_XL:0 "§Y利维坦杀手§!"
 ACOT_LASER_SUPER:0 "§Y光波§!"
 ACOT_LASER_SUPER_DESC:0 "§Y即使是最小的光明也能驱散最大的黑暗。不要让任何事情阻碍救赎！\n\nNi Nato Saun'thos！§!"
 ACOT_LASER_SUPER_SMALL:0 "§Y光波§!"
 ACOT_LASER_SUPER_MEDIUM:0 "§Y扩展光波§!"
 ACOT_LASER_SUPER_LARGE:0 "§Y永恒的光波§!"
 ACOT_LANCE_SUPER:0 "§Y星光破坏者§!"
 ACOT_LANCE_SUPER_DESC:0 "§Y群星齐齐！我们的力量正在崛起！见证我们的提升！让我们的敌人当心，天界守护者的光芒将会闪耀！§!"
 ACOT_FIGHTERS_HANGAR_SUPER:0 "§Y艾娜斯里的骄傲§!"
 ACOT_FIGHTERS_HANGAR_SUPER_DESC:0 "§Y天界守护者必须是所有战斗的大师。无论是陆地、空中、海洋还是太空。 Ta Baeo Ina'sri。用圣骑士攻击机摧毁了西迪厄斯帝国巨人的传奇守护者。§!"
 ACOT_GUNSHIP_HANGAR_SUPER:0 "§Y奈克林的哨兵§!"
 ACOT_GUNSHIP_HANGAR_SUPER_DESC:0 "§YNaekrin，第一个单枪匹马击败整个外来者营的战士，使用特殊的哨兵无人机从远处蒸发外来者，覆盖他的一举一动。敌人没有任何可以利用的机会来从侧翼攻击这位聪明的战士。战斗还没开始就已经结束了。§!"
 ACOT_MISSILE_SUPER:0 "§Y荣耀之刃§!"
 ACOT_MISSILE_SUPER_DESC:0 "§Y与你的武器合而为一。不要将它们视为工具、设备，而是你意志的延伸。将这些物体变成锋利的刀片，斩断一切阻碍你的东西。没有人能站得住脚！§!"
 ACOT_ARMOR_SUPER:0 "§Y光之盾§!"
 ACOT_ARMOR_SUPER_DESC:0 "§Y保护你的思想免受所有诱惑。让他们毫无意义的武器攻击你的船，因为他们没有目的和信念。那些缺乏注意力的人将会在我们的防御面前动摇。§!"
 SMALL_ACOT_ARMOR_SUPER:0 "§Y光之盾§!"
 MEDIUM_ACOT_ARMOR_SUPER:0 "§Y解决光之自我§!"
 LARGE_ACOT_ARMOR_SUPER:0 "§Y持久光之盾§!"
 FLOWING_ACOT_ARMOR:0 "§Y流动的光之盾§!"
 ACOT_LANCE_OMEGA:0 "§Y拉沙塔之怒§!"
 ACOT_LANCE_OMEGA_DESC:0 "§Y远古时代，在三国的佃户被书写之前，是拉沙塔的愤怒力量掌握着帝国的意志。这种统治制度可能已经不复存在，但他们与古人的荣耀和斗争的故事将永垂不朽。§!"
 ACOT_PERDITION_BEAM_OMEGA:0 "§Y苏里亚之光§!"
 ACOT_PERDITION_BEAM_OMEGA_DESC:0 "§Y虽然 Suriya 的温暖已不复存在，但我们尊重它的重要性。因为苏里亚 - 第一颗星星带来了希望。\n\n我们怀着更大的目标继续前进。让我们的敌人小心，因为他们面对的是苏里亚的儿女！§!"
 ACOT_AUTOCANNON_OE_SUPER:0 "§Y谢尔之波§!"
 ACOT_AUTOCANNON_OE_SUPER_DESC:0 "§Y席尔是袭击首都的第一波海啸，连续两小时引发了季风。就像谢尔一样，我们将通过无情和无休止的攻击压倒暗影。§!"
 ACOT_FLAK_CANNON_OE_SUPER:0 "§Y光缚神盾§!"
 ACOT_FLAK_CANNON_OE_SUPER_DESC:0 "§Y每个滋扰都必须经过仔细选择才能无效。我们必须确保只有最弱的攻击才能到达我们的第一道防线。§!"
 ACOT_FLAK_CANNON_OE_SUPER_FLOWING:0 "§Y流动神盾§!"
 ACOT_FLAK_CANNON_OE_SUPER_FLOWING_DESC:0 "§Y每个滋扰都必须经过仔细选择才能无效。我们必须确保只有最弱的攻击才能到达我们的第一道防线。§!"
 ACOT_PD_SUPER:0 "§Y光缚哨兵§!"
 ACOT_PD_SUPER_DESC:0 "§Y巴达姆塔斯§!"
 ACOT_PD_SUPER_FLOWING:0 "§Y流动哨兵§!"
 ACOT_PD_SUPER_FLOWING_DESC:0 "§Y巴达姆塔斯§!"
 ACOT_FLAGSHIP_SUPER_WEAPON:0 "§Y得益于方舟的六个巨大动力塔，神圣干预级审判光束比小型飞船使用的光束更强、更快。§!"
 ACOT_FLAGSHIP_SUPER_WEAPON:0 "§Y得益于方舟的六个巨大动力塔，神圣干预级审判光束比小型飞船使用的光束更强、更快。§!"
 ACOT_ULTIMATE_WEAPON:0 "§Y神圣审判§!"
 ACOT_ULTIMATE_WEAPON_DESC:0 "§Y神圣审判是有史以来最强大的武器库之一，它以流动之光的破坏力投射出星裔的终极表达形式。§!"
 FLOWING_DRIVE_OE:0 "§Y流动移位器§!"
 FLOWING_DRIVE_OE_DESC:0 "§Y流动移位器§!"
 FLOWING_THRUSTER_OE:0 "§Y流动的旅人§!"
 FLOWING_THRUSTER_OE_DESC:0 "§Y流动的旅人§!"
 FLOWING_SENSOR_OE:0 "§Y预感§!"
 FLOWING_SENSOR_OE_DESC:0 "§Y预感§!"
 OE_OFFENSIVE_COMBAT_COMPUTER_FLOWING:0 "§Y大胆的全矩阵角色§!"
 OE_OFFENSIVE_COMBAT_COMPUTER_FLOWING_DESC:0 "§Y大胆的全矩阵角色§!"
 OE_BALANCE_COMBAT_COMPUTER_FLOWING:0 "§Y自适应全矩阵角色§!"
