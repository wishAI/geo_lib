 origin_playable_sb_singular_desc:0 "在伟大的力量大会中取得胜利后，圣光的新生冠军开始以他们曾经熟悉的星系形式重建他们的新领域，从他们新的影响范围中，他们将体验到真正的神性。"
 origin_playable_sb_singular_effects:0 "以星裔和世界球开始游戏。\n获得圣光的访问权限，可用于改变星系。\n"
