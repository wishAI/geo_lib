 origin_playable_sb:0 "星裔：宏伟设计"
 origin_playable_sb_desc:0 "在伟大的力量大会中取得胜利后，圣光的新生冠军开始以他们曾经熟悉的星系形式重建他们的新领域，从他们完美无瑕的新王座上他们将体验到真正的神性。"
 origin_playable_sb_effects:0 "以拥有完美王座的星裔身份开始游戏。\n获得圣光的访问权限，可用于改变银河系。\n"
