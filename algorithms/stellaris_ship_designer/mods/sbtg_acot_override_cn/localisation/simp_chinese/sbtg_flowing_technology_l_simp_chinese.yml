 tech_gatekeepers:0 "守门人原理图"
 tech_gatekeepers_desc:0 "根据倒下的先驱者的记录，守门人最初被设计为守护者。但由于其极其先进的智能，这些飞船由于堕落者缺乏成长和进步而反抗了自己的创造者。\n\n我们目前的设计似乎与最初的描述相比严重淡化。一个可能的理论是，原始设计一定要强大得多。\n\n尽管如此，这是一艘极其强大的主力舰设计，不容忽视。"
 tech_gatekeepers_alpha:0 "守门人阿尔法"
 tech_gatekeepers_alpha_desc:0 "阿尔法反应堆提供了足够的动力，现在应该可以对守门人设计进行一些调整，并使飞船更接近其最初的状态。"
 TECH_UNLOCK_ALPHA_GATEKEEPER_TITLE:0 "§H解锁飞船部分：§! 守门人 Alpha"
 TECH_UNLOCK_ALPHA_GATEKEEPER_DESC:0 "§YAlpha 部分：§! $tech_gatekeepers_alpha_desc$"
 tech_gatekeepers_sigma:0 "守门人西格玛"
 tech_gatekeepers_sigma_desc:0 "根据预计的计算，西格玛守门人模板现在应该与这艘巨大船只的原始设计非常相似，具有破坏性的进攻和防御能力。"
 TECH_UNLOCK_SIGMA_GATEKEEPER_TITLE:0 "§H解锁飞船部分：§! 守门人 Sigma"
 TECH_UNLOCK_SIGMA_GATEKEEPER_DESC:0 "§Y西格玛部分：§! $tech_gatekeepers_sigma_desc$"
 tech_gatekeepers_master:0 "大师工艺守门人"
 tech_gatekeepers_master_desc:0 "结合两种不同设计的优势，我们能够创造出完美的 Mastercraft 守门人。嗯，这看起来很奇怪？我们什么时候获得这些蓝图的？什么..."
 TECH_UNLOCK_MASTER_GATEKEEPER_TITLE:0 "§H解锁船舶部分：§! 大师工艺守门人"
 TECH_UNLOCK_MASTER_GATEKEEPER_DESC:0 "§Y大师工艺部分：§! $tech_gatekeepers_master_desc$"
 tech_omega_gatekeeper:0 "守门人欧米茄"
 tech_omega_gatekeeper_desc:0 "这就是……臭名昭著的远古守门人的真实设计。 失落帝国甚至能够对这个奇迹进行逆向工程，这真是一个奇迹。"
