 sofe_mem_planet_shield_partial:0 "暗能量封印"
 sofe_outergate_weaken_shield:0 "削弱护盾"
 sofe_outergate_weaken_shield_desc:0 "看来这些§Y外星门§!的护盾正在减弱，我们现在应该能够更多地了解大门本身。]\n\n我们已经确定了至少一个位置，其中外星门位于，但应该有更多分散在整个星系中。"
 OUTER_GATE_FIRST_ANALYSIS_TITLE:0 "外星门基本分析"
 OUTER_GATE_FIRST_ANALYSIS_TITLE_DESC:0 "在我们开始任何其他操作之前，首先我们需要扫描并分析保护外星门的护盾的性质。"
 sofe_outergate_steal_fallen_world:0 "砸抢"
 sofe_outergate_steal_fallen_world_desc:0 "失落帝国很可能拥有这些基石。如果我们有能力，我们可以简单地向他们索要基石..§R血与火§!"
 sofe_outergate_fabricate_keystone:0 "重塑"
 sofe_outergate_fabricate_keystone_desc:0 "只要我们拥有正确的技术和知识，我们就可以简单地创建自己的基石。我们需要了解暗物质电力究竟是如何工作的，更重要的是，使用什么样的材料或合金来构建基石。"
 sofe_outergate_use_smuggler:0 "微交易"
 sofe_outergate_use_smuggler_desc:0 "有一个走私犯以能够从任何人或任何地方窃取任何东西而闻名。只要价格合适。如果这些故事是真的，也许我们可以请求他的服务？"
 sofe_outergate_use_curator:0 "策展人服务"
 sofe_outergate_use_curator_desc:0 "只要我们仍然与策展人保持良好的关系，他们肯定有能力在这方面帮助我们。"
 OUTER_GATE_SMUGGLER_STEAL:0 "微交易"
 OUTER_GATE_SMUGGLER_STEAL_DESC:0 "有一个走私犯以能够从任何人或任何地方窃取任何东西而闻名。只要价格合适。如果这些故事是真的，也许我们可以请求他的服务？"
 sofe_cb_keystone_claim:0 "鼎石收购"
 sofe_cb_keystone_claim_desc:0 "基石将是我们的，如果需要的话我们会用武力夺取它。"
 casus_belli_sofe_cb_keystone_claim:0 "鼎石收购"
 casus_belli_cb_oe_punishment:0 "战斗试炼"
 casus_belli_cb_oe_claim:0 "填海"
 casus_belli_cb_oe_annihilate:0 "执行"
 sofe_wg_oe_humiliation:0 "战斗试炼"
 sofe_wg_oe_humiliation_desc:0 "这是对实力的考验。为帝国的荣耀而战！"
 sofe_wg_conquest:0 "填海"
 sofe_wg_conquest_desc:0 "这些系统因征服而属于我们。如果你认为可以的话，就反抗吧。"
 sofe_wg_annihilate:0 "执行"
 sofe_wg_annihilate_desc:0 "因为你没有能力做好事。我们已经判你死刑了。如果您还有什么遗言的话，大人……现在是时候了。"
 war_goal_sofe_wg_oe_humiliation:0 "战斗试炼"
 war_goal_sofe_wg_oe_humiliation_desc:0 "宣战是为了考验双方的实力。而已。只是乐趣和游戏。"
 war_goal_sofe_wg_conquest:0 "填海"
 war_goal_sofe_wg_conquest_desc:0 "宣战是为了收回选定的系统以更好地利用。"
 war_goal_sofe_wg_annihilate:0 "执行"
 war_goal_sofe_wg_annihilate_desc:0 "宣战是因为目标已被判处死刑。目前正在执行死刑。"
 sofe_wg_steal_keystone:0 "鼎石收购"
 sofe_wg_steal_keystone_desc:0 "拱心石在我们手中将会有更好的用途，而堕落者也会遵从我们的要求。"
 war_goal_sofe_wg_steal_keystone:0 "鼎石收购"
 war_goal_sofe_wg_steal_keystone_desc:0 "为了获取基石而宣战，根据征服权和群星的权利，基石应该属于我们。"
 OUTER_GATE_FABRICATE_SEAL:0 "制作梯形基石"
 OUTER_GATE_FABRICATE_SEAL_DESC:0 "我们现在可以制造新的基石，技术已经有了。"
 wg_steal_keystone_accept:0 "§Y[From.GetName]§!被击败，减少了他们的影响力增益（即使他们似乎从未将他们的影响力用于任何事情），他们的人口将在§Y10§!年内成为整个银河系的笑柄。他们还必须将其 §EKeystone§! 放弃给 §Y[Root.GetName]§!\n$wg_revoke_claims_accept$"
 OUTER_GATE_SECOND_SEAL:0 "打破第二封印"
 OUTER_GATE_SECOND_SEAL_DESC:0 "当我们将 Keystone 基座移近外星门时，它开始按预期做出反应。我们必须保持连接直到充满电。"
 OUTER_GATE_THIRD_SEAL:0 "打破第三封印"
 OUTER_GATE_THIRD_SEAL_DESC:0 "就像第二印一样，我们需要将梯形石调整到与门相对应的位置。我们必须保持连接直到充满电。"
 OUTER_GATE_FINAL_SEAL:0 "打破最终封印"
 OUTER_GATE_FINAL_SEAL_DESC:0 "只剩下最后一个封印……然而，有一些不祥的事情发生了。我们中的一些人对此有不好的预感。"
 pc_golden_world:0 "恒星世界球"
 pc_golden_world_desc:0 "这是一个玷污了所有已知科学的创造奇迹。一个容纳多个天体的巨大建筑。\n\n目前无法以任何方式访问它，除非进行足够的轰炸以打动星裔。"
 pc_golden_fortress:0 "恒星排列"
 pc_golden_fortress_desc:0 "这座特殊的堡垒是专门为锦标赛的最后阶段而设计的。 星裔已采取预防措施，以确保在该星系无法支持整个光之堡垒的真实光辉的情况下，该联盟将被用作低维度生命形式证明其优势的一种方式。\n\n这将确保您的游戏不会在保存时崩溃。希望如此。希望如此。"
 pc_golden_world_habitable:0 "恒星世界球"
 pc_golden_world_habitable_desc:0 "这是一个玷污了所有已知科学的创造奇迹。容纳多个天体的巨大建筑。"
 pc_goodman_gaia_world:0 "非凡的盖亚世界"
 pc_goodman_gaia_world_desc:0 "盖亚世界的完美版本。大气层中充满了光能，轰击起来十分困难。"
 pc_omega_ringworld_habitable:0 "非凡的环形世界"
 pc_omega_ringworld_habitable_desc:0 "非凡的环形世界充当星裔伟大人造系统的可居住部分。"
 pc_omega_ringworld_seam:0 "非凡的核心世界"
 pc_omega_ringworld_seam_desc:0 "现象核心将环形世界部分连接在一起，同时还容纳两个盖亚世界并提供类似于正常世界的生活空间。"
 pc_omega_ringworld_tech:0 "非凡的锚固环"
 pc_omega_ringworld_tech_desc:0 "非凡的锚地环充当大型造船厂锚地，数百万艘船只停泊在其中。"
 sbtg_omega_dyson_sphere:0 "无限宝珠"
 sbtg_omega_dyson_sphere_DESC:0 "冰冷黑暗的虚空之中，没有光明，没有星辰，没有避风港。只有一件事要做，那就是我们自己做一件事。 圣光总会找到办法的。"
 sbtg_omega_dyson_sphere_MEGASTRUCTURE_DETAILS:0 "伊瑞特·纳泰！"
 sbtg_omega_spy_orb_center:0 "勇气棱镜"
 sbtg_omega_spy_orb_center_DESC:0 "为了适应冠军舰队的预期增长而进行的特殊调整。棱镜不仅提供整个银河系的全面情报覆盖，还大大增强了我们帝国的舰队和海军能力。"
 sbtg_omega_spy_orb_center_MEGASTRUCTURE_DETAILS:0 "Emp Pa'raheh Ba'rah Kah"
 sbtg_omega_nexus:0 "非凡的联系"
 sbtg_omega_nexus_DESC:0 "这个庞大的数据档案包含了银河系在各个多元宇宙中存在的知识。通过它，冠军将能够研究他们在许多交替存在中发生的各种情况。"
 sbtg_omega_nexus_MEGASTRUCTURE_DETAILS:0 "科加凯！"
 sofe_psionic_dark_archon:0 "灵能执政官"
 sofe_psionic_dark_archon_desc:0 "一种由纯粹的负面情绪召唤而成的灵能存在，只能产生破坏性的想法。这种不自然的形态是通过将生命注入我们获得的黑暗神器中而创造出来的。"
 sofe_omega_mech:0 "猎人哨兵战士"
 sofe_omega_mech_desc:0 "致力于冠军事业的 18 级智力人造战士，进而延伸到欧米茄。"
 tech_omega_warmech:0 "猎人哨兵战士"
 tech_omega_warmech_desc:0 "星裔雇佣猎人哨兵作为他们的主要战斗单位和助手。他们的外表和智力与星裔本身相似，尽管具有不同的盔甲和战斗服。 星裔已授权我们将他们视为我们自己的人参加战斗。"
 sofe_golden_world.poi:0 "活跃恒星世界球"
 sofe_golden_world.poi_desc:0 "星裔正在用这些庞大的世界球来增援他们的大部分舰队。必须阻止它们。\n\n然而，这些球体不受所有攻击的影响，只有通过表面轰击才能给星裔留下足够的印象，从而使它们失效。"
 tech_celestial_guardian:0 "守护者骑士团"
 tech_celestial_guardian_desc:0 "天界守护者是格斗专家，他们接受过地面战斗的专门训练。"
 SOFE_LARGE_AVATAR_WEAPON:0 "监管者的命令"
 SOFE_LARGE_AVATAR_WEAPON_DESC:0 "这些容器内的黑暗之心充满了折磨和绝望，他们将与敌人分享这一点。"
 SOFE_XL_AVATAR_WEAPON:0 "审判者的凝视"
 SOFE_XL_AVATAR_WEAPON_DESC:0 "这些容器内的黑暗之心充满了折磨和绝望，他们将与敌人分享这一点。"
 SOFE_POINT_DEFENSE_AVATAR:0 "脚本筛选器"
 SOFE_POINT_DEFENSE_AVATAR_DESC:0 "恐惧是一种幻觉，但可以变成现实。即使是最有天赋的飞行员也无法逃避他的船有一天可能会坠毁的形象和现实。"
 SOFE_PARTICLE_LANCE_AVATAR:0 "立法梁"
 SOFE_PARTICLE_LANCE_AVATAR_DESC:0 "心灵被腐蚀。身体断裂。在这个黑暗的宇宙中，只有痛苦和磨难才是所有生命不可否认的真理。"
 SOFE_PERDITION_BEAM_AVATAR:0 "最终判决"
 SOFE_PERDITION_BEAM_AVATAR_DESC:0 "只要瞥见她的目光，哪怕是最强大的钢铁和合金，也足以将其变成毫无物质的垃圾。七大契约将强制执行于一切众生。"
 BATTLESHIP_SHIP_THRUSTER_AVATAR:0 "目的滴注器"
 BATTLESHIP_SHIP_THRUSTER_AVATAR_DESC:0 "它移动并不是因为它想要。事实证明并不是因为它愿意。最终，它的主人的意志决定了它接下来会在哪里犯更多的罪。"
 AVATAR_SENSOR_SHIP:0 "维吉兰特·艾里斯"
 AVATAR_SENSOR_SHIP_DESC:0 "眼睛里有你。你认为你可以逃避，但没有人能逃避阴影。你的一切尝试都在女神的眼中。"
 LARGE_DARK_MATTER_REACTOR_AVATAR:0 "戒律执行者"
 LARGE_DARK_MATTER_REACTOR_AVATAR_DESC:0 "银河系的动荡和悲伤。人民的痛苦和恐惧。这些是将幻想变成现实的燃料。"
 HUGE_DARK_MATTER_REACTOR_AVATAR:0 "戒律执行者"
 HUGE_DARK_MATTER_REACTOR_AVATAR_DESC:0 "银河系的动荡和悲伤。人民的痛苦和恐惧。这些是将幻想变成现实的燃料。"
 SOFE_ENIGMATIC_SHIELD_AVATAR:0 "纪律任务"
 SMALL_SOFE_ENIGMATIC_SHIELD_AVATAR:0 "纪律任务"
 SMALL_SOFE_ENIGMATIC_SHIELD_AVATAR_DESC:0 "能量...需要能量...必须消耗...必须...供给。"
 MEDIUM_SOFE_ENIGMATIC_SHIELD_AVATAR:0 "纪律任务"
