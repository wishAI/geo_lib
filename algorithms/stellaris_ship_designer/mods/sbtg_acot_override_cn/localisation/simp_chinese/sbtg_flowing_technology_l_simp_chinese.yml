 OE_STARBASE_DEFENSIVE_COMBAT_COMPUTER_FLOWING_DESC:0 "§Y观察性全矩阵角色§!"
 FLOWING_REACTOR_OE:0 "§Y拉基流光§!"
 FLOWING_REACTOR_OE_DESC:0 "§YRa'ki Flowing Light，本质上称为银河级流光，是在银河范围内使用的流光的加权和抑制形式。这是为了确保以这种方式使用的任何力量都不会摧毁银河系。此功率调整用于各种星系级流动光组件。§!"
 tech_ultimate_weapon:0 "§Y拉基 - 第一形态§!"
 tech_ultimate_weapon_desc:0 "§YRa'ki Flowing Light，本质上称为银河级流光，是在银河范围内使用的流光的加权和抑制形式。这是为了确保以这种方式使用的任何力量都不会摧毁银河系。此功率调整用于各种星系级流动光组件。§!"
 policy_sofe_oe_power_level:0 "功率等级"
 policy_sofe_oe_power_level_desc:0 "为了维持这个脆弱而不稳定的小星系的平衡和秩序，我们的舰队必须进行适当的调整，以免它们无意中破坏太空的结构"
 sofe_power_max:0 "最大功率"
 sofe_power_max_desc:0 "如果我们要展示我们无限力量的真正威力，我们就必须不惜一切代价，不惜一切代价，后果不堪设想。"
 sofe_power_75:0 "75% 电量"
 sofe_power_75_desc:0 "我们的意图必须清晰地表达出来，但我们的控制也必须如此。总有一天，对这个星系来说，向敌人扔一颗星星可能有点太过分了。"
 sofe_power_50:0 "50% 电量"
 sofe_power_50_desc:0 "我们的同情心必须闪耀，我们需要向银河系展示我们是一股善良的力量。我们的权力旨在带来秩序和正义，而不是混乱和破坏。"
 sofe_power_25:0 "25% 电量"
 sofe_power_25_desc:0 "这个小星系的希望渺茫，我们最好先转移注意力，鼓励他们先好起来，因为任何针对我们的直接军事对抗只会导致一面倒的结果。或者银河系无法处理溢出的异常现象。"
 policy_sofe_oe_plot_level:0 "耐久性等级"
 policy_sofe_oe_plot_level_desc:0 "我们的舰队非常灵活，可以根据情况调整强度。银河系是一个奇怪而奇特的地方，它有时几乎无法容纳我们可怕的力量，如果我们不小心谨慎，我们的飞船可能会因为溢出的力量而被召回圣光。"
 sofe_plot_max:0 "最大耐用性"
 sofe_plot_max_desc:0 "我们的思想是我们的盾牌，我们的意志是我们的剑。当敌人逼近时，我们将全力以赴。"
 sofe_plot_75:0 "75% 耐久性"
 sofe_plot_75_desc:0 "我们将坚决抵制一切攻击，但我们也将保留并维持对我们防御的一定程度的控制。"
 sofe_plot_50:0 "50% 耐久度"
 sofe_plot_50_desc:0 "在没有明显威胁的情况下，我们必须集中精力维持将这一脆弱现实结合在一起的平衡。"
 sofe_plot_25:0 "25% 耐久性"
 sofe_plot_25_desc:0 "这个小星系真是麻烦啊。看来，如果我们要建立持久的和平，就必须降低我们的大部分维度力量。也许我们应该删除这个星系并重新开始？"
 policy_sofe_oe_research_level:0 "进阶级别"
 policy_sofe_oe_research_level_desc:0 "即使我们的思维远远跨越了无边无际的虚拟宇宙，我们仍然可以在理解现代技术制造过程中的小细节中获得乐趣和洞察力。然而，他们可能并不总是具有洞察力。长时间的接触可能会导致我们的思想家无法理解这些平凡装置的毫无意义和徒劳。"
 sofe_research_max:0 "最大进步"
 sofe_research_max_desc:0 "这个小星系可以提供很多知识，有很多值得思考的地方。"
 sofe_research_50:0 "控制进展"
 sofe_research_50_desc:0 "有时，银河系可能会用一些有趣的知识让我们感到惊讶，但更多时候，他们只是真的很喜欢重复这些技术，直到除了一遍又一遍地改进他们的能量武器 5% 之外别无他法。"
 sofe_research_no:0 "抑制进展"
 sofe_research_no_desc:0 "没有了！如果我们试图理解这个星系是如何在如此荒谬和可笑可悲的技术水平下生存下来的，我们思想家的心智能力实际上可能会下降。我们需要休息一下来思考这个问题。"
 policy_sofe_oe_range_level:0 "武器射程等级"
 policy_sofe_oe_range_level_desc:0 "参与系统规模的战斗需要进行一些调整才能适应大多数现代银河舰队所使用的条件。毕竟，我们攻击来自其他宇宙的敌人是不礼貌的。"
 sofe_range_max:0 "最大范围"
 sofe_range_max_desc:0 "将我们的武器调整到适合其类型的最大射程。虽然这是最佳和平衡的，但有些武器最终确实有太大的射程，实际上会导致奇怪的异常现象，使舰队交战突然变得不可能。如果是这种情况，请考虑降低我们的标准。"
 sofe_range_75:0 "75%范围"
 sofe_range_75_desc:0 "轻微的调整应该纠正任何潜在的错误，以确保仪式和气候太空战斗具有最大的爆炸和粒子效果。"
 sofe_range_50:0 "50%范围"
 sofe_range_50_desc:0 "也许我们应该直接用我们的船只撞向我们的对手？毕竟，我们收到的报告说，某位紫发上将已经尝试过一次，并且在遥远的星系中效果很好。"
