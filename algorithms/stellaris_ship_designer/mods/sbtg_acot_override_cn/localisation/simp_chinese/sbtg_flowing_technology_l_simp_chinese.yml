 ACOT_PLANET_KILLER_NANITE:0 "整体梁"
 ACOT_PLANET_KILLER_NANITE_DESC:0 "星裔的一种古老武器，用于将行星存储到记忆球中。这将使该行星及其居民能够继续生活，同时将该行星完全从银河系中移除。一件可怕的武器落入坏人手中。"
