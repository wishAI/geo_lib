 gov_ancient_ascendency_ascended:0 "星裔冠军"
 gov_ancient_ascendency_ascended_desc:0 "星裔声称是超越时间和空间概念、超越多元宇宙而存在的实体。他们的力量范围是任何凡人手段都无法衡量的。"
 protectorate_of_original:0 "佩纳罗之印"
 protectorate_of_original_desc:0 "我们被认为是 Pena'roh，这是由星裔赋予的免疫力标志。只要这个标记处于活动状态，双方就无法互相攻击。此外，只要该标记处于活动状态，星裔将继续提高我们帝国的资源产量。"
 banished_of_original:0 "佩纳罗之印"
 banished_of_original_desc:0 "我们被认为是 Pena'roh，这是由星裔赋予的免疫力标志。只要这个标记处于活动状态，双方就无法互相攻击。此外，只要该标记处于活动状态，星裔将继续提高我们帝国的资源产量。"
 SUBJECT_origin_protectorate:0 "星裔佩纳罗"
 SUBJECT_DESC_origin_protectorate:0 "被赋予 Pena'roh 印记的帝国免疫星裔采取的进攻行动。然而，他们也不得因此对星裔进行任何攻击行为。某种互不侵犯条约。"
 SUBJECT_origin_banished_ascendancy:0 "星裔佩纳罗"
 SUBJECT_DESC_origin_banished_ascendancy:0 "被赋予 Pena'roh 印记的帝国免疫星裔采取的进攻行动。然而，他们也不得因此对星裔进行任何攻击行为。某种互不侵犯条约。"
 opinion_new_orginal_empire:0 "旭日东升"
 opinion_new_orginal_empire_desc:0 "通过研究和掌握光能的基本力量，我们在星裔的祝福下获得了对静态光方面的控制。我们本质上是他们事业的捍卫者。鉴于比赛期间所展示的力量，其他帝国必须小心，以免激怒我们。他们现在都在我们的怜悯之中。"
 PROJECT_ALL_ORIGIN_TECH:0 "最后一课：伟大的问题"
 PROJECT_ALL_ORIGIN_TECH_DESC:0 "我们将接受星裔的礼物，崛起成为他们在这个星系中选择的冠军。我们将完成我们的使命并加入第二光之秩序。为了欧米茄！为了[root.GetName]！"
 PROJECT_LIGHT_MATTER:0 "第 1 课：圣光"
 PROJECT_LIGHT_MATTER_DESC:0 "星裔让我们能够研究和练习静态光的操纵。第一课是在这个星系的理解和范围的概念范围内研究力量如何运作的本质。完善它需要相当长的时间，但我们相信我们很快就能更清楚地理解事情。"
 PROJECT_OFFENSE_ORIGIN_TECH:0 "第 2 课：水之道"
 PROJECT_OFFENSE_ORIGIN_TECH_DESC:0 "下一课是了解圣光如何“流动”。虽然静态光只是超越无限的力量的淡化版本，但其概念是相似的。在这种情况下，术语“水”。并不反映我们对水的理解，而是指在苏里亚（欧米茄曾经主持的领域）中发现的抽象波浪的本质。这个领域是由无尽的天空和横跨整个逃生地的无深海洋组成。雄伟的海洋与强大的能量产生共鸣，持续不断、无情的波浪席卷各个方向。这些波浪将席卷并摧毁任何无法适应其无情本质的东西。\n\n只要有足够的理解和练习，静态光就可以根据与这些致命波浪相同的概念被塑造成强大的武器。学习的不是如何用微不足道、无效的水花进行攻击，而是要专注于无情的海啸和台风，即使是最坚固的障碍也会被扫倒。\n\n与波浪合而为一，成为无法平息的风暴；不可阻挡的力量。释放你的愤怒，从你燃烧的心中醒来。"
 PROJECT_OFFENSE_ORIGIN_TECH_EXPLAIN:0 "这将解锁具有大插槽或更高插槽的各种武器组件，以及与武器相关的辅助。"
 PROJECT_DEFENSE_ORIGIN_TECH:0 "第三课：石之道"
 PROJECT_DEFENSE_ORIGIN_TECH_DESC:0 "下一课是了解圣光如何“维护”。虽然静态光只是超越无限的力量的淡化版本，但其概念是相似的。石之道，指的是苏里亚领域内的各种自然和人工建筑如何对无情的海啸做出反应和抵抗的本质。这些活生生的方尖碑能够感知到接近的水流的危险，并下意识地做出反应，创造出完美的反波，将波浪送上天空。事实上，对于未经训练的人来说，苏里亚是一个陌生而危险的地方，因为海浪会从各个方向、各个角度涌来。为了生存，人们必须磨练自己的思想和技能，开发能够抵御任何攻击的技术。对于那些简单地否认其存在的人来说，这种攻击是无效的。 Suriya中的任何生物体，它们的创造者Omega，都掌握了这些技术。\n\n经过足够的训练，我们还可以学会唤醒我们的潜意识，并通过否认其原因和影响来抵御任何攻击；不可移动的物体。决心、决心、意识。将这些掌握为本能，一切攻击都会无效。"
 PROJECT_DEFENSE_ORIGIN_TECH_EXPLAIN:0 "这将解锁具有中等或以下插槽的各种武器组件，包括点防御和战斗机。还将解锁盾牌、盔甲和相关辅助。"
 PROJECT_UTILITY_ORIGIN_TECH:0 "第四课：风之道"
 PROJECT_UTILITY_ORIGIN_TECH_DESC:0 "下一课是了解圣光如何“扩展”。虽然静态光只是超越无限的力量的淡化版本，但其概念是相似的。那些走在中间道路上的人，在无情的力量浪潮和无畏的苏里亚方尖碑之间，必须能够变得像风一样。扫去水，移石。不要让任何障碍阻碍你的道路。使用风作为载具，在整个旅程中载着你。\n\n一旦掌握，我们将能够引导静态光来响应我们的命令，越来越远地进入星星。懂得如何站在中间，看穿时间和空间的倒影。"
 PROJECT_UTILITY_ORIGIN_TECH_EXPLAIN:0 "这将解锁各种实用组件，例如推进器、驱动器、传感器和战斗计算机。这也将解锁任何缺失的先驱者设计。"
 ORIGINAL_ARKSHIP_REBUILD:0 "第 5 课：光的创造"
 ORIGINAL_ARKSHIP_REBUILD_DESC:0 "接下来，为了真正保卫我们自己，前辈星裔指示我们回忆起与伟大方舟的战斗，集中我们的思想，将其形象重新塑造成现实，以便我们也可以利用它。"
 trait_sofe_champion:0 "光辉灿烂"
 trait_sofe_champion_desc:0 "这个种族是神圣的，被欧米茄的圣光授予了对宇宙的巨大力量。不朽、纯净、无尽。 圣光从他们的神圣存在中发出明亮的光芒。"
 trait_pc_all_preference:0 "普遍适应性"
 trait_pc_all_preference_desc:0 "这个物种能够适应任何星球的恶劣环境。据说，如果它们相信自己已经准备好了，它们甚至可以在恒星或黑洞中生存。"
