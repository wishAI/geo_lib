l_simp_chinese:
 return_to_menu:0 "返回主选项"
 sofe_options_title:0 "门外之秘选项"
 sofe_options_desc:0 "在这里调整《门外之秘》的各项设置。"
 sofe_options.1.a:0 "强制触发中期外星门事件"
 sofe_options.1.a.tooltip:0 "立即触发中期外星门事件：所有守门人将转为敌对，外星门事件链也将开放。"
 sofe_options.1.b.normal:0 "强制触发最终封印事件"
 sofe_options.1.b.normal.tooltip:0 "强制播放最终封印事件，并开始危机的最终倒计时。"
 sofe_options.1.b:0 "立即触发危机"
 sofe_options.1.b.tooltip:0 "立即开始SBTG危机。"
 sofe_options.1.c1:0 "§E启用§!AI研究外星门"
 sofe_options.1.c1.tooltip:0 "允许AI推进外星门事件。"
 sofe_options.1.c2:0 "§R禁用§!AI研究外星门"
 sofe_options.1.c2.tooltip:0 "禁止AI推进外星门事件。此项检查只在初始阶段、第一道封印解除前生效。"
 sofe_options.1.d1:0 "§G允许§!原初帝国使用§R灭绝令§!"
 sofe_options.1.d1.tooltip:0 "允许原初帝国以§R灭绝令§!代替惩戒，从而大幅提高其摧毁行星的速度。"
 sofe_options.1.d2:0 "§R禁止§!原初帝国使用§R灭绝令§!"
 sofe_options.1.d2.tooltip:0 "禁止原初帝国使用§R灭绝令§!。他们会改用惩戒，摧毁行星的速度将显著降低。"
 sofe_options.1.e1:0 "§G启用§!星裔危机事件"
 sofe_options.1.e1.tooltip:0 "击退足够多的星裔舰船后，可以获得圣光能量研究。禁用该项会显著增加对抗危机的难度。"
 sofe_options.1.e2:0 "§R禁用§!星裔危机事件"
 sofe_options.1.e2.tooltip:0 "击退足够多的星裔舰船后也不会获得圣光能量研究。启用该项可让你更公平地对抗危机。"
 sofe_options.outergate_launch:0 "开始外星门研究事件"
 sofe_options.outergate_launch.tooltip:0 "开始外星门研究事件。如果你的帝国在事件途中转变为飞升帝国，导致常规事件未能触发，可使用此选项。"
 sofe_options.1.f:0 "调整SOFE危机难度"
 sofe_options.1.f.tooltip:0 "调整星裔危机的强度。"
 sofe_options.104.name:0 "SOFE难度设置"
 sofe_options.104.a:0 "难度：§W标准§!"
 sofe_options.104.b:0 "难度：§Y平民§!"
 sofe_options.104.c:0 "难度：§G简单§!"
 sofe_options.104.d:0 "难度：§P困难§!"
 sofe_options.104.e:0 "难度：§R求死§!"
 sofe_options.104.a.desc:0 "当前难度：§W标准§!\n\n星裔采用默认属性，不获得额外修正。100%标准强度。"
 sofe_options.104.b.desc:0 "当前难度：§Y平民§!\n\n星裔不过是腐朽无能的旧日遗物，普通帝国也大概能战胜他们。\n他们将受到：\n\n§Y-50%§!对其他目标造成的伤害\n§Y-50%§!船体值\n§Y-50%§!陆军生命值与伤害"
 sofe_options.104.c.desc:0 "当前难度：§G简单§!\n\n星裔已经衰老。他们的科技或许曾是奇迹，但漫长流亡令其日渐虚弱。\n他们将受到：\n\n§Y-25%§!对其他目标造成的伤害\n§Y-25%§!船体值"
 sofe_options.104.d.desc:0 "当前难度：§P困难§!\n\n星裔强大且毫不留情，其舰队令人望而生畏。\n\n危机会部署规模更大、技术更先进的舰队，舰船实力也会获得显著强化。"
 sofe_options.104.e.desc:0 "当前难度：§R求死§!\n\n星裔是来找乐子的。准备迎接永恒的玉米片吧。\n\n大多数舰队将替换为荣誉卫队型号，对所有目标造成荒谬的高额伤害，平民帝国也会很快向其投降。"
