 FLAG_CATEGORY_sbtg:0 "星裔"
 COUNTRY_ORIGINAL_EMPIRE:0 "星裔"
 COUNTRY_ORIGINAL_EMPIRE_DESC:0 "圣光的冠军"
 OUTER_GATE_COUNTRY_CANNOT_USE:0 "§R大门仍处于密封状态，此时我们无法使用外星门。§!"
