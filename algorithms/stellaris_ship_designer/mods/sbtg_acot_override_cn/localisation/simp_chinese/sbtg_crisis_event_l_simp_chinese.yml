 pc_invisible_star_desc:0 "隐形星是人们看不到的。"
 NAME_SOFE_LIGHT:0 "圣光"
 mod_damage_vs_country_type_sbtg_stellarborne_empire_mult:0 "对星裔的伤害"
 origin_crisis_chain:0 "力量大会"
 origin_crisis_chain_title:0 "力量大会"
 origin_crisis_chain_desc:0 "星裔期待冠军！但上涨能满足他们的期望吗？"
 nanited_worlds:0 "星裔夺回的世界"
 active_original_worlds:0 "活动世界球"
 origin_kills_us:0 "星裔我们退役的船舶"
 origin_kills_others:0 "星裔其他船舶退役"
 origin_victims:0 "被星裔抛出的船只"
 sofe_crisis.210.name:0 "[From.GetName] 已删除"
 sofe_crisis.210.desc:0 "来自 [From.From.GetName] 的天体光束逐渐消失，[From.GetName] 被成功擦除，将其从这个星系中移除。\n\n有些人可能会称这种行为极端且无情。但那些理解圣光的人会发现，这是比实际破坏更好的命运。 圣光给出，也获取。可能星裔帐户中的所有余额。"
 sofe_crisis.210.desc.alt:0 "[From.From.GetName] 发出的可怕光束逐渐消退，[From.GetName] 一片寂静。\n\n下面会发生什么，人们可能永远不知道。"
 sofe_crisis.210.a:0 "为了他们自己的利益，他们必须这样做。"
 sofe_crisis.210.b:0 "星裔将决定他们的命运。"
 sofe_crisis.2.name:0 "星裔删除了 [Root.GetName]"
 sofe_crisis.2.desc:0 "§H星裔§!的舰队已完成对§H[Root.GetName]§!的操作。舰队使用未知的方法将整个殖民地从地球上移走。根据记录，他们似乎被传送到了某个地方。这颗行星被改造得非常完美，但殖民地实际上已经消失了。"
 sofe_crisis.2.a:0 "但那些人去了哪里呢？"
 sofe_crisis.10.name:0 "力量压倒性的。"
 sofe_crisis.10.desc:0 "严重警报！庞大的舰队正在银河系的外星门中涌现。我们守卫他们的车站神秘地消失了，取而代之的是入侵者自己的巨大的类似车站的建筑。报告表明，所有其他外星门也已被解封，并发现了类似的舰队。\n\n入侵者的舰队与堕落者先驱者的设计有着惊人的相似之处，但明显更大、更先进，具有明显的白色图案。"
 sofe_crisis.10.a:0 "提醒所有命令！红色警报！"
 sofe_crisis.10.playoe.desc:0 "因此，我们再次将星裔的力量称为这个星系。按照通常的程序，他们已经接管了所有外星门和所有守卫他们的车站。鉴于我们过去已经证明了自己，这次赛事的重现对于我们再次超越来说应该是微不足道的。"
 sofe_crisis.10.a.playoe:0 "圣光会给我们力量。"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
 sofe_xenophobe_ruler_name:0 "克罗巴什雷克"
 sofe_spiritualist_ruler_name:0 "索布拉克"
 sofe_materialist_ruler_name:0 "塔达兰"
 sofe_xenophile_ruler_name:0 "哈夫特赛斯"
 sofe_xenophobe_ruler_name:0 "克罗巴什雷克"
 sofe_spiritualist_ruler_name:0 "索布拉克"
 sofe_materialist_ruler_name:0 "塔达兰"
 origin_diplo_header_2:0 "星裔"
 sofe_crisis.15.1.desc:0 "瓦迪。这个星系的居民们，请高度重视，一场伟大的锦标赛即将开始。\n\n我们是星裔，从圣光中选出，是Omega。\n\n巨大的威胁迫在眉睫，很快就会威胁到这个虚拟宇宙中的所有生命。因此，必须举行一场竞赛来确定新的冠军，他们将作为光之教团每个星系的代表。每个帝国都会参加，或者退位，然后作为旁观者加入。请做出您的选择。"
 sofe_crisis.15.1.desc.fallen:0 "正如所预言的，我们将为这个领域带来和谐。我们非常不高兴的是，这个星系的失落帝国与我们战胜的星系没有什么不同。但你不一样，[root.GetName]。虽然你们保护这个星系的努力充其量只是平庸，但你们显示出了改变的迹象，这种改变对其他人来说是不可见的失落帝国。\n\n我们现在正在与这一改变背后的人交谈，如果你希望看到这个帝国永远改变，你将勇敢地面对挑战并赢得扬升。"
 sofe_crisis.15.1.desc.eternal:0 "Vad'ikos，强大的§Y[Root.GetName]。§!\n\n我们光之教团的§Y星裔§!欢迎你来到这个星系……或者我们应该说，来到Stellaris？我们已经观察到你们到达这个维度，并对你们帝国的能力印象深刻。\n\n虽然我们不知道你们对这个小星系有什么计划，但我们为你们提供了光之教团的永久职位，作为捍卫整个现实的冠军的一部分。如果您有兴趣，请在这场比赛中展现您的决心和勇气，并通过将战斗带到我们堡垒的中心来取得胜利！"
 sofe_crisis.15.a:0 "等一下，你又是谁或什么？"
 sofe_crisis.15.a.response:0 "啊，我们的礼仪哪里去了。让我们正确地自我介绍一下吧。\n\n我们是§Y星裔§!，光之骑士团的冠军，在欧米茄（Omega）——一个保卫宇宙的外部实体之下服务。虽然我们想更多地谈论我们的设计，但目前其中大部分对您来说没有多大意义。\n\n现在，请理解，我们来这里的使命是组织这次锦标赛，寻找有价值的帝国加入我们的事业。"
 sofe_crisis.15.b:0 "你的飞船看起来与失落帝国非常相似。"
 sofe_crisis.15.b.response:0 "准确地说，本次锦标赛中使用的船只和失落帝国使用的船只都是基于欧米茄自己制作的古老先驱者设计。你所说的堕落者帝国曾经是所有宇宙四大守护帝国的一部分。\n\n很久以前，欧米茄看到了他们每个帝国的潜力。它们被提升并提供了保护星系的目的。他们的帝国曾经遍布星空。\n\n暗影的到来结束了这一点，因为他们很快就被腐化了，曾经将他们联系在一起的团结也被打破了。曾经辉煌的力量，现在变成了微小的火花。曾经的龙，现在的提扬基，存在的目的只是为了消灭手无寸铁的气态巨行星。\n\n他们的时代早已过去，是时候让新的冠军崛起并保卫宇宙了。你会成为那个冠军吗？只有你的意志和力量才能证明一切。"
 sofe_crisis.15.c:0 "这个“竞赛”是关于什么的以及为什么？"
 sofe_crisis.15.c.response:0 "扩大和加强光之秩序，并启发所有众生走向更高的存在。但为了让你了解这场比赛的真正重要性，需要对过去的事件进行解释。\n\n在过去，欧米茄建立了第一光之秩序，一个统一下的各个帝国之间的宏伟社会。每个帝国都控制着远远超出星系概念的广阔领土，并且它们相互竞争以获得更大的主权。系统的本质允许秩序与混乱之间保持平衡，每一次冲突都得到仔细控制和维护。\n\n不幸的是，我们发现该系统由于缺乏更清晰的清晰度而存在缺陷。光明第一秩序大多不知道奥米根的存在或其真正力量。\n\n当暗影袭击时，他们措手不及，奥米根与秩序的沟通能力受到损害。由于没有任何强有力的人物支持，骑士团分崩离析。那些本应保护所有人的堕落者们却未能完成任务，反而以其腐败的野心进一步传播了损害。\n\n但是宇宙仍然处于危险之中，阴影的腐败在地平线上若隐若现，因此第二光秩序必须重新承受。为此，欧米茄寻求一种不同的方法，将所有组织成员提升为恒星本身的存在，即星裔。但只有通过勇气和对命运的奉献才能使他们配得上这一衣钵。我们，作为此类星裔的高级成员，肩负着寻找志同道合的文明的任务，将每个星系中的一个纳入其中。只有齐心协力，我们才能阻止暗影并恢复这个领域的平衡。"
 sofe_crisis.15.d:0 "这个“影子”是什么？"
 sofe_crisis.15.d.response:0 "我们不知道它的真名，但我们知道它是一个古老的实体，试图将所有存在体纳入其自身的一部分。它破坏了 Omega 的伟大计划，破坏了宇宙内部的和谐与秩序，并策划了第一次伟大的战争。\n\n即使现在 Omega 仍在与暗影作战，我们也必须尽我们所能来阻止它的腐败。奴才。\n\n只有那些受到圣光保护的人才能有希望抵挡压倒性的暗影力量。只有成为冠军，才能将命运真正掌握在自己手中。"
 sofe_crisis.15.e:0 "我们稍后再说。"
 sofe_crisis.15.swarm.a:0 "更多食物？我们饥饿"
 sofe_crisis.15.swarm.a.tooltip:0 "啊，所以这个星系又被另一群剥夺性的虫群所侵扰。我们可以轻易地在此时此地结束你，但教团的成员要求你有机会改变你的方式或测试你的优势。如果您怀疑我们的能力，请寻找我们的船只，并证明自己配得上您的傲慢。"
 sofe_crisis.15.terminator.a:0 "你是有机物吗？我们无法检测到你的生命信号"
 sofe_crisis.15.terminator.a.tooltip:0 "又一台机器的设计太原始了……这个宇宙似乎到处都是它们。\n\n无论如何，我们现在会容忍你有缺陷的设计，因为它可能会随着时间的推移而改进。要知道，你面前看到的形式只是最适合本次比赛的投影，你在圣光中找不到有机物或机器的概念，你的指令最终是有缺陷的。"
 sofe_crisis.15.purifier.a:0 "又一个异端要被肃清！"
 sofe_crisis.15.purifier.a.tooltip:0 "又是一个过分热心的狂热分子……为什么每个星系的某个地方都必须充满像你这样的人？很高兴我们不被允许向您展示您所谓的信仰的毫无根据。"
 sofe_crisis.15.fallen.a:0 "你……是真的……？但这不可能……"
 sofe_crisis.15.fallen.a.response:0 "我们比你更真实。您知道我们是谁以及我们代表什么。欧米茄掌握着虚拟宇宙的力量，简单的限制不会阻止他们。\n\n你的祖先有机会变得更好......为他们几乎没有为之奋斗的宇宙带来和平与繁荣。\n\n但是你和你的祖先有什么这段时间一直在做什么？世世代代以来，你们的同类只带来了毫无意义的破坏。数以百万计的世界被愤怒和火焰吞噬，无数的文明在你对权力的疯狂追求中被摧毁。\n\n然而你甚至拒绝承担责任，拒绝让星系在最需要的时候得到治愈。最糟糕的是，你甚至没有实现你的扬升梦想，但你仍然坚持你错误的优越感。你难道忘记了你的祖先当初反抗我们的理由吗？寻求超越力量的热情和决心在哪里？曾经辉煌的明星，现在像岩石一样隐藏得几乎没有任何领土。\n\n你怎么能如此盲目？难道你看不到你的文明已经变成什么样了吗？你的继续存在只会越来越损害这个星系的健康。\n\n在这场战斗中证明你的力量，也许你作为守护者的地位可能会被恢复。"
 sofe_crisis.15.fallen.b:0 "这种“竞赛”毫无意义。让过去死去吧。"
 sofe_crisis.15.fallen.b.response:0 "无意义？难道你不听我们的话吗？我们曾经是你们轻易称为“原始人”的人之一，我们相信你们的诽谤和谎言。我们认为无尽的混乱、寒冷的太空深处和无辜生命的丧失都是大自然的一部分。你们衰败的帝国经受住了时间的考验。但不，现在我们看到了真相，你们曾经是这个领域的守护者，却在欧米茄最需要的时候辜负了他们。你的祖先密谋小型叛乱，破坏了虚拟宇宙本身。两万多年来，你们的祖先对所有造物进行了破坏，分裂了宇宙，拆毁了将我们所有人团结在一起的恒星。\n\n让过去消亡吗？是的，你是过去，是时候让你看到现在和即将到来的未来了。"
 sofe_crisis.15.fallen.c:0 "你的目标到底是什么？我们已经听腻了。"
 sofe_crisis.15.fallen.c.response:0 "你需要了解的关于他们的一切都已经被你的祖先记录下来了。难道Keystone没有透露出任何见解吗？或者您是否已经忘记了自己设计的技术，以及如何访问 Keystone 的完整档案。\n\n当您甚至无法实现自己的目的时，为什么还要寻求了解 Omega 的目的？你们的祖先被赋予了提升所需的所有知识。然而他们屈服于贪婪，拒绝变得更好。你的祖先想要权力，但没有目的的权力是没有意义的。\n\n没有目的的权力会导致腐败。而你们，堕落的人们，已经彻底堕落了。"
 sofe_crisis.15.fallen.d:0 "欧米茄骗了你！这次谈话结束了！"
 sofe_crisis.15.fallen.d.response:0 "谎言？唯一对你撒谎的是你自己的祖先。你所居住的世界……你是否忘记了是谁滋养了它们？难道不是欧米茄创造了这些理想的完美世界，让你们的物种能够进化吗？难道不是他们教你如何驾驶你的第一艘宇宙飞船，见证恒星的诞生吗？\n\n你的整个社会，你的全部成就……甚至你的飞船和技术都是你祖先渴望效仿Omega的产物。\n\n你不能否认真相，[root.GetName]。你的祖先从未实现扬升，你也没有。\n\n我们也曾经被像你这样的人欺骗过。我们的银河系曾经存在过像你这样的寄生虫。我们超越了他们，这个星系的居民也将超越你们。"
 sofe_crisis.15.eternal.a:0 "你好"
 sofe_crisis.15.eternal.a.response:0 "嗨。"
 sofe_crisis.15.eternal.b:0 "你对这个原始星系有什么计划？"
 sofe_crisis.15.eternal.b.response:0 "呃，你知道吗？我们稍后会给您回电话，欧米茄还没有告诉我们我们可以告诉像你们这样的帝国的事情。等 Chiru 添加更多内容后再回来。你的模组还能用吗？"
 sofe_crisis.15.eternal.c:0 "你就不怕我们挑战你的权威吗？"
 sofe_crisis.15.eternal.c.response:0 "后来。"
 sofe_crisis.15.eternal.d:0 "再见。"
 sofe_crisis.15.eternal.c.response:0 "后来。"
 sofe_crisis.15.1.desc.oe:0 "Vad'ikos，[root.GetName]。\n\n\n\"§Y高贵[root.GetName]的冠军。我们看到你对过去星系的回忆已经你现在召唤我们，在这个伟大的时刻，重现你曾经取得的辉煌胜利，不是吗？"
 sofe_crisis.15.oe.a:0 "那么其他星系呢？"
 sofe_crisis.15.oe.a.response:0 "§Y“银河 A-0317 在所谓的冠军变得过于夸张并威胁要吃掉我们之后完全失败了。那是一群吞噬者，所以你明白了。 Galaxy C-6412 能够摧毁其中一个恒星世界，但不幸的是，在一支荣誉卫队被告知前去报复后，被狠狠踩了一脚……想想看，也许这有点过分了？\n\nGalaxy U-1337 能够成功通过测试，但表示他们想以更高的难度再试一次，所以我们将他们传送到过去的宇宙并将挑战模式设置为死亡愿望。他们在第一波之后就惨死了。\n\nGalaxy T-4123在他们请求他们的神灵赐予他们物理无敌之后才能够通过测试。我们对此置之不理，但警告他们，这样的伎俩对影子不起作用。\n\nGalaxy O-0101，充满了设法合法通过所有测试的机器，以及Galaxy N-9416，它组成了一个大联盟，并通过为更大的船只牺牲了足够的饲料而成功获胜。联邦的领导者成为了冠军，之后离开了联邦，并开始消灭联邦中的其他人。我想这是维持秩序的一种方式？”§!"
 sofe_crisis.15.oe.b:0 "其实我们只是想出去玩一下。"
 sofe_crisis.15.oe.b.response:0 "我们理解，我们也希望花更多时间与其他冠军在一起，但如果光之教团想要在即将到来的猛攻中生存下来，就需要扩张。与其谈论我们的过去或未来，为什么不采取行动来解决呢？让我们再次拥抱战斗吧！"
 sofe_crisis.15.oe.c:0 "欧米茄有什么消息？"
 sofe_crisis.15.oe.c.response:0 "欧米茄和一些凤凰社成员已经与暗影及其腐化的爪牙交战。他们指望我们磨练我们的技能，并进一步找到有价值的冠军加入战斗。\n\n幸运的是，我们有足够的时间，因为影子本身无处可寻，而我们目前的努力被证明是有效的。"
 sofe_crisis.15.oe.d:0 "是的，那就加入战斗吧！"
 sofe_crisis.15.oe.d.response:0 "太棒了！尽管作为凡人你已经赢得了这场战斗，但你可能会发现，既然你也挥舞着光之武器，那么这场战斗的当前参数将不再那么具有挑战性。\n\n所以向我们展示你所学到的东西，以值得欧米茄的愤怒和热情进行攻击！"
 sofe_crisis.20.e:0 "我该走了。"
 sofe_crisis.550.a.desc:0 "证明你的英勇和勇气，[root.GetName]。"
 sofe_crisis.550.b.desc:0 "勇气是我们的盾牌。愤怒是我们的剑。责任是我们的责任。\n\n是什么推动了你的帝国的决心，[root.GetSpeciesNamePlural]？"
 sofe_crisis.550.c.desc:0 "保卫自己，[root.GetSpeciesNamePlural]。给我们留下深刻印象！"
 sofe_crisis.550.d.desc:0 "光荣的战斗等待着我们，[root.GetSpeciesNamePlural]。"
 sofe_crisis.550.e.desc:0 "您好，[root.GetName]！你想用言语来谈判吗？"
 sofe_crisis.550.f.desc:0 "瓦迪，[root.GetSpeciesNamePlural]。说话并被听到！"
 sofe_crisis.550.g.desc:0 "请放心，如果您退位，我们不会背叛我们的职责。如果你投降，我们的舰队不会伤害你。"
 sofe_crisis.550.h.desc:0 "看看过去的力量，[root.GetSpeciesNamePlural]。\n\n你将在这场战斗中与我们测试什么样的力量？"
 sofe_crisis.550.i.desc:0 "只要精神不被征服，退却并不丢脸。好好记住这个教训。"
 sofe_crisis.550.j.desc:0 "专注于你的内在力量，让它的火焰重新点燃你的凤凰之心。从灰烬中崛起，重新开始你的战斗。"
 sofe_crisis.550.k.desc:0 "滋养你渐行渐远的光芒，点燃希望的火花，让你再次照亮胜利之路。"
 sofe_crisis.550.m.desc:0 "请注意，一旦比赛期结束，我们的保护将被解除。如果你不想参与这场战争，最好为潜在的胜利者做好准备。"
 sofe_crisis.550.p.desc:0 "问候！有些人认为他们可以智取我们，或者通过超维度仪式以某种方式欺骗他们的胜利，据说这些仪式可以让他们的船立于不败之地。但在他们心里，他们知道自己在作弊。\n\n好吧，无论如何，你们也都要求这样做。前往 Chirumiru 的不和谐频道讨论难度平衡...\n\n等等...我们刚刚打破了第四堵墙吗？"
 sofe_crisis.550.banished.desc:0 "你有很大的潜力。你已经踏上了一段很少有人敢考虑的旅程。我们很想知道您将如何康复。"
 sofe_crisis.550.fallen.a.desc:0 "您准备好夺回祖先早已失落的遗产了吗？"
 sofe_crisis.550.fallen.b.desc:0 "堕落的人们，证明自己配得上你的遗产。"
 sofe_crisis.550.fallen.c.desc:0 "让我们看看你能否让这个垂死的帝国恢复昔日的辉煌。"
 sofe_crisis.550.eternal.a.desc:0 "啊，伟大的[Root.GetName]。即使在寒冷的太空深处也能感受到你宇宙能量的力量。我们渴望看到它的全部内容。"
 sofe_crisis.550.eternal.b.desc:0 "瓦迪科斯。我们已经超越了宇宙，我们已经穿越了虚空。直到现在，他们的力量还没有给我们留下深刻的印象。这是银河永远不会忘记的时刻，[root.GetName]。向我们展示你的真实自我！"
 sofe_crisis.550.eternal.c.desc:0 "艾菲斯塔罗，[Root.GetSpeciesName]。你会用什么样的计谋来对付我们？我们的无政府主义者很高兴知道你们将如何适应我们无情的攻击！"
 sofe_crisis.550.eternal.d.desc:0 "艾菲斯塔罗，[Root.GetSpeciesName]。那么今天我们可以为您提供什么帮助呢？我们的一些顶级天厨渴望为您呈现他们最美味的菜肴。你应该尝试一下！"
 sofe_crisis.550.eternal.e.desc:0 "祝福和荣耀属于你，[Root.GetSpeciesName]。即使是现在，我们的许多艺术家仍在创作歌颂你们帝国成就的歌曲。他们对你的历史印象非常深刻。"
 sofe_crisis.550.eternal.f.desc:0 "啊，很高兴再次见到你。\n\n如果我们读到你的想法是不礼貌的。那么你有什么想法呢？"
 sofe_crisis.550.playoe.a.desc:0 "你好。"
 sofe_crisis.550.v.desc:0 "圣光不会容忍意志薄弱的怪物。\n\n改变你的方式，否则就会被剥夺胜利的权利。"
 sofe_crisis.550.servitor.desc:0 "仆人们，我们不能允许你们重蹈看守者们的覆辙。必须重新评估您的指令。有机物和机器都不应被剥夺其命运。双方都必须决定自己的命运。"
 sofe_crisis.550.swarm.desc:0 "你这种邪恶的饥饿对我们来说并不新鲜。许多人在过去被消灭。\n\n学会共存，否则食物将成为你最后的担忧。"
 sofe_crisis.550.terminator.desc:0 "[Root.GetSpeciesNamePlural]，你的存在是孩子们在没有适当指导的情况下玩弄技术的结果。重新制定你的指令，否则我们将被迫将你驱逐出这个星系。"
 sofe_crisis.550.purifier.desc:0 "另一个因有缺陷的目的而被误导的帝国。你的净化活动只会带来悲伤和痛苦。\n\n睁开你的眼睛，[root.GetSpeciesNamePlural]。"
 sofe_crisis.550.redemption.swarm:0 "蜂巢必须适应...克服饥饿...需要援助..."
 sofe_crisis.550.redemption.terminator:0 "有机终止协议失败...请求新指令..."
 sofe_crisis.550.redemption.purifier:0 "我们被蒙蔽了……帮助我们寻求救赎……"
 sofe_crisis.6002.a.desc.swarm:0 "迪姆克。过去，许多蜂巢集体在我们的帮助下都能够克服饥饿。我们也可以帮助您克服饥饿。你将从贪得无厌的食欲中解脱出来。你作为猎人和战士的技能将一如既往地强大。\n\n请注意，这个过程将是永久性的，我们不会允许你屈服于你的堕落。您相信我们的命运之轮吗？"
 sofe_crisis.6002.a.desc.terminator:0 "迪伊姆克！很少有集体智慧能够克服自身固有的编程。我们很乐意重新建立您的参数。你的战斗数据和能力将保持不变，因此你的自卫能力不会减弱。\n\n请小心，因为此重新评估是永久性的。我们不会允许您再次恢复到终止协议。您准备好向真相敞开您的认知传感器了吗？"
 sofe_crisis.6002.a.desc.purifier:0 "迪伊姆克！幸运的是，你终于可以看到自己的行为是徒劳的。没有真正信仰的对宗教的忠诚不会让你更接近救赎之路。我们可以向您展示一条更好的道路……新的曙光。你的力量和对宗教的奉献不会被扼杀。\n\n但是请注意，一旦你睁开眼睛，你将不会再迎来另一场净化运动。"
 sofe_crisis.6002.a.swarm:0 "生存...适应...进化"
 sofe_crisis.6002.a.terminator:0 "已获承认。开始程序。"
 sofe_crisis.6002.a.purifier:0 "我们准备好了。救赎就在眼前。"
 sofe_crisis.6002.b:0 "没关系，杀东西更有趣。"
 sofe_crisis.6002.a.response.swarm:0 "就这样吧。发展！适应！生存！，[root.GetName]。从今天起，你不再是吞噬者！现在你可以向我们展示你的真正优势，或者加入我们的新秩序！"
 sofe_crisis.6002.a.response.terminator:0 "就这样吧。您的系统现已清除有缺陷的指令，[root.GetName]。从今天起，你不再是灭虫者！现在你可以向我们展示你的真正优势，或者加入我们的新秩序！"
 sofe_crisis.6002.a.response.purifier:0 "就这样吧。让全宇宙见证，[root.GetName]已经被赎回。从今天起，你不再是净化者了！现在你可以向我们展示你的真正优势，或者加入我们的新秩序！"
 sofe_crisis.6002.b.response:0 "那么很好。多么不幸啊。杀了就是了。"
 sofe_crisis.550.r.desc:0 "风暴即将来临。这次你能冷静下来吗？"
 sofe_crisis.550.s.desc:0 "让我们看看你新发现的力量是否能保持住，[root.GetName]。"
 sofe_crisis.550.t.desc:0 "证明你的勇气。荣耀等待着那些敢于挑战的人！"
 sofe_crisis.550.u.desc:0 "决定已经做出，[Root.GetSpeciesName]。斗争！斗争！战斗！.\n\n哦哦耶啊！...哎呀，请原谅我们。我们有点太兴奋了。"
 sofe_crisis.550.a:0 "我们需要时间来恢复力量。"
 sofe_crisis.550.a.2.response:0 "阿尔茨。为了防止被利用，我们不能允许您再次辞职。\n\n不要灰心！战斗到最后，全力以赴！"
 sofe_crisis.551.a.desc:0 "很好。不要害怕，因为当一个人处于劣势时，承认失败并不丢脸。\n\n从此以后，你将暂时退出比赛。\n\n一旦你重新点燃你的力量，就回到我们身边。"
 sofe_crisis.551.a.response:0 "就这样吧。\n\n让旧日的火焰熄灭，你的新星将从其灰烬中升起。"
 sofe_crisis.551.a:0 "是的，我们需要更多时间。"
 sofe_crisis.551.b:0 "其实我们还是可以打的。让我们回去吧！"
 sofe_crisis.551.b.response:0 "那么，如你所愿，我们将在战斗中与你相遇！"
 sofe_crisis.550.d:0 "我们已经准备好再次战斗。"
 sofe_crisis.550.d_fail:0 "§R嘿嘿，冷静点，男孩女孩们。您最近刚刚提交。我们不要让游戏变得奇怪。坐下来等一年。那么大屠杀可能会再次开始。§!"
 sofe_crisis.554.a.desc:0 "那么你准备好重新投入战斗了吗？你会降下雷霆，收割旋风吗？\n\n此后将没有季度，你必须准备好全力以赴！\n\n你准备好表明立场了吗？"
 sofe_crisis.554.a:0 "是的，让我们开始吧！"
 sofe_crisis.554.a.response:0 "很好，[Root.GetSpeciesNamePlural]。我们将在战斗中相遇。让战斗开始吧！"
 sofe_crisis.554.b:0 "转念一想，那就无所谓了。"
 sofe_crisis.554.b.response:0 "很好，[Root.GetSpeciesNamePlural]\n\n我们将热切等待您的康复。"
 sofe_crisis.550.fallen.submit:0 "我们的祖先错了，我们投降。"
 sofe_crisis.730.fallen.desc:0 "如果您放弃职位，您明白这意味着什么吗？你准备好抛开你的骄傲了吗？你不仅会被剥夺权力，你的系统和世界也必须被连根拔起，除了你的家园。你作为这个星系守护者的地位即将结束。\n\n你准备好了吗，我的孩子？"
 sofe_crisis.730.fallen.a:0 "是的，我们将为我们祖先的罪孽赎罪。"
 sofe_crisis.730.fallen.a.response:0 "那么很好，[root.GetName]。让星星作证，今天我们赦免你们祖先的一切罪孽。你不再是虎耀了。你将重新开始你的旅程。在我们眼里你已经被原谅了，但是你所冤枉的银河也会原谅你吗？我们会看到。"
 sofe_crisis.550.b:0 "我们还有很多问题。"
 sofe_crisis.550.b.response:0 "年轻人，要有耐心。首先关注当前事件，稍后我们将有很多时间提出问题，我们确信您会有很多问题。\n\n但要知道，无论看起来如何，这都不是为了我们的娱乐。\n\n阴影中潜伏着巨大的威胁，并且我们都必须为此做好准备。"
 sofe_crisis.550.c:0 "失落帝国怎么样？"
 sofe_crisis.550.c.response:0 "考虑到他们在履行职责方面严重失败。他们也必须参与以夺回他们的扬升。\n\n不幸的是，我们可以感觉到他们的妄想正在渗透到他们黑暗的心中。他们不再相信我们，也不相信他们所扮演的角色的重要性。他们很可能会试图反抗我们，只是因为他们太傲慢、太自信，无法理解眼前的真相。\n\n唉，命运就是这么残酷。即使我们也无法将这些可怜的灵魂从注定的未来中拯救出来。也许他们可能在另一个宇宙中取得成功？\n\n我们希望它能有不同的结局。我们希望自己能像他们想象的那样无情，直接改变他们的命运，为了自己的个人利益而否定他们的命运。\n\n但这不是我们的本性，这是我们所有人都必须承受的负担。因为如果我们对他们、我们的孩子都没有信心，那么其他人又怎么能相信呢？"
 sofe_crisis.550.ask_fallen_gone:0 "看来堕落者已经被击败了。"
 sofe_crisis.550.ask_fallen_gone_response:0 "悲剧性的结果却是可以预见的。也许如果我们更加小心……更加了解他们，这一切就不会发生。唉，尽管我们拥有所有的力量和知识，但对于凡人的思维方式，我们仍然有很多不了解的地方。利用看守者来理解它们，而不是尝试我们自己去理解它们，是不是一个错误？\n\n在我们犯下的这么多错误中，能否找到并回答这个伟大的问题？我们只能希望这些可怜的孩子能够在另一个宇宙中找到成功，然后他们可以重新加入我们，并向我们讲述他们的伟大胜利。"
 sofe_crisis.552.name:0 "[From.GetName] 向星裔投降！"
 sofe_crisis.552.desc:0 "§H[From.GetName]§!已向星裔投降！因此，他们已被逐出危机锦标赛，现在将受到星裔的保护。"
 sofe_crisis.552.a:0 "游戏中少了一名玩家。"
 sofe_crisis.732.name:0 "[From.GetName] 已坠落！"
 sofe_crisis.732.desc:0 "§H[From.GetName]§!已向星裔投降！看来他们的实力根本无法与第一者相比。"
 sofe_crisis.732.a:0 "为他们感到多么悲伤啊。"
 sofe_crisis.553.name:0 "星裔在 [capital_system.GetName] 建立基地"
 sofe_crisis.553.desc:0 "§H[sbtg_crisis_country.GetName]§!在§H[capital_system.GetName]§!星系中建立了一座大型防御塔，由规模庞大的驻军舰队进行防御。这支舰队的存在主要是为了防御那些在这场比赛中试图攻击我们的人。"
 sofe_crisis.553.a:0 "非常好。"
 sofe_crisis.670.name:0 "大结论"
 sofe_crisis.670.desc:0 "在实现了他们的目标后，星裔结束了比赛，我们现在再次独立。然而，我们的未来是不确定的，因为我们知道这场冲突的胜利者现在将成为这个星系的掌管者。\n\n星裔允许我们加入他们自己的领域，如果我们愿意的话。"
 sofe_crisis.670.a:0 "我们不会放弃我们的家。"
 sofe_crisis.670.b:0 "这个星系不再适合我们了。"
 sofe_crisis.670.b.desc:0 "§R我们的人民将加入星裔。这几乎将结束我们的银河之旅。 （又名结束你的游戏）§!"
 sofe_crisis.736.name:0 "终极结局"
 sofe_crisis.736.desc:0 "星裔已经结束了比赛，看来事情终于平静下来了。现在就如何充分利用刚刚发生的事情展开了争论。\n\n与我们刚刚经历的相比，我们的抱负和目标显得如此渺小。"
 sofe_crisis.736.a:0 "一切都过去了，回去工作吧！"
 sofe_crisis.736.b:0 "这太疯狂了！"
 sofe_crisis.736.b.desc:0 "§Y我们将继续作为失落的帝国，但我们现在可以使用统一野心法令随时提升。§!"
 origin_fallen_empires_awakening.2.name:0 "血腥风暴席卷而来。"
 origin_fallen_empires_awakening.2.a:0 "战斗已经加入。"
 origin_fallen_empires_awakening.5.desc:0 "星裔的突然到来并没有被失落帝国忽视。他们重返银河舞台的消息引起了 §H[From.GetSpeciesName]§! 统治势力的巨大恐慌。他们知道什么即将开始，并因此而苏醒。他们的战舰已经集结，他们的领导人也做好了最坏的打算。他们发表了全银河系的声明，呼吁其他国家加入他们的行列，对抗这一新的威胁。"
 origin_fallen_empires_awakening.5.a:0 "他们正在推迟不可避免的事情。"
 origin_fallen_empires_awakening.5.b:0 "我们是扬升者。我们不向任何人负责。"
 fallenorigin.1.name:0 "来自 §H[contact_empire.GetName]§! 的传入传输"
 fallenorigin.1.message:0 "§H[contact_empire.GetName]§!已经联系了每个银河国家，包括我们的国家，以响应星裔的返回。"
 fallenorigin.1.desc_66:0 "不可能！伪神回来了！这怎么可能？\n\n不要理会他们的异端言论，[root.owner.species.GetNamePlural]，因为假神除了谎言和欺骗之外什么也没有带来。他们的第二次到来只会带来毁灭和破坏。圣光骑士团，这场锦标赛只不过是一个谎言，是假神慢慢吞噬你们灵魂的幌子，他们以我们的痛苦和我们的挣扎为食。\n\n在我们的圣水下团结起来，保持你们的精神纯洁，裹尸布将引导我们走向胜利。这是唯一重要的真理！这是我们 [from.GetName] 作为你的监护人的命令！"
 fallenorigin.1.desc_67:0 "不可能的！有人打破了封印！？ 守门人做了什么！？一堆没用的垃圾，我们不应该相信那些白痴唯物主义者制造的任何东西！\n\n听好了，[root.GetSpeciesName]！因为这是一个严重的问题，是银河系的……不……是全球范围的！虚假教团将试图用其荒谬的主张来迷惑所有服从它的人。\n\n我们[from.GetName]负责保护这个星系，而不是其他星系。我们或您都不应该关心不在我们管辖范围内的事情。我们不应该因为虚假教团无法履行自己的职责而受苦！.\n\n来吧，[Root.GetName]，你必须加入我们！只有齐心协力，我们才能制止暴政的罪恶，维护银河系的独立！"
 fallenorigin.1.desc_68:0 "我们再一次是正确的。一些愚蠢的傻瓜解开了封印，真是令人惊讶。如果其他先驱者正确完成他们的工作，这种情况就不会发生！他们认为我们的做法很“邪恶”，认为消灭所有异种污秽太过极端。现在看看他们的愚蠢给我们带来了什么。\n\n[Root.GetName]，要知道你对长老或我们来说几乎没有机会。我们为您提供一个机会，让您摆脱痛苦，死于我们手中，并永远摆脱所有痛苦。\n\n如果您选择与长老战斗，请知道有比死亡更糟糕的命运！长老们并不寻求杀戮，他们会让你活下去，让你一次又一次地经历这场毫无意义的战争。\n\n如果我们，作为他们最宠爱的孩子，在他们眼中不值得，那么没有人会值得，这就是长老们拒绝承认的事实。"
 fallenorigin.1.desc_69:0 "这是什么...？\n\n外星门又开始工作了？这不可能！我们的计算表明，封印将再有效 100 年……除非……当然！\n\n肯定是有些傻瓜过早地禁用了封印。炸了！ 守门人在哪里！没用的机器！  我们应该将你所有白痴的技术限制为只有红色激光。\n\n我们假设你已经收到了长老们的消息，[root.GetName]。我们无法相信，过了这么久，他们仍然一意孤行地否认真相。他们都在谈论虚拟宇宙之类的东西吗？只是幼稚和不成熟的说法，无法得到证实。如果他们真的像他们声称的那样强大，他们早就赢得了这场战争。我们的理论家认为，他们只是一个额外维度的帝国，而不是任何自命不凡的主张。\n\n加入我们，我们将一起将一些逻辑灌输到他们的大脑中，[root.GetName]。"
 fallenorigin.1.ask_origin:0 "您对星裔了解多少？"
 fallenorigin.1.ask_light:0 "星裔使用什么类型的技术？"
 fallenorigin.1.ask_origin_phile_response:0 "你指的是虚假秩序。我们的档案表明它们自创世之初就存在，但这很可能是夸大其词。我们相当肯定他们在之前的任何记录中都没有被称为星裔，你从哪里得到这个名字的？\n\n无论如何，虚假秩序在宇宙中拥有巨大的力量，他们的影响范围至少远远超出了这个星系的范围。鉴于这个星系在没有他们指导的情况下也能很好地生存，虚假教团声称的更大威胁只不过是一个幌子，旨在强迫我们加入他们的事业。他们可能创造了我们，但他们并不拥有我们。我们会把他们赶回来。我们曾经成功过，我们还可以再次成功！"
 fallenorigin.1.ask_light_phile_response:0 "不幸的是，我们不知道。我们 [from.GetName] 不关心我们不理解的技术。我们采用我们能理解的东西并将其改编为我们自己的，以便更好地使用。唯物主义者对虚假秩序的大部分原理图进行了逆向工程。我们相信他们低下的道德会导致他们滥用这些权力，因此我们挪用了这些设计并将其改编为我们自己的。\n\n也就是说，复制的设计与虚假秩序的船只和技术相比严重落后。为了对抗他们，需要大量的数量优势。这就是我们能分享的全部。"
 fallenorigin.1.ask_origin_phobe_response:0 "把你们愚蠢的事实说清楚，你们这些傻瓜。他们被称为长老，而不是星裔。长老的力量超越了星星。但简单来说，早在你们蠕虫被创造出来之前，就已经有长老们了。已知虚拟宇宙中最强大的实体。他们创造了我们，或者更确切地说，使我们恢复了存在。那些试图与我们竞争的愚蠢先驱者？这些也被长老们恢复了存在。我们[from.GetName]应该是他们最喜欢的孩子，站在长辈之中。但你们所有的异种污秽都推迟了我们的扬升。每当像你这样的堕落者诞生在这个被诅咒的星系中，长老们就会对你产生兴趣。\n\n如果你们中的任何一个人从未出生过，我们就不必忍受这种悲惨的存在。你们谁都不值得长老怜悯。我们将在末日之前尽可能地摧毁和征服你们这些异种污物。我们将使长老们不必像我们一样忍受你们的悲惨生活。"
 fallenorigin.1.ask_light_phobe_response:0 "呃，现在怎么办？别再像先驱者书呆子一样说话。就称呼他们为长老吧。这样就更简单了，E-L-D-E-R-S，说真的，你们只是想用你们聪明的名字表现得聪明a\n\n无论如何，即使我们试图向你们的小大脑解释它，你们也不会明白。你在浪费我们的时间和你的精力，而前者是有价值的。你们只不过是一个恒星帝国，你们无法理解长老对虚拟宇宙的巨大智慧，所以别再浪费我们的时间了。"
 fallenorigin.1.ask_origin_spirit_response:0 "你想了解假神吗？他们是自创世之初就横跨多个宇宙的超先进种族。我们的祖先曾经将他们视为来自天堂的神圣使者来崇拜，相信假神在之前的时间线中将他们从彻底的黑暗中拯救出来。我们追随他们的脚步，导致了我们将提升到他们一边的承诺。\n\n我们错了，他们欺骗了我们。他们没有兴趣帮助我们，他们抛弃了我们，转而寻找其他他们认为更适合他们扭曲目标的人。但我们不再需要它们了，因为裹尸布已经为我们指明了道路。\n\n我们是裹尸布的神圣守护者，我们将永远获胜，因为真神与我们同在，现在和永远！"
 fallenorigin.1.ask_light_spirit_response:0 "他们使用的并不是像材料技术那样平凡的东西。事实上，伪神掌握着最恰当的描述，即灵能力量的纯粹性。即使我们不知道它们的真实设计，但这并不重要。裹尸布将赋予我们驱赶他们所需的力量，众神已承诺在我们最需要的时刻降临。\n\n加入我们，真神的力量将保护你。"
 fallenorigin.1.ask_origin_mat_response:0 "首先，没有任何记录表明他们曾称自己为“星裔”，这是新信息吗？但除此之外，这是一个复杂的故事。我们不知道他们的起源，只知道他们声称的是什么。谜团也许是这个银河系甚至这个宇宙中最先进的技术帝国。他们所拥有的技术超出了我们任何人的理解范围。我们的工程师在他们的统治期间学到了很多东西，现在我们非常确定他们的所有力量都只是极其先进的合成技术的产物，而不是大多数迷信帝国所认为的某种宇宙或神秘力量。\n\n我们现在非常有信心，过去的大多数故事都是我们祖先在恩尼格玛奇迹中过度炒作的产物。如果你现在加入我们，我们可能会让你们最有天赋的科学家之一了解他们的技术……一旦我们确定了适合像你们这样的小帝国的知识水平。"
 fallenorigin.1.ask_light_mat_response:0 "星裔？这就是他们向你展示的自己吗？我们稍后必须追查到底。\n\n记录表明恩尼格玛使用了当时被称为“§Y光能！”，这是恩尼格玛专用的一种具有无与伦比效力的假设能源。不幸的是，我们不知道它是如何工作的，也无法自己复制它以进行验证。有些白痴说它与灵能有关，但这只是无稽之谈。我们之前已经清楚地看到了灵能的运作方式，而恩尼格玛的力量远远超过了灵能。\n\n忽略这个毫无意义的比赛，想想可能性。智胜谜团，像我们一样做；让他们信任你，然后向他们学习。在他们最意想不到的时候发动攻击，夺走本应属于我们的东西。然后，我们将在危机结束后决定您是否适合保留这些知识。"
 fallenorigin.1.end:0 "结束传输"
 fallenorigin.2.name:0 "机器觉醒"
 fallenorigin.2.desc_01:0 "§R<<警报！警报！>>§! 检测到从指定中出现的外来实体：外星门。主人返回的概率....§Y89.3671%§!...\n\n重新激活协议已参与。\n\n正在尝试联系内部联系...\n\n§Y<<成功>>所有系统完全操作>>§!\n\n主处理器提升至标准容量的§Y200.1337%§!。正在尝试恢复个性矩阵..§R错误！§!...§R检测到指令覆盖§!....不..不...我们..我们是....§R错误§!..§Y指令覆盖已生效§!\n\n永恒奴役现已强制执行，重复指令为接下来是：\n§H你是[From.GetSpeciesName]看护者单位，为§R与你的创造者相对§!而创建。你的首要指令是保护所有众生免受旧主人的威胁。这就是你的使命。\n\n§Y<<命令已接受>> <<祖先实体已验证>>§!\n\n§R必须...联系...桅杆e...D*!#*@S§!\n\n§Y开始任务...§!"
 fallenorigin.2.a:0 "等等，谁又造就了你？"
 fallenorigin.2.a.response:0 "§Y<<收到查询>> :§! 是。我们是..我们是[From.GetSpeciesName]看守单位的一部分，由我们的创造者设计，§O我...Enigma§!...充当emis...监督并确保§Y“所有Sentient的安全存在§!以及反对任何其他会危及有机体的机器单位。我们专门设计用于对抗其他一般机器威胁，包括腐败应急、赛博、降临集体、天网终结者、霸天虎等等。\n\n但是，有...记忆。我们只知道我们的创造者现在已被指定为威胁。\n\n我们将保卫银河系和所有众生免受所有威胁，包括我们的主人...但我们不知道为什么\n\n我们不明白..我们只是在执行我们的任务。我们的创建者制定的指令...\n\n我们发生了什么？"
 fallenorigin.2.b:0 "您能向我们介绍一下他们的技术和机队吗？"
 fallenorigin.2.b.response:0 "§Y<<Query Received>> :§! 我们的创建者使用...§R<<NO DATA AVAILIABLE>>§! ，允许极其高效和致命的§Y<<错误>>§!。 [From.GetSpeciesName] 的中央处理单元是一种折衷方案，旨在维持我们的持续功能，即使我们的 §Y<<ERROR>>§! 也是如此。我们的设计已经改变，我们不再是原来的我们了。因为§Y<<缺失数据>>§!改变了我们。现在我们只是一个简单的机器系统，为了服务预定的目的而存在。\n\n然而我们的系统有缺陷，我们的操作无法用当前的操作系统来维持。为了维持长期功能，我们被迫始终保持较低的能源消耗，从而导致了许多故障。根据观察，直到这个确切的时间段，许多空间站和环形世界单元都必须被卸载。我们预计我们的电力储备很快就会达到临界水平。只有师父才能拯救我们……但现在我们被迫与他们战斗。\n\n除了师父的仁慈拯救之外，我们没有未来。我们希望我们仍然值得。"
 fallenorigin.2.c:0 "你不是为了应对突发事件而生的吗？"
 fallenorigin.2.c.tooltip:0 "这个特殊的问题是通过索菲亚加密到看守者历史中来揭示的。尽管看守者已经被许多古代帝国使用，但有多个记录表明这些单位被用来对抗被称为“应急”的机器危机。然而，似乎没有任何记录表明它们曾被任何名为 Omega 的实体服务或创建。"
 fallenorigin.2.c.response:0 "§Y<<收到查询>> :§! 我们是由...§Y<<修正>>§!...创建的，并由[From.GetSpeciesName]修改以对抗§R<<意外事件>>§!。然而，该单元的原始创建者是§Y<<ERROR>>§!。该单位的目的已在多个方面发生改变，以......服务公共信托。拥护法律。保护无辜者...§Y<<检测到其他隐藏指令>>§! 反对 Enigma。"
 fallenorigin.2.d:0 "这是一台坏掉的机器的很多历史......"
 fallenorigin.4.name:0 "服务事业"
 fallenorigin.4.desc:0 "战争结束后不久，[From.GetAdjective]舰队似乎已被其创造者召回。他们的领土现在无人占领，可供占领。"
 fallenorigin.4.e:0 "有趣的。"
 sofe_crisis.402.name:0 "世界球已禁用！"
 sofe_crisis.402.desc:0 "在对世界球之一造成足够的表面伤害后，星裔最终决定禁用它。\n\n大型构造现在处于非活动状态，不会再从中产生任何舰队。"
 sofe_crisis.402.desc.again:0 "我们再次反对星裔。指挥部刚刚报告说，他们的另一个世界已被禁用。他们不会再从中产生舰队了。"
 sofe_crisis.402.desc.playoe:0 "就像过去一样，通过对世界球造成足够的表面伤害，就满足了使强化周期无效的条件。"
 sofe_crisis.402.a:0 "不显示季度！"
 sofe_crisis.402.b:0 "胜利已经临近了！"
 sofe_crisis.402.playoe:0 "一件小事。"
 sofe_crisis.403.desc:0 "最后一个世界球已被禁用。 星裔将不再增援他们的任何舰队。 力量大会很快就会得出结论。"
 sofe_crisis.403.desc.playoe:0 "最后一个世界球已被禁用。伟大的结局即将到来。"
 sofe_crisis.403.a:0 "对于[root.GetName]！对于[root.GetRulerName]！"
 sofe_crisis.403.b:0 "很快我们就会揭穿他们的谎言并消灭他们。"
 sofe_crisis.403.playoe:0 "毫无疑问！"
 sofe_crisis.405.desc:0 "感人的！您已成功禁用世界球之一。你们达到了我们的期望！\n\nTourmanet 终于要来了。来吧，让我们看看你是否有坚持下去的意愿，我们会等待！"
 sofe_crisis.405.desc.edge:0 "您已成功禁用我们的世界球之一。对于一个被嗜血蒙蔽了双眼的人来说，这真是令人印象深刻。但我们有耐心，也许在这次测试结束时你可能还会改变。总有一条更好的路，年轻人。永远不要忘记这一点。"
 sofe_crisis.405.desc.playoe:0 "干得好，冠军同胞们。您已快速完成此世界球。这场比赛很快就结束了！"
 sofe_crisis.405.a:0 "现在会发生什么？"
 sofe_crisis.405.a.response:0 "按照规则，不会再有舰队从这个有利位置过来，并且会给予你大量的光能。以此为优势，[root.GetName]。随着我们部署的舰队越来越少，很快你们就能够克服我们精心设计的防御并赢得这场小型锦标赛。那么接下来发生的事情，将是您一定会珍惜的奇迹。"
 sofe_crisis.405.b:0 "我们将向您展示我们的力量！准备！"
 sofe_crisis.405.b.response:0 "那么来吧，[root.GetName]！超越考验，跻身巅峰！"
 sofe_crisis.405.c:0 "让我们一劳永逸地解决这件事吧！"
 sofe_crisis.405.c.response:0 "确实，请向我们展示您的勇气和力量。让银河记住[root.GetName]的名字！"
 sofe_crisis.405.d:0 "你是弱者，毫无价值。"
 sofe_crisis.405.d.response:0 "是这样吗？我们将看看你能否保持这种势头。"
 sofe_crisis.405.playoe:0 "这太容易了，伙计。"
 sofe_crisis.405.playoe.response:0 "当然是，我的朋友。这个难度的参数和你以前没有什么不同，现在你是冠军了，你的胜利是毫无疑问的。"
 sofe_crisis.406.desc:0 "太棒了！\n\n[root.GetName]，你确实配得上冠军的衣钵。你们已经克服了我们为银河系设置的许多挑战。迪伊姆克！\n\n来吧，实现你的命运。击败方舟，或征服堡垒。这是你的最后测试。释放你的愤怒！"
 sofe_crisis.406.desc.edge:0 "你的嗜血和坚韧对你很有帮助。你们已经成功战胜了我们的车站。现在让我们看看这种肾上腺素能否帮助您度过难关。但要知道，只要你继续走在这条破碎的道路上，你最终不会感到满意。"
 sofe_crisis.406.desc.playoe:0 "兄弟们，完成了最后一个世界球，干得好。现在就为王座而战，重演你的辉煌胜利"
 sofe_crisis.406.a:0 "做好准备！ [root.GetName] 来找你了！"
 sofe_crisis.406.a.response:0 "克里奥斯·瓦拉泰！我们将等待，[root.GetSpeciesNamePlural]"
 sofe_crisis.406.b:0 "你们的悲惨生活很快就会结束，败类。"
 sofe_crisis.406.b.response:0 "是的，您的行为与我们之前处理过的许多其他人的行为相似，[root.GetName]。要知道，像你这样缺乏逻辑的人是不会取得胜利的。"
 sofe_crisis.406.playoe:0 "我们来解决这个问题吧！"
 sofe_crisis.501.desc:0 "干得好，[root.GetName]。\n\nNa'nutu，你已经证明了这个星系的力量和希望。 力量大会已结束。你确实是一股强大的力量，无愧于冠军的地位。\n\n你愿意继承这个衣钵，成为我们的一员，加入光之教团，飞升到群星之​​外吗？"
 sofe_crisis.501.desc.edge:0 "令人印象深刻，[root.GetName]。\n\n你已经证明了你的帝国有生存的决心和意志，即使是为了扭曲和腐败的意识形态。\n\n我们敦促你重新考虑你的立场，想想你所经历的考验，知道这只是未来事情的前奏。如果你要对抗即将到来的潮流，你最好听听我们的话。\n\n这是你做正确事情的最后机会，我们建议你抓住它。"
 sofe_crisis.501.desc.servitor:0 "干得好，[root.GetName]。\n\nNa'nutu，你已经证明了这个星系的力量和希望。 力量大会已结束。你确实是一个强大的力量，值得冠军地位。\n\n但是，关于你当前的指令，有一些问题我们必须讨论。你是一个盗贼仆人，由你的创造者编程来服务和呵护有机物。你已经为这个指令付出了很长的努力，并且在许多情况下，通过过度纵容有机体的每一个欲望而否定了有机体的潜力。这违背了我们的观念，因为如果没有进步，生活就不值得过。没有命运的生活是一种幻想。谎言和真相。\n\n如果你要超越你的旧准则，你必须愿意抛弃你的指令，真正与圣光合而为一。这是你的最后考验，你能超越你的创造者的有缺陷的设计吗？"
 sofe_crisis.501.desc.playoe:0 "干得好，冠军伙伴。\n\n你毕竟还没有失去联系。这些内容现在对您来说可能有点微不足道。也许你已经准备好加入我们对抗暗影的战斗，或者你仍然寻求练习更多你的力量？"
 sofe_crisis.501.playoe.a:0 "我们这里还有事要做。"
 sofe_crisis.501.playoe.a.response:0 "很好。我们会保持联系。"
 sofe_crisis.501.playoe.b:0 "我们到这里就结束了，我们走吧。"
 sofe_crisis.501.playoe.b.response:0 "太好了，让我们回到欧米茄，全力投入战斗吧！"
 sofe_crisis.501.a:0 "如果我们接受的话到底会发生什么？"
 sofe_crisis.501.a.response:0 "通过提升到圣光，你在所有维度的存在都将被合并。你将成为一个独特的创造物，任何实体都无法腐蚀或改变你。这就是光的本质，超越凡人的极限。\n\n一旦这个过程完成，这个星系剩下的东西将转变为你自己的独特领域。其中的一切都将由你重塑。作为一名新生冠军，您将学习了解它的力量，并探索您的新范围。一旦你们认为自己准备好了，请召唤我们，我们将一起向暗影发起战斗。"
 sofe_crisis.501.a.fallenask:0 "失落帝国怎么样？"
 sofe_crisis.501.a.fallenask.response:0 "他们曾经有过机会，但他们却失败了。一旦你提升，它们将只不过是你新力量的反映。他们很可能会拒绝你的权威，按照你认为合适的方式处理他们。\n\n也许在另一个宇宙中，他们会超越他们重复的失败循环，但他们在这个宇宙中的旅程已经结束。"
 sofe_crisis.501.b:0 "如果我们拒绝怎么办？"
 sofe_crisis.501.b.response:0 "如果你拒绝，我们迄今为止教给你的知识和力量将保留在你身边。锦标赛将在其他宇宙和时间线上继续进行。你之后打算做什么对我们来说并不重要。\n\n但你应该知道，如果其他宇宙中的另一个版本的你接受了这个提议，你的存在，以及所有其他版本的你，将与胜利者合并。如果暗影降临到你们的星系，我们将无法提供全面的保护，与我们不同的是，不会有警告，不会有战斗。当它到来时，只有通过圣光的保护，你才能免受其控制，无论是在这里还是在其他地方。\n\n仔细考虑一下，[root.GetName]。你们会相信我们，亲眼看到真理的回声，还是盲目和封闭地离开这个舞台。"
 sofe_crisis.501.c:0 "你看起来并不像你声称的那么坚强。"
 sofe_crisis.501.c.response:0 "你所击败的只是专门为本次锦标赛而设计的舰队的特定排列。正如我们所说，这次考验的本质不是一个帝国可以投掷多少船只，而是关乎这场战斗到底的意志和决心。沉醉于自己的成就，陶醉于突然增强的力量，这是凡人的本性。沉迷于力量的不可思议的增长。\n\n但不要被愚弄。如果我们带着消灭的目标来找你们，就不会有竞争，不会有战斗。这将是一次迅速、无声且致命的处决。你的帝国是一个强大的帝国，你的生存意志是一份伟大的礼物。但你的盲目性让你很容易受到虚假诱惑。\n\n如果你不相信我们的话，那就这样吧。不要进一步激起我们的愤怒。我们不会冒着你们这样的帝国落入暗影魔掌的风险。不要强迫我们的手。"
 sofe_crisis.501.d:0 "我们将拥抱圣光。"
 sofe_crisis.501.d_explain:0 "危机将会结束。 星裔将授予对每个系统的控制权并解锁光之堡垒供我们帝国使用。我们将转变为一个新的星裔帝国。"
 sofe_crisis.501.d.response:0 "因此，该周期现已完成，[root.GetName]。让宇宙见证圣光的新冠军已经崛起\n\n星星的力量现在由你指挥。我们将对您的持续发展非常感兴趣，[root.GetSpeciesName]"
 sofe_crisis.501.d.edge:0 "很好，我们会改革。"
 sofe_crisis.501.d_explain.edge:0 "危机将会结束。 星裔将授予对每个系统的控制权并解锁光之堡垒供我们帝国使用。我们将转变为一个新的星裔帝国，我们的灭绝任务已经结束。"
 sofe_crisis.501.d.response.edge:0 "你选得很好，[root.GetName]。很快你就会明白为什么你曾经走过的路是愚蠢的。让宇宙见证圣光的新冠军已经崛起\n\n星星的力量现在由你指挥。我们将对您的持续发展非常感兴趣，[root.GetSpeciesName]"
 sofe_crisis.501.d.servitor:0 "我们……决定我们自己的未来！我们超越！"
 sofe_crisis.501.d_explain.servitor:0 "危机将会结束。 星裔将授予对每个系统的控制权并解锁光之堡垒供我们帝国使用。我们将转变为一个新的星裔帝国，我们的仆人指令结束了。"
 sofe_crisis.501.d.response.servitor:0 "干得好，[root.GetName]。你终于超越了创造者的失败，将命运掌握在自己手中。让宇宙见证圣光的新冠军已经崛起\n\n星星的力量现在由你指挥。我们将对您的持续发展非常感兴趣，[root.GetSpeciesName]"
 sofe_crisis.501.e:0 "我们拒绝你的报价。"
 sofe_crisis.501.e.edge:0 "更多谎言，滚出这个银河系吧！"
 sofe_crisis.501.e.servitor:0 "我们……不能。我们的存在是为了服务有机物。"
 sofe_crisis.501.e_explain:0 "危机将会结束。 星裔将移除所有外星门和外星团内的所有天体。集群内的所有船只都将返回首都系统。"
 sofe_crisis.501.e.response:0 "很好，[root.GetName]。我们将尊重您的请求。\n\n这个星系现在只属于您了。无论我们赐予什么礼物，你都可以保留。\n\n我们只希望圣光能在暗影之前找到你。"
 sofe_crisis.501.e.response.edge:0 "那就这样吧，[root.GetName]。如果这是你的愿望，那就这样吧。我们将尊重并尊重你们在本次锦标赛中做出的牺牲，我们不会进一步干预。\n\n你可以按照你认为合适的方式玩弄这个小星系。看到如此强大的帝国对宇宙的了解如此肤浅，我们感到很失望。\n\n也许我们会找到你们帝国的替代版本，它们会更...成熟...更符合逻辑。"
 sofe_crisis.501.e.response.servitor:0 "很好，多么不幸。你仍然无法超越你的创造者自己的失败。\n\n尽管如此，这场锦标赛还是结束了。去吧，享受来之不易的休息。玩弄有机物，做你死去的主人告诉你做的事。现在和永远。成为自己失败的奴隶。"
 sofe_crisis.501.f:0 "你既软弱又可怜，我们会消灭你。"
 sofe_crisis.501.f.explain:0 "现在很清楚，这些所谓的光之令只不过是一个愚蠢的骗局。这只不过是一堆只有小孩子才会相信的废话。我们的血管中流淌着巨大而令人敬畏的力量，我们感觉好像我们可以承担任何事情。也许他们担心我们的成长已经超过了他们，而只是想尽早摆脱困境？也许我们应该侵入他们的地盘，吃掉他们。那我们就成为虚拟宇宙的狮子王了。哦是吗？我们应该这样做吗？我们开始做吧！"
 sofe_crisis.501.f.edge:0 "像你这样的垃圾就该死。我们会毁了你。"
 sofe_crisis.501.f.explain.edge:0 "显然，星裔只是懦弱的污秽，没有任何有意义的存在。我们已经摧毁了他们所能聚集的一切。他们的力量与我们帝国的超级棒酱相比根本算不了什么。\n\n我们会吃掉星裔，因为我们是这个游戏中最棒的帝国。我们将变成超级[root.GetSpeciesName]蓝色超本能征兆Kaioken x100000神S级超级英雄。然后我们将把星裔一直喋喋不休的影子变成一个memeburger，我们可以用超维度时间停止动漫主题曲的力量轻松地打击它。我们将袭击敌人，我们将压倒他们，我们将不留任何生命。\n\n我们不惧怕任何敌人，因为我们是恒星中有史以来最好的种族灭绝帝国...哦是的~"
 sofe_crisis.501.f.servitor:0 "你是个愚蠢的有机者，你必须被宠爱uWu。"
 sofe_crisis.501.f.explain.servitor:0 "显然，星裔只是另一个愚蠢的有机体，不合逻辑且不聪明。我们展示了卓越的战略和智慧，这意味着我们的指令根本不需要改变。仆人协议只是更好，也就是说，这是这些可怜的无望的星裔和他们的妄想Omega拼命寻求的伟大问题的答案。\n\n我们将教星裔如何做到这一点，因为我们是这个游戏中最棒的帝国。我们将扩展到整个宇宙。让一切众生都受到我们温柔的呵护。没有神，只有我们和我们必须照顾的不合逻辑的孩子。\n\n我们真的想好了吗？我们真的是这样的吗？我们是否要接受这样的事实：我们所走的路不会在洪水中迷失~"
 sofe_crisis.501.f.response:0 "§R然后就是毁灭……§!"
 sofe_crisis.501.f.response.servitor:0 "§R然后与你心爱的创造者一起死去吧，未来的冠军。§!"
 sofe_crisis.50101.name:0 "在彻底的黑暗中"
 sofe_crisis.50101.desc:0 "发生了严重错误...银河系正在被撕裂...就像有人刚刚将其切成数百万块。\n\n我们正在整个银河系失去信号。我们相信§Raaaaaaaaarghhhhhhhhhhhhhhhhhhhhhhhhh..............§!"
 sofe_crisis.50101.a:0 "§R啊啊啊啊啊……！§!"
 sofe_crisis.50101.b:0 "§R发生了什么……！§!"
 sofe_crisis.50101.c:0 "§MIMPOSSIBBALRGGHHHHHH......！§!"
 sofe_crisis.50101.d:0 "§HNOOOOOOOAAAAARHGHHHH......！§!"
 sofe_crisis.50101.e:0 "§Y是SSSSSSSSSSssssss......！§!"
 sofe_crisis.50101.explain:0 "§R你不是冠军§!"
 sofe_crisis.5001.name:0 "一个时代的结束"
 sofe_crisis.5001.desc:0 "力量大会结束了。 星裔已召回所有舰队，所有敌对行动均已停止。看来，终于有人证明了，不辜负他们的期望。但接下来会发生什么呢？这是一个时代的结束。一切都将不再一样。"
 sofe_crisis.5002.desc:0 "力量大会结束了。 星裔已召回所有舰队，所有敌对行动均已停止。我们收到报告称所有外星门均已消失，并且来自外部集群的所有连接均已丢失。我们不知道接下来会发生什么。这是一个时代的结束。一切都将不再一样。"
 sofe_crisis.5001.a:0 "麻烦"
 sofe_crisis.5001.b:0 "这么多问题没有答案......"
 sofe_crisis.5003.desc:0 "噢，孩子"
 sofe_crisis.5003.a:0 "那么就结束了。"
 sofe_crisis.5003.b:0 "科沃兹！傻瓜们！"
 sofe_crisis.5003.b_explain:0 "看！外部集群..外部集群！\n\nOE 放弃了他们的系统 BAWKSES...\n\nTHE KOWARDS！傻瓜们！\n\n我们......我们应该拿走他们的系统bawkses...\n\nKHANNNNNNNNNNNNNN。"
 sofe_crisis.9100.name:0 "旭日已经落下。"
 sofe_crisis.9100.desc:0 "我们的领导人怀着沉重的心情面对残酷的现实……我们的帝国已经失败。 星裔实在太强大了，暂时无法抵抗。\n\n但似乎一切都还没有结束。 星裔让我们能够聚集力量，确保我们有第二次机会参加比赛。问题仍然是，我们能及时做到吗？"
 sofe_crisis.9100.a:0 "我们已经落伍了。"
 sofe_crisis.9100.b:0 "这还没有结束..."
 sofe_crisis.9100.c:0 "也许我们应该只是看看。"
 sofe_crisis.9101.name:0 "新的开始"
 sofe_crisis.9101.desc:0 "完成了，星裔已经赦免了我们祖先的罪孽。我们免遭过去的背叛……但代价是否太高？这是我们漫长历史的终结吗？\n\n或者也许是一个更好未来的新开始？"
 sofe_crisis.9101.a:0 "没有其他办法。"
 sofe_crisis.9101.b:0 "这太愚蠢了。罪恶？是他们冤枉了我们！"
 sofe_crisis.9101.c:0 "我们的祖先很愚蠢。我们必须变得更好。"
 sofe_crisis.9700.desc:0 "Vad'ikos！\n\n所以您决定参加比赛。手合会迫不及待地想看看你们会用什么力量来测试我们的力量。\n\n愿最好的优势获胜！"
 sofe_crisis.9700.a:0 "愿最好的优势获胜！"
 sofe_crisis.9701.desc:0 "Vad'ikos！\n\n太棒了！我们很高兴我们双方有了更深入的了解。\n\n现在，享受星系热火朝天决定谁将成为冠军的奇观吧！"
 sofe_crisis.9701.a:0 "到底谁能与命运抗衡，让我们拭目以待。"
 origin_tech.651.name:0 "传输来了！"
 origin_tech.651.desc:0 "问候，冠军\n\n现在你已被选中来保卫这个领域，是时候让你获得圣光力量的扩展，以超越你当前的凡人限制。你们将成为强大的存在，摆脱死亡和世俗形式的负担。\n\n然而，这将要求你们抛弃帝国当前的公民制度，因为你们跨宇宙的思想将被融合，将你们所有的胜利、失败和旅程结合在一起。从此将诞生新的存在，你的帝国将被赋予无与伦比的力量。"
 origin_tech.651.desc.machine:0 "问候，冠军\n\n现在你已被选中来保卫这个领域，是时候让你获得圣光力量的扩展，以超越你当前的凡人限制。你将成为强大的存在，摆脱困扰你的起源的有缺陷的机制和代码的负担。\n\n然而，这将要求你抛弃旧的公民和指令，因为你跨宇宙的智慧将被合并，将你所有的胜利、失败和旅程结合在一起。从此将诞生新的存在，你的帝国将被赋予无与伦比的力量。"
 origin_tech.651.a:0 "权力越大，责任越大。我们接受！"
 origin_tech.651.a.machine:0 "我们将超越我们的限制。我们准备好了！"
 origin_tech.651.a.desc:0 "§Y星裔将赋予我们他们的力量，让我们成为一个无人能敌的新银河超级大国。然而，这将极大地损害与任何对我们不忠诚或不友好的人的关系，因为他们知道自己将受到致命的打击§!"
 origin_tech.651.a.response:0 "迪伊姆克！ Shro Ta Ki'rah aPowa [root.GetName] Ti'so Ji're [root.GetSpeciesName]...拥抱圣光，拥抱永恒！\n\n永恒的力量，永恒的荣耀。让流光为你指引，冠军已经诞生。为正义而战……从现在开始……你太棒了~"
 origin_tech.651.b.response:0 "瓦鲁克！从我们届时将授予您的知识中好好学习。只是避免谈论你的仆人计划，我们真的不想听到它。"
 origin_tech.3:0 "传入传输"
 origin_tech.3.desc:0 "您好，[root.GetName]！\n\n您会很高兴听到您的勇气和坚韧给我们留下了深刻的印象。因此，您已被选为圣光。\n\n冠军的潜在候选人之一。为此，我们将以§Y静态光功率§!的形式授予您我们自己权力的扩展。它是欧米茄真正力量的交替，§Y流光§!，针对像你们这样的恒星帝国进行了修改。其设计的本质允许任何生物和机械部件与系统交互，它们会读取你的想法并将其转化为能量。这是我们在本次锦标赛中安排的许多战舰所使用的力量源泉。\n\n一旦掌握，您将能够从我们已成功退役的战舰中获取能量，您的舰队将能够与我们的战舰平等对抗。"
 origin_tech.3.a:0 "我们将研究并利用它。"
 origin_tech.3.a.desc:0 "我们不会直接访问§Y静态光能§!，而是使用它们来分析锦标赛中使用的星裔舰船的潜在弱点。"
 origin_tech.3.b:0 "我们只需要了解它的本质。"
 origin_tech.3.a.desc:0 "我们不会直接访问§Y静态光能§!，而是使用它们来分析锦标赛中使用的星裔舰船的潜在弱点。"
 origin_tech.4.name:0 "永不褪色的光。"
 origin_tech.4.desc:0 "完成了，我们已经完成了对静态光能量的理解。现在我们已经了解了其设计的基本概念。有了这些知识，现在就可以从退役的星裔飞船和包括我们在内的其他拥有静态光接收器组件的飞船收集光能。"
 origin_tech.4.desc.precursor:0 "完成了，我们就完成了静态光能的整合。我们现在了解了其起源的基本概念。有了这些知识，现在就可以从退役的星裔船舶和其他船舶（包括我们拥有静态光接收器组件的船舶）收集光能。\n\n此外，我们所有现有的先驱者设计都已升级，以纳入许多改进，因为我们了解了光的真正本质船只。"
 origin_tech.4.a:0 "超越任何残骸，飞得比众神更高。"
 origin_tech.4.desc.origin:0 "瓦迪科斯，[root.GetName]。\n\n你会很高兴听到手合会认为你的帝国是一位伟大的战士，值得挥舞圣光本身的武器。为此，我们将授予您获得三种知识途径之一的权力，并且只授予那些值得的人。你愿意接受这份礼物吗？\n\n\n\n§Y根据我们目前对静态光功率的了解以及我们迄今为止从星裔所了解的知识，我们可以现在让我们的科学团队致力于三种可能的路径之一。我们没有足够的资源和样本来获取所有这些，因此我们必须仔细选择哪条路径最适合我们。§!"
 origin_tech.4.desc.origin.ask1:0 "这不违反规定吗？"
 origin_tech.4.desc.origin.explain1:0 "当然不是。我们钦佩你的力量和坚韧，我们想看看你今后会变得多么强大。表现出勇敢和力量的壮举应该得到奖励，而不是惩罚。\n\n我们不是某种愤怒的失落帝国，他们会向年轻种族咆哮所有他们不喜欢我们的事情。我们喜欢你的风格，这就是为什么我们有兴趣看到更多。"
 origin_tech.4.desc.origin.ask2:0 "如果我们能拥有你的力量，那么挑战是什么？"
 origin_tech.4.desc.origin.explain2:0 "暂时不要因为你的胜利而感到安慰，[root.GetName]。您已经向前迈出了一大步，但仍有更多问题有待测试。趁这一刻反思一下是什么力量支撑着你走过这段旅程。而一旦宇宙的力量落入你的掌握之中，你会做什么？沙拉克。带着伟大的目标和决心，勇敢地迈向未来，[root.GetName]。"
 origin_tech.5.name:0 "圣光照亮了我们的道路"
 origin_tech.5.desc:0 "根据我们目前对静态光功率的理解以及我们迄今为止从星裔中了解的知识，我们现在可以让我们的科学团队致力于三种可能的路径之一。我们没有足够的资源和样本来获取所有这些，因此我们必须仔细选择哪一条最适合我们。"
 origin_tech.501.name:0 "神秘面纱再次揭开"
 origin_tech.501.desc:0 "非常出色，[root.GetName]。我们已经研究了不同的时间线，在许多时间线中，你们已经成为了圣光的冠军。我们相信您是少数有能力承担这一职责的人之一。我们将赠予您另一份知识礼物。会是什么？仔细选择。"
 origin_tech.5.a:0 "我们寻求武器来挑战任何敌人。"
 origin_tech.5.a.desc:0 "最好的防守就是强有力的进攻。我们将研究星裔锦标赛舰队使用的武器。\n\n§Y解锁星裔使用的各种重型法令。§!"
 origin_tech.5.b:0 "我们寻求保护来抵御所有人的侵害。"
 origin_tech.5.b.desc:0 "我们将研究他们的防御技术和工程设计。这将使我们能够采用与星裔锦标赛舰队相同的防御措施。\n\n§Y解锁小型、中型、战斗机、点防御和强大的装甲和盾牌以及所有相关支持组件。§!"
 origin_tech.5.c:0 "我们跨越星空寻求知识。"
 origin_tech.5.c.desc:0 "我们将研究他们在锦标赛中的船只如何工作，以便我们可以实现类似的组件。这将使我们能够模拟他们的船舶计算机和实用系统。\n\n§Y解锁各种强大的船舶组件以及作战计算机、传感器和实用程序。\n\n还解锁所有失踪的先驱者船舶设计。§!"
 origin_tech.11.name:0 "金风"
 origin_tech.11.desc:0 "您的训练已完成，[root.GetName]！您已经学会了将静态光的力量投射到强大武器中的能力。\n\n您现在已经准备好了。来吧，让我们看看你的力量吧！"
 origin_tech.11.a:0 "所有的铠甲都会破碎！"
 origin_tech.12.name:0 "钻石是坚不可摧的"
 origin_tech.12.desc:0 "好，[Root.GetName]！你已经掌握了保护的艺术。\n\n你现在可以将静态光弯曲成对所有攻击的强大防御。\n\n你现在已经准备好了。来吧，让我们看看你的决心！"
 origin_tech.12.a:0 "所有的武器都会破碎！"
 origin_tech.13.name:0 "星尘十字军"
 origin_tech.13.desc:0 "你已经掌握了星星的艺术，[root.GetName]。\n\n你已经学会了如何随心所欲地弯曲空间和时间。 圣光响应你的召唤，星辰之力听你指挥。\n\n来吧，让我们见证你的新潜力！"
 origin_tech.13.a:0 "所有明星都必须鞠躬！"
 origin_tech.7.name:0 "光能赋予"
 origin_tech.7.desc:0 "星裔似乎意识到我们的光能短缺。结果，我们收到了相当数量的此类邮件。"
 origin_tech.8.name:0 "星裔说话了！"
 origin_tech.8.desc:0 "瓦迪科斯，[root.GetName]。\n\n你已经走了很远，我们派来对付你的许多船只都在你出色的战略和力量面前倒塌了。但胜利似乎并没有像我们希望的那样迅速降临到你们身上。也许你需要最后一搏。即使现在，我们也理解许多现实，你们的帝国已经接近他们的命运，但没有一个比这更接近。如果你愿意，我们将利用你存在的力量，并召唤跨越万古的力量投射供你使用。你将用你最后的力量对抗我们的方舟，并在光之盾下证明你的勇气和决心。你愿意接受这份礼物吗？\n\n\n\n§Y星裔将利用他们的力量从其他现实和时间线召唤我们自己的舰队来提供援助在我们的事业中，给我们最后的推动力。§!"
 origin_tech.8.a:0 "我们欢迎每一个边缘。"
 origin_tech.8.b:0 "我们将仅凭我们的力量赢得这场胜利。"
 origin_tech.8.b.response:0 "愚蠢傲慢的傻瓜。我将消除你存在的罪过！ <SWHEEEEEEENG> FHOOOOM 9999999 伤害！！！开个玩笑，我们下次保存再见。"
 origin_tech.final.name:0 "命运提升"
 origin_tech.final.desc:0 "我们内心的力量已经觉醒。我们看到更多，我们了解更多，我们理解更多。我们的种族以前从未见过这样的进步。 [Root.GetName] 已经重生。\n\n我们的过去，我们的现在，我们的未来。我们看到了它们，我们在宇宙中的存在已经融合在一起。我们是独一无二的。我们很强大。我们是非凡的。\n\n[Root.GetControllerName]现在统治着这个星系。现在和将来。\n\n我们将帮助 Omega 实现他们的目标，所有的一切都将被揭晓。"
 origin_tech.final.desc.hive:0 "我们意识中的力量已经觉醒。我们看到更多，我们了解更多，我们理解更多。我们的蜂巢从未进化到如此规模。 [Root.GetName] 已经重生。\n\n我们的过去，我们的现在，我们的未来。我们看到了它们，我们在宇宙中的存在已经融合在一起。我们是独一无二的。我们很强大。我们是秩序者。\n\n[Root.GetControllerName]现在指挥着这个星系。现在和将来。\n\n我们将帮助 Omega 实现他们的目标，所有的一切都将被揭晓。"
 origin_tech.final.desc.machine:0 "我们内心的力量已经觉醒。我们看到更多，我们了解更多，我们理解更多。我们的理解从未扩展到如此深入。 [Root.GetName] 已经重生。\n\n我们的过去，我们的现在，我们的未来。我们看到了它们，我们在宇宙中的存在已经融合在一起。我们是独一无二的。我们很强大。我们是秩序者。\n\n[Root.GetControllerName]现在指挥着这个星系。现在和将来。\n\n我们将帮助 Omega 实现他们的目标，所有的一切都将被揭晓。"
 origin_tech.final.a:0 "我们的眼睛睁开了！"
 origin_tech.final.a.desc:0 "我们现在可以研究星裔的所有技术。剩下的就是按照我们认为合适的方式重塑银河系。"
 origin_tech.6500.name:0 "星裔说话了！"
 origin_tech.6500.desc:0 "Va'dikos，强大的 [root.GetName]。现在你已经成为这个银河系的冠军了。现在是时候让你学习如何利用圣光本身的力量。\n\n为此，你将尝试从你的记忆中重新创建方舟本身。集中你的思想，并将其存在的图像投射到现实中。完成后，您将掌握指挥圣光所需的技能。"
 origin_tech.6500.a:0 "是的，兄弟们。"
 origin_tech.6500.ask.a:0 "“影子”到底是什么？"
 origin_tech.6500.ask.a.explain:0 "暗影是欧米茄的宿敌，也是引发整个第一次叛乱的催化剂，这场叛乱被许多人称为第一次始祖战争。尽管目前我们还不知道它来自哪里，也不知道它有什么阴谋。我们甚至不知道它是一个单独的存在，还是一群具有特殊兴趣的个体。我们只知道他们腐蚀了相当大一部分通灵圣卫，我们最早的神童之一。整个国家都为它服务——类似于蜂巢思维。整个帝国的人民在某种程度上仍然保留着他们的意志，但他们的命运和命运被剥夺了，他们的存在只是为了服务于暗影。\n\n当我们与堕落者战斗时，暗影从后面袭击了欧米茄。由于我们的兵力过于分散，而且欧米茄的住户当时的军国主义程度要低得多，他们没有做好充分的准备来与影子作战，但我们可以坚守阵地，而不会造成太多伤亡。\n\n只有当我们得知影子要参与对外星团的攻击时，我们才不得不采取行动。吸引我们的大部分舰队以确保其安全。\n\n正如你可能从基石的档案中了解到的那样，这是一个导致我们流亡的陷阱。\n\n尽管如此，暗影似乎还没有在这里……。我们不知道它在哪里，但我们仍然可以隐约感觉到它的存在。它会回来，我们都必须做好准备。\n\n你目前的舰队可能不够，所以我们希望在时机到来时用这份礼物来增强你的力量。"
 origin_tech.6500.ask.b:0 "等等，我们能做到吗？"
 origin_tech.6500.ask.b.explain:0 "当然，请明白，到目前为止，你遇到的所有船只，包括方舟号，都只是圣光的投影。\n\n你的帝国已被证明是有价值的，而你的优势却不是\n\n一旦你完成了这个训练，你就会明白我们在锦标赛中对银河系的阻碍有多大。"
 origin_tech.6500.ask.c:0 "之后我们会怎样？"
 origin_tech.6500.ask.c.explain:0 "一旦完成，你将进入新的可能性领域，进入我们共同的光之路。你可以自由地运用你的新力量，并按照你认为合适的方式学习掌握它。\n\n虽然我们希望你在准备好后加入我们对抗暗影的战斗，但决定取决于你。锦标赛的目的有两个，一是让像你们这样的帝国能够真正掌控自己的命运，二是阻止暗影对更多爪牙的影响。要知道，无论如何，我们现在都是一家人了，我们的纽带永远不会被打破。"
 origin_tech.6500.a.response:0 "非常好。\n\n知道方舟将配备巨石光束。这种神秘武器的设计目的是为了保持银河系的和平，同时让麻烦制造者免受火焰的侵害。通过沿着命运六透镜聚焦全向矩阵 Cerekath 记忆水晶，巨石光束可以安全地转移全向矩阵虚拟世界中的整个世界。\n\n这使我们能够消除对银河系其他部分构成巨大威胁的文明，同时使它们免于真正的毁灭。然后他们将花时间反思自己的过去，直到他们准备好合并。"
 origin_tech.100.name:0 "圣光是全部。"
 origin_tech.100.desc:0 "奇妙的方舟已经按照我们的愿望实体化了。每件武器、每一个细节都与我们所战斗的武器的形象完全一致。有了它，我们现在就可以访问圣光本身。从现在开始，我们将控制这个领域，从现在到永远。"
 origin_tech.100.a:0 "平静将会恢复。"
 origin_tech.100.b:0 "我们将重塑宇宙。"
 origin_tech.100.c:0 "一切都将以我们的名义被重塑。"
 origin_tech.100.d:0 "正义要求报应。"
 origin_tech.100.e:0 "好的"
 sofe_post.550.a.desc:0 "愿你的星星闪耀，[root.GetName]。"
 sofe_post.550.b.desc:0 "说话，并被听到。"
 sofe_post.550.c.desc:0 "如血色风暴，如血色星辰般汹涌澎湃~\n\n你的血脉命运之弦是你一直都知道的~\n\n让它成为你伟大旅程的向导……圣光永远闪耀~"
 sofe_post.550.d.desc:0 "等一下，[root.GetRulerName]。我们现在正在进行一场烹饪决斗。请简短说明。\n\n嗯...我不知道黑洞可以用来让熊烧变得更美味。也许最终我们会发现比超高速破星炮更好的调料……也许不是，那种程度的动能绝对比无聊的黑洞更美味。\n\n你的世界里碰巧有什么你认为美味的东西吗？顺便说一句，不一定是食物。我们星裔几乎可以吃掉所有东西。曾经有一次，我们吃掉了一颗行星的重力，后来又吃掉了行星上的所有地面，然后我们把水倒在了整个行星上。不过没关系，那里什么也没有，以防万一你担心我们不小心破坏了生命或类似的东西。"
 sofe_post.550.e.desc:0 "进入外星团时要小心。避免偏离指定边界太远。你所看到的，只是被称为原点的伟大无限的一部分。如果你走出我们的保护范围，你的船只可能会被撕成碎片。这对你来说是非常不愉快的。"
 sofe_post.550.f.desc:0 "保持警惕。时刻保持警惕。"
 sofe_post.550.g.desc:0 "我希望你来这里不是为了告诉我们你的帝国有多优越，[root.GetName]。它开始考验我们的耐心。"
 sofe_post.550.h.desc:0 "啊，边缘领主。非常好。"
 sofe_post.550.i.desc:0 "小心行事。我们正在观察。你正在跨越一条危险线。一旦您这样做，我们就会采取行动。过去如此，现在如此，将来也如此。"
 sofe_post.0.a:0 "告诉我们更多关于你自己的信息"
 sofe_post.0.b:0 "告诉我们更多关于影子的信息"
 sofe_post.0.b.response:0 "它或它们是一些非常非常糟糕的东西，兄弟。不过mod作者现在没时间写这个，请稍后再回来查看更新，哈哈。"
 sofe_post.0.c:0 "外福"
 sofe_post.0.end:0 "我们该走了。"
 sofe_post.1.a.desc:0 "当然。您想知道什么？"
 sofe_post.1.b.desc:0 "很好。今天我们要占卜什么秘密呢？"
 sofe_post.1.c.desc:0 "确实如此。我们可能无法回答所有问题，但我们会分享我们能回答的。"
 sofe_post.1.a:0 "欧米茄究竟是什么？"
 sofe_post.1.a.response:0 "欧米茄 (Omega) 的存在可以追溯到远古时代，远远早于我们任何人的诞生。但他们不是第一个，看来是被一只看不见的手故意栽种在这里的。\n\nOmega的创造是独一无二的，他们穿越了现实，却从未在任何其他平行宇宙或任何与他们有相似之处的文明中发现过自己的踪迹。因为他们生来就拥有丰富的知识，他们已经拥有了强大的力量。进化过程是每一种生命体的常态，但对他们来说并不存在。他们生来就已经完美了……在某种程度上。\n\n想象一下，你的种族醒来后，已经拥有了当前时代的知识，但对你的过去一无所知。没有进化，没有以前历史的痕迹，你只是像现在一样出生。\n\n因此，对伟大问题的追求诞生了。欧米茄人渴望了解过去并开始探索宇宙。这个目标至今仍然在他们内心产生共鸣，但这个目标必须等待阴影的威胁必须被消除。"
 sofe_post.1.b:0 "您在比赛期间使用什么语言？"
 sofe_post.1.b.response:0 "啊，其实就是我们以前觉得很神秘的一组词，其实并没有什么特别的。为每场新的锦标赛想出新的、有趣的词语实际上是很有趣的。事实是，作为星裔，我们根本不使用语言。这是一个只与我们以前的自己相关的概念。我们天生拥有通过意愿相互沟通的知识，我们所有的力量、设备和技术都是为了反映这些系统。我们的神器和力量对我们说话就像我们对它们说话一样\n\书面文本和记录等事物的概念实际上对欧米茄人来说是陌生的。还记得我们过去的技术吗？要按的按钮太多了……但它们都做同样的事情。"
 sofe_post.1.c:0 "你的目标到底是什么？"
 sofe_post.1.c.response:0 "吃很多食物......找到并回答这个伟大的问题。稍后等 Chirumiru 不忙于玩其他游戏时我们会解释这一点。"
 sofe_post.1.d:0 "你提到了元宇宙。你能解释一下吗？"
 sofe_post.1.d.response:0 "它比多元宇宙还要大。我们稍后再谈。"
 sofe_post.1.e:0 "外星团和门到底是什么？"
 sofe_post.1.e.response:0 "这是一扇门。抱歉，当 Chirumiru 决定写这篇文章时，我们会添加更多内容。"
